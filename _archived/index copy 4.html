<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="data.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #F1F5F9;
      color: #1E293B;
      min-height: 100vh;
    }

    /* ─── Header ─── */
    .header {
      background: #0F172A;
      color: #F8FAFC;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .45);
    }

    .header-left h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .header-left .sub {
      font-size: .72rem;
      color: #94A3B8;
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      font-size: .7rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: #1E40AF;
      color: #DBEAFE;
      letter-spacing: .3px;
    }

    .btn-refresh {
      font-size: .72rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1E293B;
      color: #94A3B8;
      cursor: pointer;
      transition: all .15s;
    }

    .btn-refresh:hover {
      border-color: #3B82F6;
      color: #BFDBFE;
    }

    /* ─── Tier 1: type tabs ─── */
    .type-tabs-bar {
      background: #1E293B;
      padding: 0 24px;
      display: flex;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .type-tab-btn {
      padding: 13px 22px;
      font-size: .84rem;
      font-weight: 600;
      color: #94A3B8;
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
    }

    .type-tab-btn:hover {
      color: #E2E8F0;
    }

    .type-tab-btn.active {
      color: #F8FAFC;
      border-bottom-color: #3B82F6;
      font-weight: 700;
    }

    /* ─── Tier 2: portfolio sub-tabs ─── */
    .sub-tabs-bar {
      background: #fff;
      border-bottom: 2px solid #E2E8F0;
      padding: 0 24px;
      display: flex;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: thin;
      min-height: 42px;
    }

    .sub-tab-btn {
      padding: 10px 18px;
      font-size: .8rem;
      font-weight: 500;
      color: #64748B;
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
      margin-bottom: -2px;
    }

    .sub-tab-btn:hover {
      color: #3B82F6;
    }

    .sub-tab-btn.active {
      color: #1D4ED8;
      border-bottom-color: #3B82F6;
      font-weight: 700;
    }

    /* ─── Content ─── */
    .content {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    /* ─── Section header ─── */
    .section-hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .section-hdr h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0F172A;
    }

    .type-badge {
      font-size: .65rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .badge-seg {
      background: #DBEAFE;
      color: #1D4ED8;
    }

    .badge-grow {
      background: #D1FAE5;
      color: #065F46;
    }

    .badge-all {
      background: #F3E8FF;
      color: #6B21A8;
    }

    /* ─── KPI Cards ─── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(152px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .kpi {
      background: #fff;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
      border-left: 4px solid #CBD5E1;
    }

    .kpi.blue {
      border-left-color: #3B82F6;
    }

    .kpi.green {
      border-left-color: #10B981;
    }

    .kpi.amber {
      border-left-color: #F59E0B;
    }

    .kpi.red {
      border-left-color: #EF4444;
    }

    .kpi.violet {
      border-left-color: #8B5CF6;
    }

    .kpi.pink {
      border-left-color: #EC4899;
    }

    .kpi.teal {
      border-left-color: #14B8A6;
    }

    .kpi .lbl {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #64748B;
    }

    .kpi .val {
      font-size: 1.65rem;
      font-weight: 800;
      color: #0F172A;
      margin: 5px 0 3px;
      line-height: 1;
    }

    .kpi .hint {
      font-size: .7rem;
      color: #94A3B8;
    }

    /* ─── Chart Grid ─── */
    .cg {
      display: grid;
      gap: 18px;
      margin-bottom: 18px;
    }

    .cg-1 {
      grid-template-columns: 1fr;
    }

    .cg-2 {
      grid-template-columns: 1fr 1fr;
    }

    .cg-3 {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .cg-21 {
      grid-template-columns: 2fr 1fr;
    }

    .cg-12 {
      grid-template-columns: 1fr 2fr;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
    }

    .card h3 {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: #64748B;
      margin-bottom: 16px;
    }

    .chart-wrap {
      position: relative;
    }

    .chart-wrap canvas {
      max-height: 300px;
    }

    .chart-wrap.tall canvas {
      max-height: 380px;
    }

    .chart-wrap.squat canvas {
      max-height: 220px;
    }

    /* ─── Divider ─── */
    .divider {
      height: 1px;
      background: #E2E8F0;
      margin: 24px 0;
    }

    /* ─── No-data state ─── */
    .no-data {
      text-align: center;
      padding: 80px 24px;
      max-width: 520px;
      margin: 0 auto;
    }

    .no-data .icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .no-data h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .no-data p {
      font-size: .9rem;
      color: #64748B;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .no-data code {
      display: inline-block;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: .85rem;
      color: #1D4ED8;
    }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {

      .cg-2,
      .cg-3,
      .cg-21,
      .cg-12 {
        grid-template-columns: 1fr;
      }

      .kpi-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .kpi-row {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 16px 12px;
      }
    }

    /* ─── Portfolio Page — Excel Style ─── */
    .port-header {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
    }

    .port-bar-strip {
      display: flex;
      height: 8px;
    }

    .port-bar-orange {
      width: 33%;
      background: #F59E0B;
    }

    .port-bar-blue {
      flex: 1;
      background: #D1D5DB;
    }

    .port-title-area {
      padding: 14px 20px 16px;
    }

    .port-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0F172A;
    }

    .port-filename {
      font-size: .72rem;
      color: #3B82F6;
      text-decoration: underline;
      margin-top: 3px;
    }

    /* KPI strip — 7 boxes */
    .kpi-strip-7 {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .kpi-box {
      background: #fff;
      border-radius: 8px;
      padding: 13px 10px 11px;
      text-align: center;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .07);
    }

    .kpi-box .kv {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1;
      display: block;
    }

    .kpi-box .kl {
      font-size: .6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: #64748B;
      margin-top: 5px;
      display: block;
    }

    .kpi-box.ko .kv {
      color: #EA580C
    }

    .kpi-box.kb .kv {
      color: #2563EB
    }

    .kpi-box.kr .kv {
      color: #DC2626
    }

    .kpi-box.kp .kv {
      color: #7C3AED
    }

    .kpi-box.kg .kv {
      color: #16A34A
    }

    .kpi-box.kt .kv {
      color: #0D9488
    }

    .kpi-box.ka .kv {
      color: #D97706
    }

    .kpi-box.kk .kv {
      color: #DB2777
    }

    /* Three-column layout */
    .three-col {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }

    .col-section {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
      display: flex;
      flex-direction: column;
    }

    .col-hdr {
      padding: 9px 14px;
      font-size: .66rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: #fff;
    }

    .green-hdr {
      background: #166534
    }

    .orange-hdr {
      background: #9A3412
    }

    .purple-hdr {
      background: #4C1D95
    }

    .teal-hdr {
      background: #0F766E
    }

    .indigo-hdr {
      background: #3730A3
    }

    .col-body {
      padding: 12px 14px;
      flex: 1;
    }

    .sub-hdr {
      font-size: .61rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .6px;
      padding: 7px 0 4px;
      border-bottom: 1.5px solid currentColor;
      margin-bottom: 6px;
    }

    .green-txt {
      color: #15803D
    }

    .orange-txt {
      color: #C2410C
    }

    .purple-txt {
      color: #6D28D9
    }

    .teal-txt {
      color: #0F766E
    }

    .indigo-txt {
      color: #3730A3
    }

    .no-data-note {
      font-size: .67rem;
      color: #94A3B8;
      padding: 4px 0;
      font-style: italic;
    }

    /* Bar rows */
    .bar-row {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
    }

    .bar-track {
      height: 7px;
      background: #E8EDF2;
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    .bar-name {
      font-size: .73rem;
      color: #1E293B;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-stat {
      font-size: .7rem;
      color: #64748B;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Device type drill-down */
    .device-expand-row {
      cursor: pointer;
      user-select: none;
    }

    .device-expand-row .bar-row {
      grid-template-columns: 110px 1fr auto auto;
    }

    .drill-arrow {
      font-size: .65rem;
      color: #94A3B8;
      transition: transform .2s;
      padding-left: 2px;
      flex-shrink: 0;
    }

    .device-expand-row.open .drill-arrow {
      transform: rotate(90deg);
      color: #3B82F6;
    }

    .device-drill-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
      padding-left: 10px;
      border-left: 2px solid #E2E8F0;
      margin-bottom: 4px;
    }

    .device-drill-panel.open {
      max-height: 400px;
    }

    .drill-label {
      font-size: .58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #64748B;
      padding: 4px 0 3px;
    }

    /* Foundation activity strip */
    .activity-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 10px 0;
    }

    .act-card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }

    .act-card .act-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: #1E293B;
      line-height: 1.1;
    }

    .act-card .act-lbl {
      font-size: .58rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #64748B;
      margin-top: 2px;
    }

    .act-card.act-green {
      border-color: #A7F3D0;
      background: #F0FDF4;
    }

    .act-card.act-blue {
      border-color: #BFDBFE;
      background: #EFF6FF;
    }

    .act-card .act-val.green {
      color: #059669;
    }

    .act-card .act-val.blue {
      color: #2563EB;
    }

    /* ESO performance rows */
    .eso-perf-row {
      display: grid;
      grid-template-columns: 120px 1fr 70px 80px 60px;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .eso-perf-row .eso-name {
      font-size: .72rem;
      font-weight: 600;
      color: #1E293B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .eso-perf-row .eso-bar-wrap {
      position: relative;
      height: 14px;
      background: #E8EDF2;
      border-radius: 3px;
      overflow: hidden;
    }

    .eso-perf-row .eso-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .4s;
    }

    .eso-perf-row .eso-bar-label {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      font-size: .58rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 3px rgba(0, 0, 0, .4);
    }

    .eso-perf-row .eso-stat {
      font-size: .65rem;
      color: #64748B;
      white-space: nowrap;
      text-align: right;
    }

    .eso-perf-row .eso-week {
      font-size: .6rem;
      font-weight: 700;
      color: #10B981;
      white-space: nowrap;
      text-align: right;
    }

    .rank-badge {
      display: inline-block;
      font-size: .55rem;
      font-weight: 800;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      text-align: center;
      line-height: 14px;
      margin-right: 3px;
      flex-shrink: 0;
    }

    .rank-1 {
      background: #F59E0B;
      color: #fff;
    }

    .rank-2 {
      background: #94A3B8;
      color: #fff;
    }

    .rank-3 {
      background: #B45309;
      color: #fff;
    }

    /* Progress bands */
    .prog-band-row {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .prog-band-row .pb-label {
      font-size: .68rem;
      font-weight: 600;
      color: #374151;
      white-space: nowrap;
    }

    .prog-band-row .pb-track {
      height: 10px;
      background: #E8EDF2;
      border-radius: 2px;
      overflow: hidden;
    }

    .prog-band-row .pb-fill {
      height: 100%;
      border-radius: 2px;
    }

    .prog-band-row .pb-stat {
      font-size: .66rem;
      color: #64748B;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Device weekly row */
    .dev-weekly-row {
      display: grid;
      grid-template-columns: 110px 1fr 60px 60px 60px;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .dev-weekly-row .dw-name {
      font-size: .71rem;
      font-weight: 600;
      color: #1E293B;
      white-space: nowrap;
    }

    .dev-weekly-row .dw-stat {
      font-size: .65rem;
      color: #64748B;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Gender line */
    .gender-line {
      text-align: center;
      font-size: .8rem;
      font-weight: 700;
      color: #374151;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 6px;
      margin: 8px 0;
    }

    /* Section footer (URSB/PWD/Refugees/AvgRev strip) */
    .section-footer {
      padding: 10px 14px;
      background: #F8FAFC;
      border-top: 1px solid #E2E8F0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .section-footer span {
      text-align: center;
      font-size: .68rem;
      color: #64748B;
      line-height: 1.4;
    }

    .section-footer span strong {
      font-size: .82rem;
      color: #1E293B;
      display: block;
    }

    @media(max-width:1100px) {
      .three-col {
        grid-template-columns: 1fr 1fr;
      }

      .kpi-strip-7 {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media(max-width:700px) {
      .three-col {
        grid-template-columns: 1fr;
      }

      .kpi-strip-7 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ─── Time Period Filter Bar ─── */
    .time-filter-bar {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
      border-bottom: 1px solid #334155;
    }

    .tf-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #64748B;
      white-space: nowrap;
      padding-right: 8px;
      border-right: 1px solid #334155;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .tf-btn {
      font-size: .68rem;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 20px;
      border: 1.5px solid #334155;
      background: transparent;
      color: #94A3B8;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
      flex-shrink: 0;
    }

    .tf-btn:hover {
      border-color: #60A5FA;
      color: #BFDBFE;
    }

    .tf-btn.active {
      background: #1D4ED8;
      border-color: #3B82F6;
      color: #fff;
      box-shadow: 0 0 8px rgba(59, 130, 246, .4);
    }

    .tf-badge {
      margin-left: auto;
      font-size: .6rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(59, 130, 246, .15);
      color: #93C5FD;
      border: 1px solid rgba(59, 130, 246, .3);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ─── Archetype Cards ─── */
    .arch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .arch-card {
      border-radius: 10px;
      padding: 10px 12px;
      border: 1.5px solid;
      position: relative;
      overflow: hidden;
    }

    .arch-card::before {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      opacity: .12;
    }

    .arch-card .arch-icon {
      font-size: 1.4rem;
      margin-bottom: 6px;
      display: block;
    }

    .arch-card .arch-count {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1;
      display: block;
    }

    .arch-card .arch-pct {
      font-size: .6rem;
      font-weight: 600;
      opacity: .75;
    }

    .arch-card .arch-name {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-top: 3px;
      display: block;
    }

    .arch-card .arch-def {
      font-size: .57rem;
      color: #64748B;
      line-height: 1.4;
      margin-top: 4px;
    }

    .arch-gig {
      background: #FFF7ED;
      border-color: #FDBA74;
      color: #9A3412;
    }

    .arch-gig::before {
      background: #F97316;
    }

    .arch-boot {
      background: #EFF6FF;
      border-color: #93C5FD;
      color: #1D4ED8;
    }

    .arch-boot::before {
      background: #3B82F6;
    }

    .arch-sme {
      background: #F0FDF4;
      border-color: #86EFAC;
      color: #15803D;
    }

    .arch-sme::before {
      background: #22C55E;
    }

    .arch-inv {
      background: #F8FAFC;
      border-color: #CBD5E1;
      color: #475569;
    }

    .arch-inv::before {
      background: #94A3B8;
    }

    .arch-gaz {
      background: #FDF4FF;
      border-color: #D8B4FE;
      color: #7E22CE;
    }

    .arch-gaz::before {
      background: #A855F7;
    }

    .arch-norev {
      background: #FFF1F2;
      border-color: #FDA4AF;
      color: #BE123C;
    }

    .arch-norev::before {
      background: #F43F5E;
    }

    /* ─── Cohorts ─── */
    .cohort-timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cohort-item {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #E2E8F0;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
    }

    .cohort-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cohort-name {
      font-size: .82rem;
      font-weight: 700;
      color: #1E293B;
    }

    .cohort-meta {
      font-size: .67rem;
      color: #64748B;
      margin-top: 2px;
    }

    .cohort-badge {
      font-size: .6rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .badge-active {
      background: #D1FAE5;
      color: #065F46;
    }

    .badge-upcoming {
      background: #DBEAFE;
      color: #1E40AF;
    }

    .badge-completed {
      background: #F1F5F9;
      color: #475569;
    }

    .cohort-progress {
      height: 5px;
      background: #E2E8F0;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .cohort-progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .4s;
    }

    /* ─── Digital Credit ─── */
    .credit-card {
      background: #fff;
      border-radius: 10px;
      border: 1.5px solid #E2E8F0;
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
    }

    .credit-total {
      font-size: 2rem;
      font-weight: 800;
      color: #1D4ED8;
      line-height: 1;
    }

    .credit-row {
      display: grid;
      grid-template-columns: 130px 1fr 80px 80px;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .credit-eso {
      font-size: .75rem;
      font-weight: 600;
      color: #1E293B;
    }

    .credit-amt {
      font-size: .72rem;
      font-weight: 700;
      color: #1D4ED8;
      text-align: right;
    }

    .credit-count {
      font-size: .68rem;
      color: #64748B;
      text-align: right;
    }

    /* ─── ESO Targets ─── */
    .target-row {
      display: grid;
      grid-template-columns: 130px auto 1fr auto;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .target-label {
      font-size: .72rem;
      font-weight: 600;
      color: #1E293B;
    }

    .target-pct-badge {
      font-size: .65rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .tgt-green {
      background: #D1FAE5;
      color: #065F46;
    }

    .tgt-amber {
      background: #FEF3C7;
      color: #92400E;
    }

    .tgt-red {
      background: #FEE2E2;
      color: #991B1B;
    }

    .target-track {
      height: 10px;
      background: #E8EDF2;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .target-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .4s;
    }

    .target-marker {
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 2px;
      background: #DC2626;
      border-radius: 1px;
    }

    .target-vals {
      font-size: .62rem;
      color: #64748B;
      white-space: nowrap;
      text-align: right;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <h1>Portfolio Insights</h1>
      <div class="sub" id="last-updated">Loading…</div>
    </div>
    <div class="header-right">
      <span class="pill" id="total-pill"></span>
      <button class="btn-refresh" onclick="showRefreshHint()">↻ Refresh Data</button>
    </div>
  </div>

  <div class="type-tabs-bar" id="type-tabs-bar"></div>
  <div class="sub-tabs-bar" id="sub-tabs-bar"></div>

  <!-- Time Period Filter Bar -->
  <div class="time-filter-bar" id="time-filter-bar">
    <span class="tf-label">Period</span>
    <button class="tf-btn active" data-period="all" onclick="setTimePeriod(this,'all')">All Time</button>
    <button class="tf-btn" data-period="today" onclick="setTimePeriod(this,'today')">Today</button>
    <button class="tf-btn" data-period="yday" onclick="setTimePeriod(this,'yday')">Yesterday</button>
    <button class="tf-btn" data-period="week" onclick="setTimePeriod(this,'week')">This Week</button>
    <button class="tf-btn" data-period="lweek" onclick="setTimePeriod(this,'lweek')">Last Week</button>
    <button class="tf-btn" data-period="month" onclick="setTimePeriod(this,'month')">This Month</button>
    <button class="tf-btn" data-period="lmonth" onclick="setTimePeriod(this,'lmonth')">Last Month</button>
    <button class="tf-btn" data-period="qtr" onclick="setTimePeriod(this,'qtr')">This Quarter</button>
    <button class="tf-btn" data-period="lqtr" onclick="setTimePeriod(this,'lqtr')">Last Quarter</button>
    <span class="tf-badge" id="tf-badge">All Records</span>
  </div>

  <div class="content" id="main-content">
    <!-- panels injected by JS -->
  </div>

  <script>
    /* ─── Global Time Period Filter ─── */
    window.TIME_FILTER = 'all';
    window.recalculatePortfolio = function (p, period) {
      if (period === 'all' || !p.raw_records || p.raw_records.length === 0) return p;

      // Deep clone to avoid mutating the all-time original data
      const p_dyn = JSON.parse(JSON.stringify(p));

      const now = new Date();
      const start = new Date(now);
      start.setHours(0, 0, 0, 0);
      let end = new Date(start);
      end.setDate(end.getDate() + 1);

      if (period === 'today') { }
      else if (period === 'yday') { start.setDate(start.getDate() - 1); end.setDate(end.getDate() - 1); }
      else if (period === 'week') { const d = start.getDay() || 7; start.setDate(start.getDate() - d + 1); }
      else if (period === 'lweek') { const d = start.getDay() || 7; start.setDate(start.getDate() - d - 6); end.setDate(end.getDate() - d - 6 + 7); }
      else if (period === 'month') { start.setDate(1); }
      else if (period === 'lmonth') { start.setMonth(start.getMonth() - 1); start.setDate(1); end = new Date(now); end.setDate(1); }
      else if (period === 'qtr') { start.setMonth(Math.floor(start.getMonth() / 3) * 3); start.setDate(1); }
      else if (period === 'lqtr') { start.setMonth(Math.floor(start.getMonth() / 3) * 3 - 3); start.setDate(1); end = new Date(start); end.setMonth(end.getMonth() + 3); }

      const records = p.raw_records.filter(r => {
        if (!r.date) return false;
        const rd = new Date(r.date);
        return rd >= start && rd < end;
      });

      const agg = (key) => records.reduce((acc, r) => {
        if (r[key]) acc[r[key]] = (acc[r[key]] || 0) + 1;
        return acc;
      }, {});

      p_dyn.sectors = agg('sector');
      p_dyn.districts = agg('district');
      p_dyn.archetypes = agg('archetype');

      // Re-aggregate gender globally or within founders if necessary
      const genAgg = agg('gender');
      if (p_dyn.gender) p_dyn.gender = genAgg;
      if (p_dyn.founders) {
        if (!p_dyn.founders.gender) p_dyn.founders.gender = {};
        p_dyn.founders.gender = genAgg;
        const f = genAgg.Female || 0;
        const m = genAgg.Male || 0;
        p_dyn.founders.female_pct = (f + m) > 0 ? Number(((f / (f + m)) * 100).toFixed(1)) : 0;
      }

      p_dyn.stats.total = records.length;
      p_dyn.stats.record_count = records.length;
      p_dyn.stats.clean = records.length;

      if (p_dyn.revenue && p.revenue) {
        const revs = records.map(r => r.revenue).filter(v => v > 0).sort((a, b) => a - b);
        p_dyn.revenue.count = revs.length;
        p_dyn.revenue.mean = revs.length ? Math.floor(revs.reduce((a, b) => a + b, 0) / revs.length) : 0;
        p_dyn.revenue.median = revs.length ? revs[Math.floor(revs.length / 2)] : 0;
      }
      if (p_dyn.funding && p.funding) {
        const funds = records.map(r => r.funding).filter(v => v > 0).sort((a, b) => a - b);
        p_dyn.funding.count = funds.length;
        p_dyn.funding.mean = funds.length ? Math.floor(funds.reduce((a, b) => a + b, 0) / funds.length) : 0;
        p_dyn.funding.median = funds.length ? funds[Math.floor(funds.length / 2)] : 0;
      }
      return p_dyn;
    };

    window.setTimePeriod = function (btn, period) {
      window.TIME_FILTER = period;
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const labels = {
        all: 'All Records', today: 'Today Only', yday: 'Yesterday',
        week: 'This Week', lweek: 'Last Week', month: 'This Month',
        lmonth: 'Last Month', qtr: 'This Quarter', lqtr: 'Last Quarter'
      };
      const badge = document.getElementById('tf-badge');
      if (badge) badge.textContent = labels[period] || 'All Records';

      if (typeof window.triggerActivePanelReRender === 'function') {
        window.triggerActivePanelReRender();
      }
    };

    (function () {
      'use strict';

      /* ═══════════════════════════════════════════════════════════════
         CONSTANTS & PALETTES
      ═══════════════════════════════════════════════════════════════ */
      const PALETTE = [
        '#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6',
        '#EC4899', '#14B8A6', '#F97316', '#6366F1', '#84CC16',
        '#06B6D4', '#A78BFA', '#FB7185', '#34D399', '#FBBF24',
      ];

      const SECTOR_COLORS = {
        'Agriculture': '#10B981',
        'Trade & Services': '#3B82F6',
        'Fashion & Design': '#EC4899',
        'Light Manufacturing': '#F97316',
        'Health': '#EF4444',
        'Meetings & Events': '#8B5CF6',
        'Others': '#94A3B8',
        'Unknown': '#CBD5E1',
      };

      const GENDER_COLORS = {
        'Female': '#EC4899',
        'Male': '#3B82F6',
        'Other': '#F59E0B',
      };

      const LOCATION_COLORS = {
        'Urban': '#3B82F6',
        'Peri-Urban': '#F59E0B',
        'Rural': '#10B981',
      };

      const PORTFOLIO_COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EF4444', '#EC4899'];

      const AGE_ORDER = ['Under 18', '18–25', '26–35', '36–45', '46–55', '56+'];

      const ARCHETYPE_COLORS = {
        'Gazelles': '#10B981',
        'Bootstrappers SME': '#3B82F6',
        'Bootstrappers': '#60A5FA',
        'Gig Workers': '#F97316',
        'Invisibles': '#94A3B8',
        'No Revenue Data': '#CBD5E1',
      };

      const AGE_COLORS = {
        'Under 18': '#BFDBFE',
        '18–25': '#60A5FA',
        '26–35': '#2563EB',
        '36–45': '#1D4ED8',
        '46–55': '#1E3A8A',
        '56+': '#172554',
      };

      /* ─────────────────────────────────────────────────────────────
         ARCHETYPE CARD DEFINITIONS
      ───────────────────────────────────────────────────────────── */
      const ARCH_META = {
        'Gig Workers': { cls: 'arch-gig', icon: '⚙️', def: 'Self-employed with inconsistent revenue streams. Hustling but not yet structured.' },
        'Bootstrappers': { cls: 'arch-boot', icon: '🔧', def: 'Growing businesses with some revenue and reinvestment. Structured but pre-scale.' },
        'Bootstrappers SME': { cls: 'arch-sme', icon: '🏗️', def: 'Established SMEs generating consistent revenue. Ready for growth capital.' },
        'Invisibles': { cls: 'arch-inv', icon: '👁️', def: 'Unregistered or informal businesses with no formal identity. Hardest to reach.' },
        'Gazelles': { cls: 'arch-gaz', icon: '🦁', def: 'High-growth businesses with strong revenue trajectory. Investment-ready.' },
        'No Revenue Data': { cls: 'arch-norev', icon: '❓', def: 'Businesses with incomplete revenue information. Needs follow-up.' },
      };

      function archetypeCardsHTML(archetypes, total) {
        if (!archetypes || !Object.keys(archetypes).length)
          return '<div class="no-data-note">No archetype data available</div>';
        const order = ['Gazelles', 'Bootstrappers SME', 'Bootstrappers', 'Gig Workers', 'Invisibles', 'No Revenue Data'];
        const sorted = order.filter(k => archetypes[k]).concat(
          Object.keys(archetypes).filter(k => !order.includes(k))
        );
        return '<div class="arch-grid">' + sorted.map(k => {
          const count = archetypes[k] || 0;
          const pct = total > 0 ? (count / total * 100).toFixed(1) : '0';
          const meta = ARCH_META[k] || { cls: 'arch-inv', icon: '📊', def: '' };
          return `<div class="arch-card ${meta.cls}">
        <span class="arch-icon">${meta.icon}</span>
        <span class="arch-count">${count.toLocaleString()}</span>
        <span class="arch-pct">${pct}% of portfolio</span>
        <span class="arch-name">${k}</span>
        <div class="arch-def">${meta.def}</div>
      </div>`;
        }).join('') + '</div>';
      }

      /* ─────────────────────────────────────────────────────────────
         ESO TARGETS BUILDER
      ───────────────────────────────────────────────────────────── */
      function targetRowsHTML(targets) {
        if (!targets || !targets.length) return '<div class="no-data-note">No targets configured</div>';
        return targets.map(t => {
          const pct = t.target > 0 ? Math.min(t.actual / t.target * 100, 100) : 0;
          const pctStr = pct.toFixed(0);
          const cls = pct >= 90 ? 'tgt-green' : pct >= 70 ? 'tgt-amber' : 'tgt-red';
          const color = pct >= 90 ? '#10B981' : pct >= 70 ? '#F59E0B' : '#EF4444';
          return `<div class="target-row">
        <span class="target-label">${t.label}</span>
        <span class="target-pct-badge ${cls}">${pctStr}%</span>
        <div class="target-track">
          <div class="target-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div>
        </div>
        <span class="target-vals">${(t.actual || 0).toLocaleString()} / ${(t.target || 0).toLocaleString()}</span>
      </div>`;
        }).join('');
      }

      function buildTargetsPanel(p) {
        const targets = p.targets || [];
        if (!targets.length) return '';
        return `<div class="col-section" style="margin-top:12px">
      <div class="col-hdr" style="background:#1D4ED8">🎯 ESO TARGETS — ${(p.eso || p.name).toUpperCase()}</div>
      <div class="col-body">${targetRowsHTML(targets)}</div>
    </div>`;
      }

      /* ─────────────────────────────────────────────────────────────
         COHORT BUILDER
      ───────────────────────────────────────────────────────────── */
      function buildCohortsHTML(cohorts) {
        if (!cohorts || !cohorts.length)
          return '<div class="no-data-note" style="padding:20px">No acceleration cohorts recorded yet.</div>';

        const now = new Date();
        const statusOf = c => {
          const s = new Date(c.start_date), e = new Date(c.end_date);
          if (now < s) return { label: 'Upcoming', cls: 'badge-upcoming', color: '#3B82F6', pct: 0 };
          if (now > e) return { label: 'Completed', cls: 'badge-completed', color: '#64748B', pct: 100 };
          const pct = Math.min((now - s) / (e - s) * 100, 100);
          return { label: 'Active', cls: 'badge-active', color: '#10B981', pct };
        };

        const byEso = {};
        cohorts.forEach(c => {
          (byEso[c.eso] = byEso[c.eso] || []).push(c);
        });

        const COHORT_COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EF4444', '#EC4899', '#14B8A6', '#F97316'];
        const esoList = Object.keys(byEso);

        // KPI strip
        const active = cohorts.filter(c => statusOf(c).label === 'Active').length;
        const upcoming = cohorts.filter(c => statusOf(c).label === 'Upcoming').length;
        const completed = cohorts.filter(c => statusOf(c).label === 'Completed').length;
        const totalPart = cohorts.reduce((s, c) => s + (c.participants || 0), 0);

        const kpis = `<div class="kpi-strip-7" style="margin-bottom:16px">
      ${kpiBox(cohorts.length, 'Total Cohorts', 'ko')}
      ${kpiBox(active, 'Active Now', 'kg')}
      ${kpiBox(upcoming, 'Upcoming', 'kb')}
      ${kpiBox(completed, 'Completed', 'kp')}
      ${kpiBox(totalPart, 'Total Participants', 'kt')}
      ${kpiBox(esoList.length, 'ESOs Running', 'kr')}
      ${kpiBox(new Date().toLocaleDateString('en-UG', { day: '2-digit', month: 'short', year: 'numeric' }), 'As of Today', 'ka')}
    </div>`;

        // Timeline per cohort
        const timeline = cohorts
          .slice().sort((a, b) => new Date(a.start_date) - new Date(b.start_date))
          .map((c, i) => {
            const st = statusOf(c);
            const esoIdx = esoList.indexOf(c.eso);
            const color = COHORT_COLORS[esoIdx % COHORT_COLORS.length];
            return `<div class="cohort-item">
          <div class="cohort-dot" style="background:${color}"></div>
          <div>
            <div class="cohort-name">${c.name}</div>
            <div class="cohort-meta">
              ${c.eso} &nbsp;·&nbsp; ${c.start_date} → ${c.end_date}
              &nbsp;·&nbsp; ${(c.participants || 0).toLocaleString()} participants
              ${c.sector ? `&nbsp;·&nbsp; <em>${c.sector}</em>` : ''}
            </div>
            <div class="cohort-progress">
              <div class="cohort-progress-fill" style="width:${st.pct.toFixed(0)}%;background:${st.color}"></div>
            </div>
          </div>
          <span class="cohort-badge ${st.cls}">${st.label}</span>
        </div>`;
          }).join('');

        // By ESO breakdown
        const byEsoRows = esoList.map((eso, i) => {
          const cs = byEso[eso];
          const act = cs.filter(c => statusOf(c).label === 'Active').length;
          const parts = cs.reduce((s, c) => s + (c.participants || 0), 0);
          const color = COHORT_COLORS[i % COHORT_COLORS.length];
          return `<div class="bar-row">
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(parts / Math.max(totalPart, 1) * 100, 100).toFixed(1)}%;background:${color}"></div></div>
        <span class="bar-name">${eso}</span>
        <span class="bar-stat">${parts} pax &ensp; ${act} active</span>
      </div>`;
        }).join('');

        return `
      <div class="port-header">
        <div class="port-bar-strip"><div class="port-bar-orange"></div><div class="port-bar-blue"></div></div>
        <div class="port-title-area">
          <div class="port-title">Acceleration Cohorts — Programme Overview</div>
          <div class="port-filename">10X Digital Economy · All ESOs · ${new Date().toLocaleDateString('en-UG', { month: 'long', year: 'numeric' })}</div>
        </div>
      </div>
      ${kpis}
      <div class="three-col">
        <div class="col-section" style="grid-column:span 2">
          <div class="col-hdr" style="background:#0F766E">COHORT TIMELINE</div>
          <div class="col-body"><div class="cohort-timeline">${timeline}</div></div>
        </div>
        <div class="col-section">
          <div class="col-hdr" style="background:#7C3AED">PARTICIPANTS BY ESO</div>
          <div class="col-body">${byEsoRows || '<div class="no-data-note">No ESO data</div>'}</div>
        </div>
      </div>`;
      }

      /* ─────────────────────────────────────────────────────────────
         DIGITAL CREDIT BUILDER
      ───────────────────────────────────────────────────────────── */
      function buildDigitalCreditHTML(creditData) {
        if (!creditData || !creditData.eso_credit) {
          return `<div class="no-data" style="padding:60px 24px;text-align:center">
        <div style="font-size:3rem;margin-bottom:16px">💳</div>
        <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:12px">Digital Credit Data</h2>
        <p style="color:#64748B;font-size:.9rem">Add <code>digital_credit</code> entries to data.js to populate this view.</p>
      </div>`;
        }

        const esoCredit = creditData.eso_credit || [];
        const total = esoCredit.reduce((s, e) => s + (e.businesses || 0), 0);
        const totalAmt = esoCredit.reduce((s, e) => s + (e.amount_ugx || 0), 0);
        const totalAmtStr = totalAmt >= 1e9 ? (totalAmt / 1e9).toFixed(2) + 'B' : totalAmt >= 1e6 ? (totalAmt / 1e6).toFixed(1) + 'M' : totalAmt.toLocaleString();
        const avgAmt = total > 0 ? (totalAmt / total) : 0;
        const avgAmtStr = avgAmt >= 1e6 ? (avgAmt / 1e6).toFixed(1) + 'M' : avgAmt >= 1e3 ? Math.round(avgAmt / 1e3) + 'K' : avgAmt.toFixed(0);
        const nEsos = esoCredit.length;
        const maxAmt = Math.max(...esoCredit.map(e => e.amount_ugx || 0), 1);

        return `

      <div class="kpi-strip-7" style="margin-bottom:16px">
        ${kpiBox(total.toLocaleString(), 'Businesses w/ Credit', 'kb')}
        ${kpiBox('UGX ' + totalAmtStr, 'Total Credit Disbursed', 'ko')}
        ${kpiBox('UGX ' + avgAmtStr, 'Avg Credit / Business', 'kg')}
        ${kpiBox(nEsos, 'ESO Partners', 'kp')}
        ${kpiBox(creditData.period || '2025–26', 'Programme Period', 'kt')}
        ${kpiBox(creditData.credit_types || (Object.keys(byType).length) || '—', 'Credit Types', 'kr')}
        ${kpiBox(creditData.repayment_rate ? creditData.repayment_rate + '%' : '—', 'Avg Repayment', 'ka')}
      </div>

      <div class="three-col">
        <div class="col-section" style="grid-column:span 2">
          <div class="col-hdr" style="background:#1D4ED8">CREDIT BY ESO PARTNER</div>
          <div class="col-body">
            <div class="credit-row" style="margin-bottom:8px">
              <span style="font-size:.6rem;color:#94A3B8;font-weight:700">ESO</span>
              <span></span>
              <span style="font-size:.6rem;color:#94A3B8;text-align:right">Amount</span>
              <span style="font-size:.6rem;color:#94A3B8;text-align:right">Businesses</span>
            </div>
            ${esoRows || '<div class="no-data-note">No credit data</div>'}
          </div>
        </div>
        <div class="col-section">
          <div class="col-hdr" style="background:#065F46">CREDIT TYPE BREAKDOWN</div>
          <div class="col-body">
            ${Object.keys(byType).length
            ? barRowsHTML(byType, { 'Loan': '#3B82F6', 'Grant': '#10B981', 'SACCO': '#F59E0B', 'MFI': '#8B5CF6' }, typeTotal, 10)
            : '<div class="no-data-note">No type breakdown available</div>'}
          </div>
        </div>
      </div>` + buildParticipantListHTML(creditData);
      }

      /* ═══════════════════════════════════════════════════════════════
         CHART REGISTRY
      ═══════════════════════════════════════════════════════════════ */

      const _charts = {};

      function destroyPanel(prefix) {
        Object.keys(_charts).forEach(k => {
          if (k.startsWith(prefix)) { _charts[k].destroy(); delete _charts[k]; }
        });
      }

      function makeChart(id, type, labels, datasets, opts) {
        const canvas = document.getElementById(id);
        if (!canvas) return;
        if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; }
        const ctx = canvas.getContext('2d');
        _charts[id] = new Chart(ctx, {
          type,
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            animation: { duration: 400 },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: ctx => ` ${ctx.dataset.label || ctx.label}: ${Number(ctx.raw).toLocaleString()}`
                }
              }
            },
            ...opts
          }
        });
      }

      /* ═══════════════════════════════════════════════════════════════
         CHART HELPERS
      ═══════════════════════════════════════════════════════════════ */
      function sorted(obj, n) {
        let e = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
        return n ? e.slice(0, n) : e;
      }

      function colorsFor(labels, map) {
        return labels.map((l, i) => (map && map[l]) ? map[l] : PALETTE[i % PALETTE.length]);
      }

      /* Horizontal bar */
      function hBar(id, obj, colorMap, n) {
        const e = sorted(obj, n);
        if (!e.length) return;
        const labels = e.map(x => x[0]);
        const values = e.map(x => x[1]);
        makeChart(id, 'bar', labels, [{
          data: values,
          backgroundColor: colorsFor(labels, colorMap),
          borderRadius: 4,
        }], {
          indexAxis: 'y',
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: c => ` ${Number(c.raw).toLocaleString()}` } }
          },
          scales: {
            x: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 11 } } },
            y: { grid: { display: false }, ticks: { font: { size: 11 }, crossAlign: 'far' } }
          }
        });
      }

      /* Vertical bar */
      function vBar(id, obj, colorMap, order) {
        let e = order
          ? order.map(k => [k, (obj || {})[k] || 0]).filter(x => x[1] > 0)
          : sorted(obj);
        if (!e.length) return;
        const labels = e.map(x => x[0]);
        const values = e.map(x => x[1]);
        makeChart(id, 'bar', labels, [{
          data: values,
          backgroundColor: colorsFor(labels, colorMap),
          borderRadius: 4,
        }], {
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: c => ` ${Number(c.raw).toLocaleString()}` } }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 11 } } },
            y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 11 } } }
          }
        });
      }

      /* Donut */
      function donut(id, obj, colorMap) {
        const e = sorted(obj);
        if (!e.length) return;
        const labels = e.map(x => x[0]);
        const values = e.map(x => x[1]);
        const total = values.reduce((a, b) => a + b, 0);
        makeChart(id, 'doughnut', labels, [{
          data: values,
          backgroundColor: colorsFor(labels, colorMap),
          borderWidth: 2,
          borderColor: '#fff',
          hoverOffset: 6,
        }], {
          cutout: '62%',
          plugins: {
            legend: { display: true, position: 'bottom', labels: { font: { size: 11 }, padding: 10, usePointStyle: true, boxWidth: 8 } },
            tooltip: {
              callbacks: {
                label: c => ` ${c.label}: ${Number(c.raw).toLocaleString()} (${(c.raw / total * 100).toFixed(1)}%)`
              }
            }
          }
        });
      }

      /* ═══════════════════════════════════════════════════════════════
         UTILITIES
      ═══════════════════════════════════════════════════════════════ */
      function fmt(n) {
        n = Number(n) || 0;
        if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
        if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
        return n.toLocaleString();
      }

      function pct(a, b) {
        if (!b) return '0%';
        return (a / b * 100).toFixed(1) + '%';
      }

      function kpi(label, value, hint, color) {
        return `<div class="kpi ${color || 'blue'}">
      <div class="lbl">${label}</div>
      <div class="val">${value}</div>
      ${hint ? `<div class="hint">${hint}</div>` : ''}
    </div>`;
      }

      /* ═══════════════════════════════════════════════════════════════
         CSS-BAR HELPERS  (for per-portfolio pages)
      ═══════════════════════════════════════════════════════════════ */
      function kpiBox(val, label, cls) {
        return `<div class="kpi-box ${cls}"><span class="kv">${val}</span><span class="kl">${label}</span></div>`;
      }

      /** Render sorted CSS bar rows normalised to `total`. */
      function barRowsHTML(obj, colorMap, total, topN) {
        const entries = sorted(obj, topN);
        if (!entries.length) return '<div style="font-size:.7rem;color:#94A3B8;padding:4px 0">No data</div>';
        return entries.map(([label, count], i) => {
          const w = total > 0 ? Math.min(count / total * 100, 100).toFixed(1) : 0;
          const pctStr = total > 0 ? (count / total * 100).toFixed(1) : '0';
          const color = (colorMap && colorMap[label]) ? colorMap[label] : PALETTE[i % PALETTE.length];
          return `<div class="bar-row">
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
        <span class="bar-name" title="${label}">${label}</span>
        <span class="bar-stat">${count.toLocaleString()}&ensp;${pctStr}%</span>
      </div>`;
        }).join('');
      }

      /** Age band CSS bars using fixed AGE_COLORS. */
      function ageBandRowsHTML(obj, total) {
        const entries = AGE_ORDER.map(k => [k, (obj || {})[k] || 0]).filter(e => e[1] > 0);
        if (!entries.length) return '<div style="font-size:.7rem;color:#94A3B8;padding:4px 0">No data</div>';
        return entries.map(([label, count]) => {
          const w = total > 0 ? Math.min(count / total * 100, 100).toFixed(1) : 0;
          const pctStr = total > 0 ? (count / total * 100).toFixed(1) : '0';
          const color = AGE_COLORS[label] || '#3B82F6';
          return `<div class="bar-row">
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
        <span class="bar-name">${label}</span>
        <span class="bar-stat">${count.toLocaleString()}&ensp;${pctStr}%</span>
      </div>`;
        }).join('');
      }

      /** District bars normalised to the top district (max = 100%). */
      function districtBarRowsHTML(obj, topN) {
        const entries = sorted(obj, topN);
        if (!entries.length) return '<div style="font-size:.7rem;color:#94A3B8;padding:4px 0">No data</div>';
        const maxV = entries[0][1] || 1;
        return entries.map(([label, count]) => {
          const w = (count / maxV * 100).toFixed(1);
          return `<div class="bar-row">
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:#F97316"></div></div>
        <span class="bar-name" title="${label}">${label}</span>
        <span class="bar-stat">${count.toLocaleString()}</span>
      </div>`;
        }).join('');
      }

      /* ── Record Explorer Utility — used by all builders ── */
      function buildParticipantListHTML(p, limit = 50) {
        if (!p.raw_records || p.raw_records.length === 0) return '';
        const records = p.raw_records.slice(0, limit);
        return `
          <div class="card" style="margin-top:20px">

            <div style="overflow-x:auto">
              <table class="eso-summary-table" style="width:100%">
                <thead><tr><th>Name / Business</th><th>ESO/Partner</th><th>Action</th></tr></thead>
                <tbody>
                  ${records.map(r => `
                    <tr>
                      <td style="font-weight:600">${r.n || r.b || 'N/A'}</td>
                      <td>${r.eso || p.eso || 'N/A'}</td>
                      <td><button class="eso-report-btn" data-name="${r.n || r.b}" data-eso="${r.eso || p.eso}" style="padding:4px 12px; font-size:.78rem; background:#3B82F6; color:#fff; border:none; border-radius:5px; cursor:pointer">View 360° Trace</button></td>
                    </tr>`).join('')}
                </tbody>
              </table>
              ${p.raw_records.length > limit ? `<div style="padding:10px; text-align:center; font-size:.7rem; color:#64748B">Displaying top ${limit} records. Use the "Report" tab search for more.</div>` : ''}
            </div>
          </div>`;
      }

      /* ═══════════════════════════════════════════════════════════════
         HTML BUILDERS
      ═══════════════════════════════════════════════════════════════ */

      /* ── Foundation Course ─────────────────────────────────────────────────── */
      function buildFoundationHTML(p) {
        const total = p.stats.total;
        const compPct = (p.completed_pct || 0).toFixed(1);
        const avgComp = (p.avg_completion || 0).toFixed(1);
        const byEso = p.by_eso || {};
        const modules = p.modules || {};
        const progBands = p.progress_bands || {};

        // ── Activity strip values ──────────────────────────────────────────
        const enrWeek = wa.enrolled_this_week || 0;
        const enrLWeek = wa.enrolled_last_week || 0;
        const enrMonth = wa.enrolled_this_month || 0;
        const cmpWeek = wa.completed_this_week || 0;
        const cmpLWeek = wa.completed_last_week || 0;
        const cmpMonth = wa.completed_this_month || 0;

        // ── Progress band colours ──────────────────────────────────────────
        const BAND_COLORS = {

          'Under 25%': '#EF4444',

        const bandTotal = Object.values(progBands).reduce((a, b) => a + b, 0) || 1;
        const progBandRows = Object.entries(progBands).map(([lbl, n]) => {
          const w = Math.min(n / bandTotal * 100, 100).toFixed(1);

        <span class="pb-stat">${n.toLocaleString()}&ensp;${pct}%</span>
      </div>`;
        }).join('');

        // ── ESO performance rows — sorted by completion rate desc ──────────
        const esoSorted = Object.entries(byEso)
          .filter(([k]) => !['Test', 'Tests', 'Lofty', 'Curad', 'Leu', 'Uncdf'].includes(k))
          .sort((a, b) => b[1].completion_rate - a[1].completion_rate);

        const esoRows = esoSorted.map(([eso, d], i) => {

          return `<div class="eso-perf-row">

        <div class="eso-bar-wrap">
          <div class="eso-bar-fill" style="width:${cr}%;background:${color}"></div>
          <span class="eso-bar-label">${cr}%</span>
        </div>
        <span class="eso-stat">${d.completed.toLocaleString()}/${d.total.toLocaleString()}</span>
        <span class="eso-stat">avg&nbsp;${ap}%</span>
        <span class="eso-week">&#8593;${(d.comp_this_week || 0)}&nbsp;wk</span>
      </div>`;
        }).join('') || '<div class="no-data-note">No ESO data</div>';

        // ── Module bars ────────────────────────────────────────────────────
        const modBars = Object.entries(modules).map(([label, m], i) => {
          return `<div class="bar-row">
        <div class="bar-track"><div class="bar-fill" style="width:${m.pct}%;background:${PALETTE[i % PALETTE.length]}"></div></div>
        <span class="bar-name" title="${label}">${label}</span>
        <span class="bar-stat">${m.completed.toLocaleString()}&ensp;${m.pct}%</span>
      </div>`;
        }).join('') || '<div class="no-data-note">No module data</div>';

        // ── Top ESO this week (top 3 by comp_this_week) ────────────────────
        const topWeek = Object.entries(byEso)
          .filter(([k, d]) => (d.comp_this_week || 0) > 0 && !['Test', 'Tests', 'Lofty'].includes(k))
          .sort((a, b) => (b[1].comp_this_week || 0) - (a[1].comp_this_week || 0))
          .slice(0, 5);
        const topWeekRows = topWeek.map(([eso, d], i) => {
          const medal = ['🥇', '🥈', '🥉', '4.', '5.'][i];
          return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
        <span style="font-size:.72rem;width:18px">${medal}</span>
        <span style="font-size:.72rem;font-weight:600;flex:1;color:#1E293B">${eso}</span>
        <span style="font-size:.68rem;color:#059669;font-weight:700">${d.comp_this_week} this wk</span>
      </div>`;
        }).join('') || '<div class="no-data-note">No activity this week</div>';

        const topMonthRows = Object.entries(byEso)
          .filter(([k, d]) => (d.comp_this_month || 0) > 0 && !['Test', 'Tests', 'Lofty'].includes(k))
          .sort((a, b) => (b[1].comp_this_month || 0) - (a[1].comp_this_month || 0))
          .slice(0, 5)
          .map(([eso, d], i) => {
            const medal = ['🥇', '🥈', '🥉', '4.', '5.'][i];
            return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <span style="font-size:.72rem;width:18px">${medal}</span>
          <span style="font-size:.72rem;font-weight:600;flex:1;color:#1E293B">${eso}</span>
          <span style="font-size:.68rem;color:#2563EB;font-weight:700">${d.comp_this_month} this mo</span>

        return `

        </div>
      </div>

      <div class="kpi-strip-7">
        ${kpiBox(fmt(total), 'Total Learners', 'ko')}
        ${kpiBox(fmt(p.stats.completed || 0), 'Completed Course', 'kg')}
        ${kpiBox(compPct + '%', 'Completion Rate', 'kb')}
        ${kpiBox(avgComp + '%', 'Avg Progress', 'kp')}
        ${kpiBox(fmt(cmpWeek), 'Completed This Wk', 'kt')}
        ${kpiBox(fmt(enrWeek), 'Enrolled This Wk', 'kr')}

        </div>

          <div class="act-val green">${fmt(cmpMonth)}</div>

        </div>
        <div class="act-card act-blue">
          <div class="act-val blue">${fmt(enrWeek)}</div>
          <div class="act-lbl">New Enrollments<br>This Week</div>
        </div>
        <div class="act-card act-blue">
          <div class="act-val blue">${fmt(enrLWeek)}</div>

          <div class="col-hdr green-hdr">ESO PERFORMANCE — COMPLETION RATE RANKING</div>
          <div class="col-body">${esoRows}</div>
        </div>
        <div class="col-section">
          <div class="col-hdr orange-hdr">PROGRESS BANDS</div>

          <div class="col-body">${modBars}</div>

      <!-- ROW 2: Top performers this week | last week | this month -->
      <div class="three-col" style="margin-top:12px">

        </div>
      </div>` + buildParticipantListHTML(p);
      }

      /* ── EOI Programme Overview (all ESOs combined) ───────────────────────── */
      function buildEoiOverviewHTML(portfolios) {
        const total = portfolios.reduce((s, p) => s + p.stats.total, 0);
        const totalUrsb = portfolios.reduce((s, p) => s + (p.stats.ursb || 0), 0);
        const totalPwd = portfolios.reduce((s, p) => s + (p.stats.pwd || 0), 0);
        const totalRef = portfolios.reduce((s, p) => s + (p.stats.refugees || 0), 0);
        const totalFound = portfolios.reduce((s, p) => s + (p.total_founders || 0), 0);
        const ursbPct = total > 0 ? (totalUrsb / total * 100).toFixed(1) : '0';

        // Weighted female-founder percentage across all ESOs
        const femFoundSum = portfolios.reduce((s, p) => {
          const fp = (p.founders && p.founders.female_pct) ? p.founders.female_pct : 0;

        const chapObj = { 'PEDN': chapchap.pedn || 0, 'Stanbic': chapchap.stanbic || 0 };

        // ── Engagement data ────────────────────────────────────────────────────────

        const ezyCost = ezyagric.total_cost_ugx || 0;
        const ezyAvgItems = (ezyagric.avg_items || 0).toFixed(2);

        const ezyAvgCostFmt = ezyAvgCost >= 1e3 ? Math.round(ezyAvgCost / 1e3) + 'K' : fmt(Math.round(ezyAvgCost));

        const stbMonthly = xenteStb.monthly || {};

      /* ── Device Financing ──────────────────────────────────────────────────── */
      function buildDevicesHTML(p) {
        const total = p.stats.total;
        const disPct = (p.disability_pct || 0).toFixed(1);
        const regPct = (p.business_reg_pct || 0).toFixed(1);
        const withDis = p.stats.with_disability || 0;
        const bizReg = p.stats.business_reg || 0;

        const deviceTypes = p.device_types || {};
        const priceBands = p.price_bands || {};
        const paymentDuration = p.payment_duration || {};
        const esoHubs = p.eso_hubs || {};
        const idTypes = p.id_types || {};
        const regBody = p.reg_body || {};
        const disTypes = p.disability_types || {};
        const deviceByEso = p.device_by_eso || {};
        const simReg = p.sim_registered || {};
        const weeklyAct = p.weekly_activity || {};
        const esoWeekly = p.eso_weekly || {};
        const devWeekly = p.device_weekly || {};
        const priceStats = p.price_stats || {};

        const deviceTotal = Object.values(deviceTypes).reduce((a, b) => a + b, 0) || 1;
        const priceTotal = Object.values(priceBands).reduce((a, b) => a + b, 0) || 1;
        const payTotal = Object.values(paymentDuration).reduce((a, b) => a + b, 0) || 1;
        const esoTotal = Object.values(esoHubs).reduce((a, b) => a + b, 0) || 1;
        const idTotal = Object.values(idTypes).reduce((a, b) => a + b, 0) || 1;
        const regBodyTotal = Object.values(regBody).reduce((a, b) => a + b, 0) || 1;
        const simRegTotal = Object.values(simReg).reduce((a, b) => a + b, 0) || 1;

        const appsWk = weeklyAct.apps_this_week || 0;
        const appsLwk = weeklyAct.apps_last_week || 0;
        const appsMo = weeklyAct.apps_this_month || 0;
        const avgPrice = priceStats.avg ? 'UGX ' + fmt(priceStats.avg) : '—';
        const medPrice = priceStats.median ? 'UGX ' + fmt(priceStats.median) : '—';

        const DEVICE_COLORS = {
          'Smartphone': '#3B82F6', 'Tablet': '#8B5CF6', 'Laptop': '#10B981',
          'POS': '#F59E0B', 'Software': '#EF4444'
        };
        const PRICE_COLORS = {
          'Under 200K': '#6EE7B7', '200K–500K': '#34D399',
          '500K–1M': '#10B981', '1M–2M': '#059669', '2M+': '#047857'
        };
        const PAY_COLORS = {
          'Weekly': '#60A5FA', 'Bi-Weekly': '#3B82F6', 'Monthly': '#2563EB',
          'Quarterly': '#1D4ED8', 'Semi-Annual': '#1E40AF', 'Yearly': '#1E3A8A'
        };

        // ── ESO performance rows (sorted by total, filtered) ───────────────
        const ESO_FILTER = ['Other', 'FindingXY', 'Test', 'Tests'];
        const esoRanked = Object.entries(esoWeekly)
          .filter(([k]) => !ESO_FILTER.includes(k))
          .sort((a, b) => b[1].total - a[1].total);

        const esoRankRows = esoRanked.map(([eso, d], i) => {
          const barW = Math.min(d.total / (esoRanked[0][1].total || 1) * 100, 100).toFixed(1);
          const color = i === 0 ? '#3B82F6' : i === 1 ? '#8B5CF6' : i === 2 ? '#10B981' : '#64748B';
          const rank = i < 3
            ? `<span class="rank-badge rank-${i + 1}">${i + 1}</span>`
            : `<span style="font-size:.62rem;color:#CBD5E1;padding-right:2px">${i + 1}</span>`;
          return `<div class="eso-perf-row">
        <div class="eso-name">${rank} ${eso}</div>
        <div class="eso-bar-wrap"><div class="eso-bar-fill" style="width:${barW}%;background:${color}"></div></div>
        <div class="eso-stat">${d.total.toLocaleString()}</div>
        <div class="eso-stat" style="color:#10B981">↑${d.this_week} wk</div>
        <div class="eso-stat" style="color:#6366F1">↑${d.this_month} mo</div>
      </div>`;
        }).join('');

        // ── Top ESOs this week ──────────────────────────────────────────────
        const topWk = Object.entries(esoWeekly)
          .filter(([k]) => !ESO_FILTER.includes(k) && k !== 'MUBS_EIIC')
          .sort((a, b) => b[1].this_week - a[1].this_week)
          .slice(0, 5);
        const topWkRows = topWk.map(([eso, d], i) => {
          const medals = ['🥇', '🥈', '🥉'];
          const medal = medals[i] || `${i + 1}.`;
          return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
        <span style="font-size:.85rem;min-width:22px">${medal}</span>
        <span style="font-size:.72rem;font-weight:700;color:#1E293B;flex:1">${eso}</span>
        <span style="font-size:.72rem;font-weight:800;color:#3B82F6">${d.this_week}</span>
      </div>`;
        }).join('') || '<div class="no-data-note">No data for this week</div>';

        // ── Top ESOs last week ──────────────────────────────────────────────
        const topLwk = Object.entries(esoWeekly)
          .filter(([k]) => !ESO_FILTER.includes(k))
          .sort((a, b) => b[1].last_week - a[1].last_week)
          .slice(0, 5);
        const topLwkRows = topLwk.map(([eso, d], i) => {
          const medals = ['🥇', '🥈', '🥉'];
          const medal = medals[i] || `${i + 1}.`;
          return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
        <span style="font-size:.85rem;min-width:22px">${medal}</span>
        <span style="font-size:.72rem;font-weight:700;color:#1E293B;flex:1">${eso}</span>
        <span style="font-size:.72rem;font-weight:800;color:#6366F1">${d.last_week}</span>
      </div>`;
        }).join('') || '<div class="no-data-note">No data last week</div>';

        // ── Device type weekly rows ─────────────────────────────────────────
        const devWeeklyRows = Object.entries(devWeekly).sort((a, b) => b[1].total - a[1].total).map(([dev, d]) => {
          const barW = Math.min(d.total / (deviceTotal || 1) * 100, 100).toFixed(1);
          const color = DEVICE_COLORS[dev] || '#64748B';
          return `<div class="dev-weekly-row">
        <div class="dw-name">${dev}</div>
        <div style="position:relative;height:10px;background:#E8EDF2;border-radius:2px;overflow:hidden">
          <div style="position:absolute;left:0;top:0;height:100%;background:${color};border-radius:2px;width:${barW}%"></div>
        </div>
        <div class="dw-stat">${d.total.toLocaleString()}</div>
        <div class="dw-stat" style="color:#10B981">${d.this_week}</div>
        <div class="dw-stat" style="color:#6366F1">${d.this_month}</div>
      </div>`;
        }).join('') || '<div class="no-data-note">No device weekly data</div>';

        // All Applicants Card (with export)
        let allApplicants = [];
        if (p.raw_records && Array.isArray(p.raw_records)) {
          allApplicants = p.raw_records;
        }
        let ninCard = `
          <div class="card" style="margin-bottom:18px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
              <h3 style="margin-bottom:10px; font-size:.95rem; color:#1E293B">All Applicants (${allApplicants.length})</h3>
              <button id="export-nin-btn" style="padding:6px 16px;font-size:.85em;background:#3B82F6;color:#fff;border:none;border-radius:5px;cursor:pointer">Export CSV</button>
            </div>
            <div style="overflow-x:auto">
              <table style="width:100%; font-size:.92em">
                <thead><tr><th>Name</th><th>ESO</th><th>NIN</th><th>Phone</th><th>Price Range</th></tr></thead>
                <tbody>
                  ${allApplicants.length > 0 ? allApplicants.slice(0, 20).map(r => `<tr><td>${r.n || r.b || 'N/A'}</td><td>${r.eso || p.eso || ''}</td><td>${r.nin || ''}</td><td>${r.phone || ''}</td><td>${r.price_range || ''}</td></tr>`).join('') : '<tr><td colspan="5" style="color:#64748B;text-align:center">No applicants found</td></tr>'}
                </tbody>
              </table>
              ${allApplicants.length > 20 ? `<div style='font-size:.8em;color:#64748B;padding:6px 0'>Showing first 20 applicants</div>` : ''}
            </div>
          </div>
        `;

        // Attach export handler after rendering
        setTimeout(() => {
          const btn = document.getElementById('export-nin-btn');
          if (btn) {
            btn.onclick = function() {
              const rows = allApplicants.map(r => [
                (r.n || r.b || ''),
                (r.eso || p.eso || ''),
                (r.nin || ''),
                (r.phone || ''),
                (r.price_range || '')
              ]);
              let csv = 'Name,ESO,NIN,Phone,Price Range\n';
              csv += rows.map(row => row.map(x => '"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
              const blob = new Blob([csv], {type: 'text/csv'});

          borderRadius: 6,

          plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${Number(c.raw).toLocaleString()} records` } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 11 } } },
            y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 11 } } }

        /* Combined sectors donut */
        const allSectors = {};
        portfolios.forEach(p => {
          Object.entries(p.sectors || {}).forEach(([k, v]) => { allSectors[k] = (allSectors[k] || 0) + v; });

        donut('_ov-sectors-donut', allSectors, SECTOR_COLORS);

        /* Combined gender */

        portfolios.forEach(p => {
          Object.entries(p.gender || {}).forEach(([k, v]) => { allGender[k] = (allGender[k] || 0) + v; });
        });
        donut('_ov-gender', allGender, GENDER_COLORS);

        /* Combined location */

        });
        donut('_ov-location', allLocation, LOCATION_COLORS);

      /* ── Participant Report Builder ── */
      function buildReportHTML(portfolios) {
        const participantMap = new Map();
        portfolios.forEach(p => {
          if (p.raw_records) {
            p.raw_records.forEach(r => {
              const name = (r.n || r.b || "").trim();
              if (!name || name.toLowerCase() === 'nan' || name.length < 3) return;
              const key = name.toLowerCase();
              if (!participantMap.has(key)) {
                participantMap.set(key, { 
                  name, matches: new Set(), eso: r.eso || p.eso || p.name.split(' ')[0],
                  segment: r.archetype || 'Unknown', found: false, device: false, sim: false
                });
              }
              const entry = participantMap.get(key);
              entry.matches.add(p.name);
              if (p.type === 'foundation') entry.found = true;
              if (p.type === 'devices') entry.device = true;
              if (r.sim_registered || r.sim) entry.sim = true;
            });
          }
        });
        const sortedParticipants = Array.from(participantMap.values())
          .map(p => ({ ...p, traceScore: p.matches.size }))
          .sort((a, b) => b.traceScore - a.traceScore);
        
        if (sortedParticipants.length === 0) return '<div class="no-data-note">No participant records found.</div>';
        
        const displayRows = sortedParticipants.slice(0, 300);

        return `
          <div class="section-hdr">
            <h2>Participant 360° Trace Report</h2>
            <div style="display:flex; gap:10px; align-items:center">
               <input type="text" id="report-search" placeholder="Search name or business..." 
                      style="padding:8px 15px; border-radius:6px; border:1px solid #CBD5E1; font-size:.85rem; width:250px"
                      onkeyup="window.filterReport(this.value)">
               <span class="type-badge badge-all">${participantMap.size.toLocaleString()} Identities</span>
            </div>
          </div>
          <div class="card" id="report-table-container">
            <table class="eso-summary-table" style="width:100%" id="report-main-table">
              <thead><tr><th>Name</th><th>ESO</th><th>Score</th><th>Found.</th><th>Dev.</th><th>SIM.</th><th>Action</th></tr></thead>
              <tbody>
                ${displayRows.map(r => `
                  <tr>
                    <td>${r.name}</td><td>${r.eso}</td>
                    <td><span class="type-badge" style="background:${r.traceScore>=3?'#10B981':'#64748B'}20; color:${r.traceScore>=3?'#10B981':'#64748B'}">${r.traceScore} Matches</span></td>
                    <td>${r.found?'✅':''}</td><td>${r.device?'📱':''}</td><td>${r.sim?'📶':''}</td>
                    <td><button class="eso-report-btn" data-name="${r.name}" data-eso="${r.eso}" style="padding:4px 10px; font-size:.8em">View Trace</button></td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`;
      }

      window.filterReport = function(val) {
          const q = val.toLowerCase();
          const rows = document.querySelectorAll('#report-main-table tbody tr');
          rows.forEach(row => {
              const text = row.innerText.toLowerCase();
              row.style.display = text.includes(q) ? '' : 'none';
          });
      };

      /* ── Strategic Metrics & Report Builders ── */
      function computeSoWhatMetrics(portfolios) {
        const total = portfolios.reduce((s, p) => s + (p.stats?.total || 0), 0);
        const fCount = portfolios.reduce((s, p) => s + (p.female_pct ? Math.round(p.female_pct/100 * p.stats.total) : 0), 0);
        const pwd = portfolios.reduce((s, p) => s + (p.pwd || 0), 0);
        const jobs = portfolios.reduce((s, p) => s + (p.fte || 0) + (p.pte || 0), 0);
        const foundAll = portfolios.filter(p => p.type === 'foundation').reduce((s,p)=>s+p.stats.total, 0);
        const devAll = portfolios.filter(p => p.type === 'devices').reduce((s,p)=>s+p.stats.total, 0);
        const platAll = portfolios.filter(p => p.type === 'platforms').reduce((s,p)=>s+p.stats.total, 0);
        const creditApp = portfolios.filter(p => p.type === 'digital_credit').reduce((s,p)=>s+(p.credit_approved || 0), 0);

        const pct = (n, d) => d ? ((n/d)*100).toFixed(1)+'%' : '0%';
        
        const esoPerf = portfolios.reduce((acc, p) => {
          if (!p.eso) return acc;
          const e = p.eso;
          if (!acc[e]) acc[e] = { total:0, foundation:0, platform:0, credit:0 };
          acc[e].total += p.stats.total;
          if (p.type === 'foundation') acc[e].foundation += p.stats.total;
          if (p.type === 'platforms')  acc[e].platform += p.stats.total;
          if (p.type === 'digital_credit') acc[e].credit += p.stats.total;
          return acc;
        }, {});

        return {
          total, femalePct: pct(fCount, total), pwdPct: pct(pwd, total), totalJobs: jobs,
          foundRate: pct(foundAll, total), platformRate: pct(platAll, total),
          dropOffs: [
            { label: 'EOI → Foundation', val: pct(total - foundAll, total) },
            { label: 'Foundation → Devices', val: pct(foundAll - devAll, foundAll || 1) },
            { label: 'Devices → Platforms', val: pct(devAll - platAll, devAll || 1) },
            { label: 'Platforms → Credit', val: pct(platAll - creditApp, platAll || 1) }
          ],
          esoPerf
        };
      }

            ${kpi('Total Reach', m.total.toLocaleString(), '#3B82F6', '#EFF6FF', '#BFDBFE', 'Total participants engaged')}
