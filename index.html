  function initOverviewCharts(portfolios) {
    const monthKey = value => {
      if (!value) return null;
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return null;
      return d.toISOString().slice(0, 7);
    };
    const monthCounts = records => records.reduce((acc, r) => {
      const k = monthKey(r.date || r.d || r._submission_time || r.submission_time);
      if (k) acc[k] = (acc[k] || 0) + 1;
      return acc;
    }, {});
    const weeklyFallback = p => ({
      'Last week': p.weekly_activity?.apps_last_week || 0,
      'This week': p.weekly_activity?.apps_this_week || 0,
      'This month': p.weekly_activity?.apps_this_month || 0,
    });
    const line = (id, obj, color) => {
      const entries = Object.entries(obj || {}).filter(([, v]) => Number(v) > 0).sort((a, b) => a[0].localeCompare(b[0]));
      if (!entries.length) return;
      makeChart(id, 'line', entries.map(e => e[0]), [{
        data: entries.map(e => e[1]),
        borderColor: color,
        backgroundColor: color + '22',
        fill: true,
        tension: .35,
        pointRadius: 2,
      }], {
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 0 } },
          y: { grid: { color: '#EEF2F7' }, ticks: { font: { size: 10 } } }
        }
      });
    };
    const deviceRecords = portfolios.filter(p => p.type === 'devices').flatMap(p => p.raw_records || []);
    const deviceTrend = monthCounts(deviceRecords);
    const platformTrend = {};
    portfolios.filter(p => p.type === 'platforms').forEach(p => {
      Object.values(p.by_platform || {}).forEach(platform => {
        Object.entries(platform.monthly || {}).forEach(([month, count]) => {
          platformTrend[month] = (platformTrend[month] || 0) + count;
        });
      });
    });
    line('_ov-platform-trend', platformTrend, '#7C3AED');
    line('_ov-device-trend', Object.keys(deviceTrend).length ? deviceTrend : weeklyFallback({ weekly_activity: {} }), '#EA580C');
    return;

    /* Portfolio sizes bar */
    const names  = portfolios.map(p => p.name);
    const sizes  = portfolios.map(p => p.stats.total);
    const colors = portfolios.map((_, i) => PORTFOLIO_COLORS[i % PORTFOLIO_COLORS.length]);
    makeChart('_ov-sizes', 'bar', names, [{
      data: sizes,
      backgroundColor: colors,
      borderRadius: 6,
    }], {
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${Number(c.raw).toLocaleString()} records` } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 11 } } }
      }
    });

    /* Combined sectors donut */
    const allSectors = {};
    portfolios.forEach(p => {
      Object.entries(p.sectors || {}).forEach(([k, v]) => { allSectors[k] = (allSectors[k] || 0) + v; });
    });
    donut('_ov-sectors-donut', allSectors, SECTOR_COLORS);

    /* Grouped bar: sectors × portfolio */
    const sectorKeys = Object.entries(allSectors).sort((a, b) => b[1] - a[1]).map(e => e[0]);
    const datasets = portfolios.map((p, i) => ({
      label: p.name,
      data: sectorKeys.map(s => (p.sectors || {})[s] || 0),
      backgroundColor: PORTFOLIO_COLORS[i % PORTFOLIO_COLORS.length],
      borderRadius: 3,
    }));
    makeChart('_ov-sectors-grouped', 'bar', sectorKeys, datasets, {
      plugins: {
        legend: { display: true, position: 'bottom', labels: { font: { size: 11 }, padding: 12, usePointStyle: true } },
        tooltip: { mode: 'index' }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 11 } } }
      }
    });

    /* Combined gender */
    const allGender = {};
    portfolios.forEach(p => {
      Object.entries(p.gender || {}).forEach(([k, v]) => { allGender[k] = (allGender[k] || 0) + v; });
    });
    donut('_ov-gender', allGender, GENDER_COLORS);

    /* Combined location */
    const allLocation = {};
    portfolios.forEach(p => {
      const src = p.location || {};
      Object.entries(src).forEach(([k, v]) => { allLocation[k] = (allLocation[k] || 0) + v; });
    });
    donut('_ov-location', allLocation, LOCATION_COLORS);
  }

  const TYPE_ORDER = ['eoi','buz_needs','devices','platforms','digital_credit'];

    eoi:          'EOI & Segmentation',
    foundation:   'Foundation',

  window._forceRender = false;
  window.triggerActivePanelReRender = function() {
    window._forceRender = true;
    if (_activePanel) showPanel(_activePanel);
  };

  function showPanel(pid) {
    if (_activePanel === pid && !window._forceRender) return;
    window._forceRender = false;

    if (_activePanel && _activePanel !== pid) destroyPanel(_activePanel);
    _activePanel = pid;

    document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
    const panel = document.getElementById(pid);
    if (panel) panel.classList.add('active');

    // Highlight correct sub-tab for current type
    (_typeSubTabs[_activeType] || []).forEach(({ btn, pid: bpid }) => {
      btn.classList.toggle('active', bpid === pid);
    });

    const meta = _panels[pid];
    if (!meta) return;

    if (meta.portfolio) {
      const p_dyn = window.recalculatePortfolio(meta.portfolio, window.TIME_FILTER);
      panel.innerHTML = {
          segmentation: buildSegmentationHTML,
          growth_plans: buildGrowthPlansHTML,
          eoi:          buildEoiHTML,
          buz_needs:    buildBuzNeedsHTML,
          devices:      buildDevicesHTML,
          yiw:          buildYiwHTML,
          foundation:   buildFoundationHTML,
          platforms:    buildPlatformsHTML,
          cohorts:      buildCohortsHTML,
          digital_credit: buildDigitalCreditHTML,
          operations:   buildOperationsHTML,
      }[meta.type]?.(p_dyn, pid) ?? buildGrowthPlansHTML(p_dyn, pid);

      if (meta.type === 'buz_needs') {
        requestAnimationFrame(() => initBusinessNeedsCharts(p_dyn, pid));
      }
    }
    
    if (meta.type === 'overview') {
      const dynPortfolios = meta.portfolios.map(p => window.recalculatePortfolio(p, window.TIME_FILTER));
      panel.innerHTML = buildOverviewHTML(dynPortfolios);
      requestAnimationFrame(() => initOverviewCharts(dynPortfolios));
    } else if (meta.type === 'intelligence') {
      const dynPortfolios = meta.portfolios.map(p => window.recalculatePortfolio(p, window.TIME_FILTER));
      panel.innerHTML = buildIntelligenceHTML(dynPortfolios);
    } else if (meta.type === 'eoi-overview') {
      const eoiPortfolios = window.PORTFOLIO_DATA.portfolios.filter(p => p.type === 'eoi' || p.type === 'segmentation');
      const dynPortfolios = eoiPortfolios.map(p => window.recalculatePortfolio(p, window.TIME_FILTER));
      panel.innerHTML = buildEoiOverviewHTML(dynPortfolios);
      requestAnimationFrame(() => initEoiOverviewCharts(dynPortfolios));
    } else if (meta.type === 'eso_report_list') {
      const dynPortfolios = meta.portfolios.map(p => window.recalculatePortfolio(p, window.TIME_FILTER));
      panel.innerHTML = buildEsoReportListHTML(dynPortfolios);
    }
  }

  function showTypeGroup(type) {
    _activeType = type;

    // Update tier-1 highlight
    document.querySelectorAll('.type-tab-btn').forEach(b => b.classList.remove('active'));
    const typeBtn = document.querySelector(`.type-tab-btn[data-type="${type}"]`);
    if (typeBtn) typeBtn.classList.add('active');

    // Repopulate sub-tabs bar
    const subBar = document.getElementById('sub-tabs-bar');
    subBar.innerHTML = '';
    (_typeSubTabs[type] || []).forEach(({ btn }) => subBar.appendChild(btn));

    // Show first panel in this type
    const subs = _typeSubTabs[type] || [];
    if (subs.length) showPanel(subs[0].pid);
  }

  function setupScheduledDataRefresh() {
    const syncWindows = [
      { label: '0700', hour: 7, minute: 5 },
      { label: '1200', hour: 12, minute: 5 },
      { label: '1700', hour: 17, minute: 5 },
    ];
    const check = () => {
      const now = new Date();
      const today = now.toISOString().slice(0, 10);
      const activeWindow = syncWindows
        .filter(slot => now.getHours() > slot.hour || (now.getHours() === slot.hour && now.getMinutes() >= slot.minute))
        .pop();
      if (!activeWindow) return;

      const key = `portfolio-refresh-${today}-${activeWindow.label}`;
      if (sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, '1');
      window.location.reload();
    };

    window.setTimeout(check, 30 * 1000);
    window.setInterval(check, 5 * 60 * 1000);
  }

    _typeSubTabs['eso_report'] = [{ btn: (() => {
      const b = document.createElement('button');
      b.className = 'sub-tab-btn';
      b.textContent = 'ESO List';
      b.dataset.panel = 'panel-eso-report-list';
      b.onclick = () => showPanel('panel-eso-report-list');
      return b;
    })(), pid: 'panel-eso-report-list' }];
    _panels['panel-eso-report-list'] = { type: 'eso_report_list', portfolios: esoPortfolios };

    // Add a panel for each ESO (but not sub-tabs, only list links)
    const esoSet = new Set();
    esoPortfolios.forEach(p => esoSet.add(p.eso));
    Array.from(esoSet).forEach(eso => {
      const pid = `panel-eso-report-${eso.replace(/[^a-zA-Z0-9]/g,'_')}`;
      const panel = document.createElement('div');
      panel.id = pid;
      panel.className = 'panel';
      panel.innerHTML = buildEsoReportHTML(eso, esoPortfolios);
      content.appendChild(panel);
      _panels[pid] = { type: 'eso_report', eso, portfolios: esoPortfolios };
    });

    // Delegate click from ESO list to showPanel
    document.addEventListener('click', function(e) {
      if (e.target && e.target.classList.contains('eso-report-btn')) {
        const eso = e.target.dataset.eso;
        const pid = `panel-eso-report-${eso.replace(/[^a-zA-Z0-9]/g,'_')}`;
        showTypeGroup('eso_report');
        showPanel(pid);
      }
    });

    /* Show All Portfolios overview by default */
    showTypeGroup('overview');
  }

  function downloadCSV(filename, rows) {
    const escapeCell = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
    const csv = rows.map(row => row.map(escapeCell).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  window.downloadQualityCSV = function() {
    const portfolios = (window.PORTFOLIO_DATA?.portfolios || []).filter(p => p.type !== 'yiw');
    const rows = [['Dataset', 'Type', 'ESO', 'Total Records', 'Metric', 'Value']];
    portfolios.forEach(p => {
      const dq = p.data_quality || {};
      if (!Object.keys(dq).length) {
        rows.push([p.name, p.type, p.eso || '', p.stats?.total || 0, 'no_data_quality_metrics', '']);
      } else {
        Object.entries(dq).forEach(([metric, value]) => rows.push([p.name, p.type, p.eso || '', p.stats?.total || 0, metric, value]));
      }
    });
    downloadCSV('portfolio-data-quality.csv', rows);
  };

  window.downloadEso360CSV = function() {
    const portfolios = (window.PORTFOLIO_DATA?.portfolios || []).filter(p => p.type !== 'yiw' && p.eso);
    const esoMap = {};
    portfolios.forEach(p => {
      const eso = p.eso;
      esoMap[eso] = esoMap[eso] || { eoi: 0, buz_needs: 0, devices: 0, platforms: 0, digital_credit: 0, quality: 0 };
      esoMap[eso][p.type] = (esoMap[eso][p.type] || 0) + (p.stats?.total || 0);
      esoMap[eso].quality += Object.values(p.data_quality || {}).reduce((a, b) => a + (Number(b) || 0), 0);
    });
    (window.PORTFOLIO_DATA?.portfolios || []).filter(p => p.type === 'digital_credit').forEach(p => {
      (p.eso_credit || []).forEach(row => {
        const eso = row.eso || 'Unknown';
        esoMap[eso] = esoMap[eso] || { eoi: 0, buz_needs: 0, devices: 0, platforms: 0, digital_credit: 0, quality: 0 };
        esoMap[eso].digital_credit += Number(row.demand || row.businesses || 0);
      });
    });
    const rows = [['ESO', 'EOI', 'Business Needs', 'Devices', 'Platforms', 'Digital Credit', 'Quality Signals']];
    Object.entries(esoMap).sort((a, b) => a[0].localeCompare(b[0])).forEach(([eso, d]) => {
      rows.push([eso, d.eoi || 0, d.buz_needs || 0, d.devices || 0, d.platforms || 0, d.digital_credit || 0, d.quality || 0]);
    });
    downloadCSV('portfolio-eso-360.csv', rows);
  };

  /* ═══════════════════════════════════════════════════════════════
     REFRESH HINT
  ═══════════════════════════════════════════════════════════════ */
  window.downloadTeamTimesheetCSV = function() {
    const ops = (window.PORTFOLIO_DATA?.portfolios || []).find(p => p.type === 'operations');
    const rows = [['Date', 'Owner', 'Stream', 'Activity', 'Hours', 'Status']];
    (ops?.activities || []).forEach(a => rows.push([
      a.date || '',
      a.owner || '',
      a.stream || '',
      a.activity || '',
      a.hours || 0,
      a.status || '',
    ]));
    downloadCSV('team-timesheet.csv', rows);
  };

  window.downloadOpsTicketsCSV = function() {
    const ops = (window.PORTFOLIO_DATA?.portfolios || []).find(p => p.type === 'operations');
    const rows = [['Ticket ID', 'Title', 'Owner', 'Priority', 'Status', 'Due Date']];
    (ops?.tickets || []).forEach(t => rows.push([
      t.id || '',
      t.title || '',
      t.owner || '',
      t.priority || '',
      t.status || '',
      t.due || '',
    ]));
    downloadCSV('operations-tickets.csv', rows);
  };

  window.showRefreshHint = function () {
    alert(
      'To refresh data with new Excel files:\n\n' +
      '1. Drop your .xlsx files into the same folder\n' +
      '2. Run:  python extract_data.py\n' +
      '3. Reload this page (F5)\n\n' +
      'Or double-click run_dashboard.bat for a one-step update.'
    );
  };

  // ═══════════════════════════════════════════════════════════════
  // ESO REPORT BUILDERS (NEW)
  // ═══════════════════════════════════════════════════════════════
  // Summary grid for all ESOs across all aspects
  function buildEsoReportSummaryGrid(esoPortfolios) {
    if (!esoPortfolios.length) return '<div class="no-data-note">No ESO data available</div>';
    // Collect all unique ESOs
    const esoSet = new Set(esoPortfolios.map(p => p.eso));
    const aspects = [
      { key: 'foundation', label: 'Foundation' },
      { key: 'buz_needs', label: 'Business Needs' },
      { key: 'devices', label: 'Devices' },
      { key: 'platforms', label: 'Platforms' },
    ];
    // Build a lookup: aspect → eso → portfolio
    const aspectEsoMap = {};
    aspects.forEach(a => {
      aspectEsoMap[a.key] = {};
      esoPortfolios.forEach(p => {
        if (p.type === a.key && p.eso) aspectEsoMap[a.key][p.eso] = p;
      });
    });
    // Table header
    let html = '<div class="card" style="margin-bottom:18px"><h3>ESO Comparison Grid</h3>';
    html += '<div style="overflow-x:auto"><table class="eso-summary-table" style="border-collapse:collapse;width:100%">';
    html += '<thead><tr style="background:#F3F4F6">'
      + '<th style="padding:7px 10px;text-align:left;font-size:.9em">ESO</th>';
    aspects.forEach(a => {
      html += '<th style="padding:7px 10px;text-align:center;font-size:.9em">' + a.label + '</th>';
    });
    html += '</tr></thead><tbody>';
    // Table rows: one per ESO
    Array.from(esoSet).sort().forEach(eso => {
      html += '<tr>';
      html += '<td style="padding:7px 10px;font-weight:600">' + eso + '</td>';
      aspects.forEach(a => {
        const p = aspectEsoMap[a.key][eso];
        if (p) {
          html += '<td style="padding:7px 10px;text-align:center">'
            + '<button class="eso-report-btn" data-eso="' + eso + '" style="font-size:.9em;padding:4px 10px;border-radius:6px;border:none;background:#6366F1;color:#fff;cursor:pointer">View</button>'
            + '<div style="font-size:.8em;color:#64748B;margin-top:2px">' + (p.stats?.total?.toLocaleString() || '-') + '</div>'
            + '</td>';
        } else {
          html += '<td style="padding:7px 10px;text-align:center;color:#CBD5E1">—</td>';
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
    return html;
  }

  // ESO Report List: summary grid + quick links
  function buildEsoReportListHTML(esoPortfolios) {
    if (!esoPortfolios.length) return '<div class="no-data-note">No ESO data available</div>';
    // Summary grid
    let html = buildEsoReportSummaryGrid(esoPortfolios);
    // Quick links to each ESO
    const esoSet = new Set(esoPortfolios.map(p => p.eso));
    html += '<div class="card" style="margin-top:18px"><h3>Jump to ESO Report</h3>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:10px">';
    Array.from(esoSet).sort().forEach(eso => {
      const pid = `panel-eso-report-${eso.replace(/[^a-zA-Z0-9]/g,'_')}`;
      html += '<button class="eso-report-btn" data-eso="' + eso + '" style="font-size:.95em;padding:7px 18px;border-radius:7px;border:none;background:#3B82F6;color:#fff;cursor:pointer">' + eso + '</button>';
    });
    html += '</div></div>';
    return html;
  }

  // Per-ESO report: show all aspects for a single ESO
  function buildEsoReportHTML(eso, esoPortfolios) {
    // Find all portfolios for this ESO, grouped by aspect
    const aspects = [
      { key: 'foundation', label: 'Foundation', builder: buildFoundationHTML },
      { key: 'buz_needs', label: 'Business Needs', builder: buildBuzNeedsHTML },
      { key: 'devices', label: 'Devices', builder: buildDevicesHTML },
      { key: 'platforms', label: 'Platforms', builder: buildPlatformsHTML },
    ];
    let html = '<div class="section-hdr"><h2>ESO Report: ' + eso + '</h2></div>';
    aspects.forEach(a => {
      const p = esoPortfolios.find(p => p.eso === eso && p.type === a.key);
      if (p) {
        html += '<div class="card" style="margin-bottom:18px"><h3>' + a.label + '</h3>';
        html += a.builder(p);
        html += '</div>';
      }
    });
    return html;
  }

  /* ─── Run ─── */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
