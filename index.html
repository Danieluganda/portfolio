  /* ── EOI Applications ──────────────────────────────────────────────────── */
  function buildEoiHTML(p) {
    const total        = p.stats.total;
    const founders     = p.founders || {};
    const femalePct    = (founders.female_pct || 0).toFixed(1);
    const malePct      = (100 - parseFloat(femalePct)).toFixed(1);
    const ursb         = p.stats.ursb || 0;
    const ursbPct      = (p.ursb_pct || 0).toFixed(1);
    const pwd          = p.stats.pwd || 0;
    const refugees     = p.stats.refugees || 0;
    const genderTotal  = Object.values(founders.gender || {}).reduce((a,b)=>a+b,0);
    const genderBars   = barRowsHTML(founders.gender || {}, null, genderTotal, 4);

    const idSt   = p.id_status  || {};
    const ninSt  = p.nin_status || {};
    const tinSt  = p.tin_status  || {};
    const nssfSt = p.nssf_status || {};
    const hasNid = idSt['Has National ID']  || 0;
    const hasNin = ninSt['Has NIN'] || 0;

    const idTotal  = Object.values(idSt).reduce((a,b)=>a+b,0)  || 1;
    const ninTotal = Object.values(ninSt).reduce((a,b)=>a+b,0) || 1;
    const tinTotal = Object.values(tinSt).reduce((a,b)=>a+b,0) || 1;
    const nssfTotal= Object.values(nssfSt).reduce((a,b)=>a+b,0)|| 1;

    const YES_NO_COLORS = { 'Yes': '#10B981', 'No': '#EF4444' };
    const NID_COLORS    = { 'Has National ID': '#10B981', 'Missing ID': '#F59E0B' };
    const NIN_COLORS    = { 'Has NIN': '#10B981', 'No NIN': '#EF4444' };

    const ARCHETYPE_COLORS = {
      'Gazelles':          '#10B981',
      'Bootstrappers SME': '#3B82F6',
      'Bootstrappers':     '#60A5FA',
      'Gig Workers':       '#F97316',
      'Invisibles':        '#94A3B8',
      'No Revenue Data':   '#CBD5E1',
    };
    const allEoi = (window.PORTFOLIO_DATA?.portfolios || []).filter(x => x.type === 'eoi');
    const allTotal = allEoi.reduce((s, x) => s + (x.stats?.total || 0), 0);
    const allUrsb = allEoi.reduce((s, x) => s + (x.stats?.ursb || 0), 0);
    const allFemaleWeighted = allEoi.reduce((s, x) => {
      const fp = x.founders?.female_pct || 0;
      return s + fp * (x.stats?.total || 0) / 100;
    }, 0);
    const overallUrsbPct = allTotal ? (allUrsb / allTotal * 100) : 0;
    const overallFemalePct = allTotal ? (allFemaleWeighted / allTotal * 100) : 0;
    const esoShare = allTotal ? (total / allTotal * 100).toFixed(1) : '0.0';
    const ursbGap = (parseFloat(ursbPct) - overallUrsbPct).toFixed(1);
    const femaleGap = (parseFloat(femalePct) - overallFemalePct).toFixed(1);
    const topSector = sorted(p.sectors || {}, 1)[0];
    const topDistrict = sorted(p.districts || {}, 1)[0];
    const youthCount = (p.age_bands?.['18–25'] || 0) + (p.age_bands?.['26–35'] || 0);
    const youthPct = total ? (youthCount / total * 100).toFixed(1) : '0.0';
    const tinYes = tinSt.Yes || tinSt.YES || tinSt.yes || 0;
    const nssfYes = nssfSt.Yes || nssfSt.YES || nssfSt.yes || 0;
    const tinPct = total ? (tinYes / total * 100).toFixed(1) : '0.0';
    const nssfPct = total ? (nssfYes / total * 100).toFixed(1) : '0.0';
    const dq = p.data_quality || {};
    const compactRaw = ((p.raw_records || [])[0] && Object.keys((p.raw_records || [])[0]).length <= 3);
    const founderCountFlag = (p.total_founders || 0) > total * 3;
    const founderRatio = total ? ((p.total_founders || 0) / total).toFixed(2) : '0.00';
    const derivedTargets = (p.targets || []).map(t => {
      const label = String(t.label || '').toLowerCase();
      let actual = t.actual || 0;
      if (!actual && label.includes('youth')) actual = youthCount;
      if (!actual && label.includes('ursb')) actual = ursb;
      if (!actual && label.includes('pwd')) actual = pwd;
      if (!actual && label.includes('refugee')) actual = refugees;
      return { ...t, actual };
    });
    const insight = (label, value, note, tone = 'info') => `
      <div class="insight ${tone}">
        <strong style="display:block;color:#0F172A;margin-bottom:2px">${label}</strong>
        <span style="font-size:.9rem;font-weight:800;color:#1E293B">${value}</span>
        <span style="display:block;margin-top:2px">${note}</span>
      </div>`;

    return `
      <div class="port-header">
        <div class="port-bar-strip"><div class="port-bar-orange"></div><div class="port-bar-blue"></div></div>
        <div class="port-title-area">
          <div class="port-title">${p.name}</div>
          <div class="port-filename">${p.filename}</div>
        </div>

      <div class="kpi-strip-7">
        ${kpiBox(fmt(total),            'Applications',      'ko')}
        ${kpiBox(ursb,                  'URSB Registered',   'kg')}
        ${kpiBox(ursbPct + '%',         'URSB Rate',         'kb')}
        ${kpiBox(femalePct + '%',       'Female Founders',   'kp')}
        ${kpiBox(p.total_founders || 0, 'Total Founders',    'kt')}
        ${kpiBox(hasNid,                'Have Nat. ID',      'kr')}
        ${kpiBox(hasNin,                'Employees w/ NIN',  'ka')}
      </div>

      <div class="landing-grid three">
        <div class="landing-card">
          <h3>ESO Summary Insight</h3>
          <div class="insight-list">
            ${topSector ? insight('Strongest Sector', topSector[0], `${fmt(topSector[1])} applications`, 'good') : insight('Strongest Sector', 'No sector data', 'Sector field is empty for this ESO.', 'warn')}

  /* ── Youth in Work ─────────────────────────────────────────────────────── */
  function buildYiwHTML(p) {
    const total       = p.stats.total;
    const byEso       = p.by_eso || {};
    const esoTotal    = Object.values(byEso).reduce((s, d) => s + d.total, 0) || 1;
    const earnedStats = p.earned_amount_stats || {};
    const inclusion   = p.inclusion_metrics || {};
    const incomeBands = p.income_amount_bands || {};
    const businessStatus = p.business_status || {};
    const byEsoDetail = p.by_eso_detail || {};
    const byDistrictDetail = p.by_district_detail || {};
    const byQuarterDetail = p.by_quarter_detail || {};
    const themes = p.theme_counts || {};
    const quotes = p.yiw_quotes || [];
    const source = String(p.filename || '').startsWith('kobo:') ? 'Kobo' : 'Local';
    const fmtUGX = n => {
      n = Number(n || 0);
      if (n >= 1000000000) return (n / 1000000000).toFixed(2) + 'B';
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      return fmt(n);
    };
    const pctText = count => total ? (Number(count || 0) / total * 100).toFixed(1) + '%' : '0%';
    const tableRows = (obj, nameLabel) => {
      const entries = Object.entries(obj || {}).slice(0, 12);
      if (!entries.length) return '<tr><td colspan="6">No data available</td></tr>';
      return entries.map(([name, d]) => `
        <tr>
          <td>${name}</td>
          <td>${fmt(d.total || 0)}</td>
          <td>${fmt(d.earning || 0)}</td>
          <td>${fmtUGX(d.total_income || 0)}</td>
          <td>${fmt(d.median_income || 0)}</td>
          <td>${d.total ? Math.round((d.growing || 0) / d.total * 100) : 0}%</td>
        </tr>`).join('');
    };
    const quarterRows = Object.entries(byQuarterDetail).sort((a,b) => a[0].localeCompare(b[0]))
      .map(([q, d]) => `
        <tr>
          <td>${q}</td>
          <td>${fmt(d.total || 0)}</td>
          <td>${fmt(d.earning || 0)}</td>
          <td>${fmtUGX(d.total_income || 0)}</td>
          <td>${fmt(d.median_income || 0)}</td>
          <td>${d.total ? Math.round((d.conditions_yes || 0) / d.total * 100) : 0}%</td>

    const outcomeTiles = [
      ['Higher income', (p.work_improvements || {})['Higher income'] || 0],
      ['Sense of purpose', (p.work_improvements || {})['Sense of purpose'] || 0],
      ['Good reputation', (p.work_improvements || {})['Good reputation'] || 0],
      ['Workplace respect', (p.work_improvements || {})['Respect at workplace'] || 0],
    ].map(([label, count]) => `
      <div class="metric-card">
        <div class="metric-value">${fmt(count)}</div>
        <div class="metric-label">${label}</div>
        <div class="metric-sub">${pctText(count)} of records</div>
      </div>`).join('');
    const themeRows = Object.entries(themes).sort((a,b) => b[1] - a[1]).slice(0, 8)
      .map(([label, count]) => {
        const max = Math.max(...Object.values(themes), 1);
        return `<div class="bar-row">
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(count / max * 100, 100).toFixed(1)}%;background:#2563EB"></div></div>
          <span class="bar-name">${label}</span>
          <span class="bar-stat">${fmt(count)}</span>

      }).join('') || '<div class="no-data-note">No theme data available</div>';
    const quoteCards = quotes.slice(0, 8).map(q => `
      <div class="metric-card">
        <div style="font-size:.82rem;line-height:1.45;color:#1E293B">"${q.text}"</div>
        <div class="metric-sub" style="margin-top:8px">${q.business_status || 'Status unknown'} · ${q.employment || 'Employment unknown'} · ${q.eso || 'ESO unknown'} · ${q.district || 'District unknown'}</div>
      </div>`).join('');

    const esoBars = Object.entries(byEso)
      .sort((a, b) => b[1].total - a[1].total)
      .map(([eso, d], i) => {
        const w     = Math.min(d.total / esoTotal * 100, 100).toFixed(1);
        const color = PALETTE[i % PALETTE.length];
        return `<div class="bar-row">
          <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
          <span class="bar-name" title="${eso}">${eso}</span>
          <span class="bar-stat">${d.total.toLocaleString()}</span>
        </div>`;

    return `
      <div class="port-header">
        <div class="port-bar-strip"><div class="port-bar-orange"></div><div class="port-bar-blue"></div></div>
        <div class="port-title-area">
          <div class="port-title">${p.name}</div>

      </div>
      <div class="kpi-strip-7">
        ${kpiBox(fmt(total),                         'YIW Records',     'ko')}
        ${kpiBox(fmt(p.earned_income_count || 0),    'Earning Income',  'kg')}
        ${kpiBox(fmtUGX(earnedStats.total || 0),     'Total UGX',       'kb')}
        ${kpiBox(fmt(earnedStats.median || 0),       'Median UGX',      'kp')}
        ${kpiBox(fmt(p.work_improved_count || 0),    'Work Improved',   'ka')}
        ${kpiBox((p.foundation_done_pct || 0) + '%', 'Foundation Done', 'kt')}
        ${kpiBox(source,                             'Source',          'kr')}
      </div>
      <div class="landing-card" style="margin-bottom:12px">
        <h3>${(p.earned_income_count || 0) > total * 0.5 ? 'YES - Youth are in work' : 'Mixed evidence - review selected records'}</h3>
        <p style="margin:4px 0 0;color:#475569;font-size:.86rem">
          ${fmt(p.earned_income_count || 0)} of ${fmt(total)} youth (${pctText(p.earned_income_count || 0)}) reported earning income.
          Valid reported income totals UGX ${fmtUGX(earnedStats.total || 0)} after excluding ${fmt(earnedStats.outliers_excluded || 0)} income outliers above UGX 5,000,000.
          ${pctText(p.work_improved_count || 0)} report improved working conditions.

      </div>
      <div class="landing-grid three metric-grid">
        ${metric('UGX ' + fmtUGX(earnedStats.total || 0), 'Total Income Generated', 'Outlier-filtered valid income', 'green')}
        ${metric('UGX ' + fmt(earnedStats.avg || 0), 'Average Per Earner', `${fmt(earnedStats.count || 0)} earners with valid amounts`, 'blue')}
        ${metric('UGX ' + fmt(earnedStats.median || 0), 'Median Income', `IQR: ${fmtUGX(earnedStats.q1 || 0)} - ${fmtUGX(earnedStats.q3 || 0)}`, 'purple')}
        ${metric(fmt(inclusion.pwd || 0), 'PWD', 'Disability status marked yes', 'orange')}
        ${metric(fmt(inclusion.refugees || 0), 'Refugees', 'Refugee status marked yes', 'teal')}
        ${metric(fmt(Object.keys(byEso).length), 'ESO Partners', 'Support organizations represented', 'blue')}
      </div>
      <div class="three-col">
        <div class="col-section" style="grid-column:span 2">
          <div class="col-hdr teal-hdr">BY ESO PARTNER</div>
          <div class="col-body">${esoBars}</div>
        </div>
        <div class="col-section">
          <div class="col-hdr green-hdr">CORE OUTCOMES</div>
          <div class="col-body">

      </div>
      <div class="landing-grid two" style="margin-top:12px">
        <div class="landing-card">

  function initBusinessNeedsCharts(p, pid = 'business-needs') {
    const total = p.stats?.total || 0;
    const registeredCount = Math.round(total * ((p.registered_pct || 0) / 100));
    const notRegistered = Math.max(total - registeredCount, 0);

    donut(`${pid}-bn-registration`, {
      'Registered': registeredCount,
      'Not registered': notRegistered
    }, {
      'Registered': '#10B981',
      'Not registered': '#CBD5E1'
    });

    donut(`${pid}-bn-readiness`, p.mobile_payments || {}, {
      'Yes': '#0F766E',
      'No': '#CBD5E1'
    });

    hBar(`${pid}-bn-skills`, p.digital_skills || {}, null, 8);
  }

                  <div style="font-size:1.3rem;font-weight:800;color:#7C3AED">${fmt(xenteStb.total||0)}</div>
                  <div style="font-size:.61rem;font-weight:600;text-transform:uppercase;color:#5B21B6">Stanbic</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-section">
            <div class="col-hdr green-hdr">FLEXIPAY &#8212; ENGAGEMENT FUNNEL</div>
            <div class="col-body">
              <div class="sub-hdr green-txt">USER JOURNEY</div>
              <div style="font-size:.62rem;color:#6B7280;margin-bottom:8px">Enrolment to full registration</div>
              ${funnelRows}
              <div style="margin-top:8px;padding:7px;background:#F0FDF4;border-radius:6px;border-left:3px solid #10B981">
                <div style="display:flex;justify-content:space-between;font-size:.67rem;font-weight:600;margin-bottom:4px">
                  <span style="color:#065F46">Fully Registered</span>
                  <span style="color:#065F46">${flexiFull.toLocaleString()} (${flexiFullPct}%)</span>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:.67rem;font-weight:600">
                  <span style="color:#6B7280">Pending Validation</span>
                  <span style="color:#92400E">${flexiPend.toLocaleString()} (${flexiPendPct}%)</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>`;
  }

  /* ── Device Financing ──────────────────────────────────────────────────── */
  function buildDevicesHTML(p) {
    const total   = p.stats.total;
    const disPct  = (p.disability_pct   || 0).toFixed(1);
    const regPct  = (p.business_reg_pct || 0).toFixed(1);
    const withDis = p.stats.with_disability || 0;
    const bizReg  = p.stats.business_reg    || 0;

    const deviceTypes     = p.device_types     || {};
    const priceBands      = p.price_bands      || {};
    const paymentDuration = p.payment_duration || {};
    const esoHubs         = p.eso_hubs         || {};
    const idTypes         = p.id_types         || {};
    const regBody         = p.reg_body         || {};
    const disTypes        = p.disability_types || {};
    const deviceByEso     = p.device_by_eso    || {};
    const simReg          = p.sim_registered   || {};
    const weeklyAct       = p.weekly_activity  || {};
    const esoWeekly       = p.eso_weekly       || {};
    const devWeekly       = p.device_weekly    || {};
    const priceStats      = p.price_stats      || {};
    const priceByDevice   = p.price_by_device  || {};
    const priceByEso      = p.price_by_eso     || {};
    const topDeviceByEso  = p.top_device_by_eso || {};
    const smartphoneShare = p.smartphone_share_by_eso || {};
    const dataQuality     = p.data_quality     || {};
    const availability    = p.field_availability || {};

    const fallbackDeviceEso = () => {
      if (Object.keys(esoHubs).length) return esoHubs;
      const weeklyTotals = Object.fromEntries(
        Object.entries(esoWeekly)
          .map(([eso, d]) => [eso, d && typeof d === 'object' ? d.total || 0 : 0])
          .filter(([, total]) => total > 0)
      );
      if (Object.keys(weeklyTotals).length) return weeklyTotals;
      return p.name ? { [p.name.replace(/\s+Device Financing$/i, '')]: total } : {};
    };

    const deviceTotal  = Object.values(deviceTypes).reduce((a,b)=>a+b,0)     || 1;
    const priceTotal   = Object.values(priceBands).reduce((a,b)=>a+b,0)      || 1;
    const payTotal     = Object.values(paymentDuration).reduce((a,b)=>a+b,0) || 1;
    const esoTotal     = Object.values(esoHubs).reduce((a,b)=>a+b,0)         || 1;
    const idTotal      = Object.values(idTypes).reduce((a,b)=>a+b,0)         || 1;
    const regBodyTotal = Object.values(regBody).reduce((a,b)=>a+b,0)         || 1;
    const simRegTotal  = Object.values(simReg).reduce((a,b)=>a+b,0)          || 1;

    const appsWk  = weeklyAct.apps_this_week  || 0;
    const appsLwk = weeklyAct.apps_last_week  || 0;
    const appsMo  = weeklyAct.apps_this_month || 0;
    const avgPrice= priceStats.avg    ? 'UGX ' + fmt(priceStats.avg)    : '—';
    const medPrice= priceStats.median ? 'UGX ' + fmt(priceStats.median) : '—';

    const missingQualityTotal = Object.entries(dataQuality)
      .filter(([k]) => k !== 'duplicate_phone_numbers')
      .reduce((s, [, v]) => s + (Number(v) || 0), 0);
    const topDevice = Object.entries(deviceTypes).sort((a,b)=>b[1]-a[1])[0];
    const topDistrict = Object.entries(p.districts || {}).sort((a,b)=>b[1]-a[1])[0];
    const insight = (label, value, note, tone = 'info') => `
      <div class="insight ${tone}">
        <strong style="display:block;color:#0F172A;margin-bottom:2px">${label}</strong>
        <span style="font-size:.9rem;font-weight:800;color:#1E293B">${value}</span>
        <span style="display:block;margin-top:2px">${note}</span>
      </div>`;
    const priceRows = obj => Object.entries(obj || {}).slice(0, 6).map(([label, d]) => `
      <div class="snapshot-row">
        <span title="${label}">${label}</span>
        <div class="mini-track"><div class="mini-fill" style="width:${Math.min((d.count || 0) / Math.max(total, 1) * 100, 100).toFixed(1)}%;background:#EA580C"></div></div>
        <strong>UGX ${fmt(d.median || d.avg || 0)}</strong>
      </div>`).join('') || '<div class="no-data-note">No price breakdown available</div>';
    const partnerRows = Object.entries(topDeviceByEso || {}).slice(0, 8).map(([eso, device]) => {
      const share = smartphoneShare[eso] != null ? smartphoneShare[eso] + '%' : 'N/A';
      const price = priceByEso[eso]?.median ? 'UGX ' + fmt(priceByEso[eso].median) : 'N/A';
      const count = esoHubs[eso] || esoWeekly[eso]?.total || priceByEso[eso]?.count || 0;
      return `<div class="snapshot-row">
        <span title="${eso}">${eso}</span>
        <div class="mini-track"><div class="mini-fill" style="width:${Math.min(count / Math.max(total, 1) * 100, 100).toFixed(1)}%;background:#0F766E"></div></div>
        <strong>${device} / ${share} / ${price}</strong>
      </div>`;
    }).join('') || '<div class="no-data-note">No partner device mix available</div>';

    const DEVICE_COLORS = {
      'Smartphone': '#3B82F6', 'Tablet': '#8B5CF6', 'Laptop': '#10B981',
      'POS': '#F59E0B', 'Software': '#EF4444'
    };
    const PRICE_COLORS = {
      'Under 200K': '#6EE7B7', '200K–500K': '#34D399',
      '500K–1M': '#10B981', '1M–2M': '#059669', '2M+': '#047857'
    };
    const PAY_COLORS = {
      'Weekly': '#60A5FA', 'Bi-Weekly': '#3B82F6', 'Monthly': '#2563EB',
      'Quarterly': '#1D4ED8', 'Semi-Annual': '#1E40AF', 'Yearly': '#1E3A8A'
    };

    // ── ESO performance rows (sorted by total, filtered) ───────────────
    const ESO_FILTER = ['Other', 'FindingXY', 'Test', 'Tests'];
    const esoRanked = Object.entries(esoWeekly)
      .filter(([k]) => !ESO_FILTER.includes(k))
      .sort((a, b) => b[1].total - a[1].total);

    const esoRankRows = esoRanked.map(([eso, d], i) => {
      const barW  = Math.min(d.total / (esoRanked[0][1].total || 1) * 100, 100).toFixed(1);
      const color = i === 0 ? '#3B82F6' : i === 1 ? '#8B5CF6' : i === 2 ? '#10B981' : '#64748B';
      const rank  = i < 3
        ? `<span class="rank-badge rank-${i+1}">${i+1}</span>`
        : `<span style="font-size:.62rem;color:#CBD5E1;padding-right:2px">${i+1}</span>`;
      return `<div class="eso-perf-row">
        <div class="eso-name">${rank} ${eso}</div>
        <div class="eso-bar-wrap"><div class="eso-bar-fill" style="width:${barW}%;background:${color}"></div></div>
        <div class="eso-stat">${d.total.toLocaleString()}</div>
        <div class="eso-stat" style="color:#10B981">↑${d.this_week} wk</div>
        <div class="eso-stat" style="color:#6366F1">↑${d.this_month} mo</div>
      </div>`;
    }).join('');

    // ── Top ESOs this week ──────────────────────────────────────────────
    const topWk = Object.entries(esoWeekly)
      .filter(([k]) => !ESO_FILTER.includes(k) && k !== 'MUBS_EIIC')
      .sort((a, b) => b[1].this_week - a[1].this_week)
      .slice(0, 5);
    const topWkRows = topWk.map(([eso, d], i) => {
      const medals = ['🥇','🥈','🥉'];
      const medal  = medals[i] || `${i+1}.`;
      return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
        <span style="font-size:.85rem;min-width:22px">${medal}</span>
        <span style="font-size:.72rem;font-weight:700;color:#1E293B;flex:1">${eso}</span>
        <span style="font-size:.72rem;font-weight:800;color:#3B82F6">${d.this_week}</span>
      </div>`;
    }).join('') || '<div class="no-data-note">No data for this week</div>';

    // ── Top ESOs last week ──────────────────────────────────────────────
    const topLwk = Object.entries(esoWeekly)
      .filter(([k]) => !ESO_FILTER.includes(k))
      .sort((a, b) => b[1].last_week - a[1].last_week)
      .slice(0, 5);
    const topLwkRows = topLwk.map(([eso, d], i) => {
      const medals = ['🥇','🥈','🥉'];
      const medal  = medals[i] || `${i+1}.`;
      return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
        <span style="font-size:.85rem;min-width:22px">${medal}</span>
        <span style="font-size:.72rem;font-weight:700;color:#1E293B;flex:1">${eso}</span>
        <span style="font-size:.72rem;font-weight:800;color:#6366F1">${d.last_week}</span>
      </div>`;
    }).join('') || '<div class="no-data-note">No data last week</div>';

    // ── Device type weekly rows ─────────────────────────────────────────
    const devWeeklyRows = Object.entries(devWeekly).sort((a,b)=>b[1].total-a[1].total).map(([dev, d]) => {
      const barW  = Math.min(d.total / (deviceTotal || 1) * 100, 100).toFixed(1);
      const color = DEVICE_COLORS[dev] || '#64748B';
      return `<div class="dev-weekly-row">
        <div class="dw-name">${dev}</div>
        <div style="position:relative;height:10px;background:#E8EDF2;border-radius:2px;overflow:hidden">
          <div style="position:absolute;left:0;top:0;height:100%;background:${color};border-radius:2px;width:${barW}%"></div>
        </div>
        <div class="dw-stat">${d.total.toLocaleString()}</div>
        <div class="dw-stat" style="color:#10B981">${d.this_week}</div>
        <div class="dw-stat" style="color:#6366F1">${d.this_month}</div>
      </div>`;
    }).join('') || '<div class="no-data-note">No device weekly data</div>';

    return `
      <div class="port-header">
        <div class="port-bar-strip"><div class="port-bar-orange"></div><div class="port-bar-blue"></div></div>
        <div class="port-title-area">
          <div class="port-title">${p.name}</div>
          <div class="port-filename">${p.filename}</div>
        </div>
      </div>

      <!-- KPI strip -->
      <div class="kpi-strip-7">
        ${kpiBox(fmt(total),    'Total Applications', 'ko')}
        ${kpiBox(appsWk,        'This Week',          'kg')}
        ${kpiBox(appsLwk,       'Last Week',          'kb')}
        ${kpiBox(appsMo,        'This Month',         'kp')}
        ${kpiBox(disPct + '%',  'Disability Rate',    'kr')}
        ${kpiBox(regPct + '%',  'Business Reg. Rate', 'kt')}
        ${kpiBox(avgPrice,      'Avg Device Price',   'ka')}
      </div>

      <!-- Activity strip -->
      <div class="activity-strip" style="grid-template-columns:repeat(3,1fr) repeat(3,1fr)">
        <div class="act-card act-green">
          <div class="act-val">${appsWk.toLocaleString()}</div>
          <div class="act-lbl">Apps This Week</div>
        </div>
        <div class="act-card act-green">
          <div class="act-val">${appsLwk.toLocaleString()}</div>
          <div class="act-lbl">Apps Last Week</div>
        </div>
        <div class="act-card act-green">
          <div class="act-val">${appsMo.toLocaleString()}</div>
          <div class="act-lbl">Apps This Month</div>
        </div>
        <div class="act-card act-blue">
          <div class="act-val">${medPrice}</div>
          <div class="act-lbl">Median Price</div>
        </div>
        <div class="act-card act-blue">
          <div class="act-val">${withDis}</div>
          <div class="act-lbl">With Disability</div>
        </div>
        <div class="act-card act-blue">
          <div class="act-val">${bizReg}</div>
          <div class="act-lbl">Business Registered</div>
        </div>
      </div>

      <div class="landing-grid two">
        <div class="landing-card">
          <h3>Partner Operational View</h3>
          <div class="snapshot-list">
            ${partnerRows}
          </div>
          <div class="no-data-note" style="margin-top:8px">Format: top device / smartphone share / median price.</div>
        </div>
        <div class="landing-card">
          <h3>Top Distribution Areas</h3>
          <div class="insight-list">
            ${insight('Top Device', topDevice ? topDevice[0] : 'No data', topDevice ? `${fmt(topDevice[1])} distributed` : 'No device distribution recorded.', topDevice ? 'good' : 'warn')}
            ${insight('Top District', topDistrict ? topDistrict[0] : 'No data', topDistrict ? `${fmt(topDistrict[1])} devices` : 'No geographic data available.', topDistrict ? 'info' : 'warn')}
          </div>
        </div>
      </div>

      <!-- ROW 1: Location | ESO Performance Ranking -->
      <div class="three-col">
        <div class="col-section" style="grid-column:span 2">
          <div class="col-hdr purple-hdr">DISTRIBUTION BY LOCATION</div>
          <div class="col-body">
            ${districtBarRowsHTML(p.districts || {}, 10)}
          </div>
        </div>
        <div class="col-section">
          <div class="col-hdr teal-hdr">ESO PARTNER PERFORMANCE</div>
          <div class="col-body">
            ${esoRanked.length ? `
              <div class="eso-perf-row" style="margin-bottom:4px">
                <div style="font-size:.6rem;color:#94A3B8;font-weight:700">ESO</div>
                <div></div>
                <div style="font-size:.6rem;color:#94A3B8;text-align:right">Total</div>
                <div style="font-size:.6rem;color:#10B981;text-align:right">This Wk</div>
                <div style="font-size:.6rem;color:#6366F1;text-align:right">This Mo</div>
              </div>
              ${esoRankRows}` : barRowsHTML(esoHubs, null, esoTotal, 12)}
          </div>
        </div>
      </div>

      <!-- ROW 2: Device Types | Price & Payment | ID & Registration -->
      <div class="three-col" style="margin-top:12px">
        <div class="col-section">
          <div class="col-hdr indigo-hdr">DEVICE TYPES REQUESTED</div>
          <div class="col-body">
            ${Object.keys(deviceTypes).length
              ? Object.entries(deviceTypes).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([device,count],i) => {
                  const w     = Math.min(count/deviceTotal*100,100).toFixed(1);
                  const pct   = (count/deviceTotal*100).toFixed(1);
                  const color = DEVICE_COLORS[device] || PALETTE[i % PALETTE.length];
                  const esoD  = deviceByEso[device] || fallbackDeviceEso();
                  const esoT  = Object.values(esoD).reduce((a,b)=>a+b,0) || 1;
                  return `<div class="device-expand-row" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
                    <div class="bar-row">
                      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
                      <span class="bar-name" title="${device}">${device}</span>
                      <span class="bar-stat">${count.toLocaleString()}&ensp;${pct}%</span>
                      <span class="drill-arrow">&#9658;</span>
                    </div>
                  </div>
                  <div class="device-drill-panel">
                    <div class="drill-label">By ESO / Hub</div>
                    ${Object.keys(esoD).length ? barRowsHTML(esoD, null, esoT, 8) : '<div class="no-data-note">No ESO breakdown available</div>'}
                  </div>`;
                }).join('')
              : '<div class="no-data-note">No device type data</div>'}
          </div>
        </div>
        <div class="col-section">
          <div class="col-hdr orange-hdr">PRICE &amp; PAYMENT</div>
          <div class="col-body">
            <div class="sub-hdr orange-txt">PRICE RANGE (UGX)</div>
            ${Object.keys(priceBands).length
              ? barRowsHTML(priceBands, PRICE_COLORS, priceTotal, 6)
              : '<div class="no-data-note">No price data</div>'}
            <div class="sub-hdr orange-txt" style="margin-top:10px">PAYMENT PERIOD PREFERENCE</div>
            ${Object.keys(paymentDuration).length
              ? barRowsHTML(paymentDuration, PAY_COLORS, payTotal, 6)
              : '<div class="no-data-note">No payment period data</div>'}
          </div>
        </div>
        <div class="col-section">
          <div class="col-hdr green-hdr">ID &amp; REGISTRATION</div>
          <div class="col-body">
            <div class="sub-hdr green-txt">ID TYPE</div>
            ${Object.keys(idTypes).length
              ? barRowsHTML(idTypes, null, idTotal, 5)
              : '<div class="no-data-note">No ID type data</div>'}
            <div class="sub-hdr green-txt" style="margin-top:8px">REGISTRATION BODY</div>
            ${Object.keys(regBody).length
              ? barRowsHTML(regBody, null, regBodyTotal, 5)
              : '<div class="no-data-note">No registration data</div>'}
            <div class="sub-hdr green-txt" style="margin-top:8px">DISABILITY STATUS</div>
            ${barRowsHTML({'With Disability': withDis, 'Without': total - withDis},
                {'With Disability':'#EF4444','Without':'#10B981'}, total, 2)}
            ${Object.keys(disTypes).length
              ? `<div class="sub-hdr green-txt" style="margin-top:6px">DISABILITY TYPES</div>
                 ${barRowsHTML(disTypes, null, withDis || 1, 6)}`
              : ''}
            <div class="sub-hdr green-txt" style="margin-top:8px">SIM REGISTERED IN OWN NAME</div>
            ${Object.keys(simReg).length
              ? barRowsHTML(simReg, {'Yes':'#10B981','No':'#EF4444'}, simRegTotal, 3)
              : '<div class="no-data-note">No SIM registration data</div>'}
          </div>
        </div>
      </div>

      <!-- ROW 3: Top ESOs This Week | Top ESOs Last Week | Device Weekly Breakdown -->
      <div class="three-col" style="margin-top:12px">
        <div class="col-section">
          <div class="col-hdr indigo-hdr">TOP ESOs — THIS WEEK</div>
          <div class="col-body">
            ${topWkRows}
          </div>
        </div>
        <div class="col-section">
          <div class="col-hdr purple-hdr">TOP ESOs — LAST WEEK</div>
          <div class="col-body">
            ${topLwkRows}
          </div>
        </div>
        <div class="col-section">
          <div class="col-hdr orange-hdr">DEVICE TYPE ACTIVITY</div>
          <div class="col-body">
            <div class="dev-weekly-row" style="margin-bottom:6px">
              <div style="font-size:.6rem;color:#94A3B8;font-weight:700">Device</div>
              <div></div>
              <div style="font-size:.6rem;color:#94A3B8;text-align:right">Total</div>
              <div style="font-size:.6rem;color:#10B981;text-align:right">Wk</div>
              <div style="font-size:.6rem;color:#6366F1;text-align:right">Mo</div>
            </div>
            ${devWeeklyRows}
          </div>
        </div>
      </div>`;
  }

  /* ═══════════════════════════════════════════════════════════════
     HTML BUILDERS — SEGMENTATION / GROWTH PLANS (existing)
  ═══════════════════════════════════════════════════════════════ */
  function buildSegmentationHTML(p, pid) {
    const total      = p.stats.total;
    const femalePct  = (p.female_pct != null) ? p.female_pct.toFixed(1)
                       : (p.gender && p.gender['Female'] ? (p.gender['Female'] / total * 100).toFixed(1) : '0');
    const malePct    = (100 - parseFloat(femalePct)).toFixed(1);
    const youthPct   = (p.youth_pct  != null) ? p.youth_pct.toFixed(1)  : '0';
    const ruralPct   = (p.rural_pct  != null) ? p.rural_pct.toFixed(1)  : '0';
    const avgRev     = p.avg_revenue_str || (p.revenue && p.revenue.mean > 0 ? 'UGX ' + fmt(p.revenue.mean) : '—');
    const mainSector = p.main_sector || (Object.entries(p.sectors || {}).sort((a,b)=>b[1]-a[1])[0]||[,'All'])[0];
    const hasGroups  = p.groups && Object.keys(p.groups).length > 0;
    const hasPwd     = (p.ursb || 0) + (p.pwd || 0) + (p.refugees || 0) > 0;

    const midSection2 = hasGroups
      ? `<div class="sub-hdr orange-txt" style="margin-top:10px">GROUPS &amp; COLLECTIVES (${p.collectives_total || 0} total)</div>
         ${barRowsHTML(p.groups, null, total, 8)}`
      : (p.employment_status && Object.keys(p.employment_status).length > 0
          ? `<div class="sub-hdr orange-txt" style="margin-top:10px">EMPLOYMENT STATUS</div>
             ${barRowsHTML(p.employment_status, null, total, 6)}`
          : '');

    const footerHTML = hasPwd
      ? `<div class="section-footer">
           <span><strong>${p.ursb || 0}</strong>URSB Reg.</span>
           <span><strong>${p.pwd  || 0}</strong>PWD Founders</span>
           <span><strong>${p.refugees || 0}</strong>Refugees</span>
           <span><strong>${avgRev}</strong>Avg Rev UGX</span>
         </div>`
      : `<div class="section-footer" style="grid-template-columns:1fr">
           <span><strong>${avgRev}</strong>Avg Revenue UGX</span>
         </div>`;

    return `
      <div class="port-header">
        <div class="port-bar-strip"><div class="port-bar-orange"></div><div class="port-bar-blue"></div></div>
        <div class="port-title-area">
          <div class="port-title">${p.name}</div>
          <div class="port-filename">${p.filename}</div>
        </div>
      </div>

      <div class="kpi-strip-7">
        ${kpiBox(fmt(total),           'Total Submissions', 'ko')}
        ${kpiBox(p.pwd      || 0,      'PWD Founders',      'kb')}
        ${kpiBox(p.refugees || 0,      'Refugee Founders',  'kr')}
        ${kpiBox(femalePct  + '%',     'Female Founders',   'kp')}
        ${kpiBox(youthPct   + '%',     'Youth (18–35)',      'kg')}
        ${kpiBox(ruralPct   + '%',     'Rural Location',    'kt')}
        ${kpiBox(fmt(p.fte),           'FTE Workers',       'ka')}
      </div>

      <div class="three-col">
        <div class="col-section">
          <div class="col-hdr green-hdr">SECTOR &amp; SUBSECTOR BREAKDOWN</div>
          <div class="col-body">

  function buildOverviewHTML(portfolios) {
    const byType = type => portfolios.filter(p => p.type === type);
    const totalOf = list => list.reduce((s, p) => s + (p.stats?.total || 0), 0);
    const sumObj = objects => objects.reduce((acc, obj) => {
      Object.entries(obj || {}).forEach(([k, v]) => {
        const val = (v && typeof v === 'object') ? (v.total || 0) : v;
        if (Number(val) > 0) acc[k] = (acc[k] || 0) + Number(val);
      });
      return acc;
    }, {});
    const topEntries = (obj, n = 5) => Object.entries(obj || {})
      .filter(([, v]) => Number(v) > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, n);
    const pct = (num, den) => den > 0 ? (num / den * 100).toFixed(1) + '%' : '0.0%';
    const labelClean = label => String(label || '')
      .replace(/_/g, ' ')
      .replace(/\s+/g, ' ')
      .replace(/\b\w/g, m => m.toUpperCase());
    const listRows = (entries, total, color = '#2563EB') => entries.length
      ? `<div class="snapshot-list">${entries.map(([label, count]) => `
          <div class="snapshot-row">
            <span title="${label}">${labelClean(label)}</span>
            <div class="mini-track"><div class="mini-fill" style="width:${Math.min(count / Math.max(total, 1) * 100, 100).toFixed(1)}%;background:${color}"></div></div>
            <strong>${fmt(count)}</strong>
          </div>`).join('')}</div>`
      : '<div class="no-data-note">No data available</div>';

    const devices = byType('devices');
    const platforms = byType('platforms');
    const credit = byType('digital_credit');

    const totalDevices = totalOf(devices);
    const totalPlatformUsers = totalOf(platforms);
    const totalCreditUsers = credit.reduce((s, p) => s + (p.credit_demand || p.stats?.total || (p.eso_credit || []).reduce((x, e) => x + (e.demand || e.businesses || e.eligible || 0), 0)), 0);
    const deviceTypes = sumObj(devices.map(p => p.device_types || {}));
    const regions = sumObj(devices.map(p => p.districts || {}));
    const platformTotals = platforms.reduce((acc, p) => {
      Object.entries(p.by_platform || {}).forEach(([name, data]) => acc[name] = (acc[name] || 0) + (data.total || 0));
      return acc;
    }, {});
    const platformAdoption = platformTotals;
    const creditProviders = credit.reduce((acc, p) => {
      (p.eso_credit || []).forEach(e => {
        (e.breakdown || []).forEach(b => acc[b.type] = (acc[b.type] || 0) + (b.count || 0));
        if (e.businesses) acc[e.eso || 'Digital Credit'] = (acc[e.eso || 'Digital Credit'] || 0) + e.businesses;
      });
      return acc;
    }, {});
    const maxFunnel = Math.max(totalDevices, 1);
    const funnel = [['Device', totalDevices], ['Platform', totalPlatformUsers], ['Credit', totalCreditUsers]];
    const topRegion = topEntries(regions, 1)[0] || ['No region data', 0];
    const topPlatform = topEntries(platformTotals, 1)[0] || ['No platform data', 0];

    return `
      <div class="section-hdr">
        <h2>Programme Landing Page</h2>
        <span class="type-badge badge-all">${portfolios.length} datasets</span>
      </div>

      <div class="landing-grid three metric-grid">
        ${metric(fmt(totalDevices), 'Total Devices Financed', 'Devices distributed', 'orange')}
        ${metric(fmt(totalPlatformUsers), 'Platform Users', `${Object.keys(platformTotals).length} platforms`, 'purple')}
        ${metric(fmt(totalCreditUsers), 'Digital Credit Demand', totalCreditUsers ? 'Demand/readiness signal' : 'No credit demand recorded', 'teal')}
      </div>

      <div class="landing-card" style="margin-bottom:12px">
        <h3>Transformation Funnel</h3>
        <div class="funnel">
          ${funnel.map(([label, value]) => `
            <div class="funnel-step">
              <span class="funnel-label">${label}</span>
              <span class="funnel-value">${fmt(value)}</span>
              <span class="funnel-rate">${pct(value, maxFunnel)} of EOI base</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="landing-grid three">
        <div class="landing-card">
          <h3>Platform Adoption Snapshot</h3>
          ${listRows(topEntries(platformAdoption, 5), Math.max(...Object.values(platformAdoption), 1), '#7C3AED')}
        </div>
        <div class="landing-card">
          <h3>Digital Credit Snapshot</h3>
          ${listRows(topEntries(creditProviders, 5), Math.max(...Object.values(creditProviders), 1), '#0F766E')}
        </div>
        <div class="landing-card">
          <h3>Geographic Performance</h3>
          ${listRows(topEntries(regions, 8), Object.values(regions).reduce((a,b)=>a+b,0), '#EA580C')}
        </div>
      </div>

      <div class="landing-grid two">
        <div class="landing-card">
          <h3>Platform Adoption Over Time</h3>
          <div class="chart-wrap squat"><canvas id="_ov-platform-trend"></canvas></div>
        </div>
        <div class="landing-card">
          <h3>Device Financing Trends</h3>
          <div class="chart-wrap squat"><canvas id="_ov-device-trend"></canvas></div>
        </div>
      </div>

      <div class="landing-card">
        <h3>Alerts &amp; Insights</h3>
        <div class="insight-list">
          <div class="insight good">${topPlatform[0]} is the strongest platform with ${fmt(topPlatform[1])} active users.</div>
          <div class="insight info">${topRegion[0]} leads geographic distribution with ${fmt(topRegion[1])} device applications.</div>
          <div class="insight info">Tracking real-time outcomes across Devices, Platforms, and Digital Credit portfolios.</div>
        </div>
      </div>
    `;
  }

  function buildIntelligenceHTML(portfolios) {
    const active = portfolios.filter(p => p.type !== 'yiw');
    const byType = type => active.filter(p => p.type === type);
    const totalOf = list => list.reduce((s, p) => s + (p.stats?.total || 0), 0);
    const sumObj = objects => objects.reduce((acc, obj) => {
      Object.entries(obj || {}).forEach(([k, v]) => {
        const val = Number(v && typeof v === 'object' ? (v.total || 0) : v) || 0;
        if (val) acc[k] = (acc[k] || 0) + val;
      });
      return acc;
    }, {});
    const topEntries = (obj, n = 8) => Object.entries(obj || {}).sort((a, b) => b[1] - a[1]).slice(0, n);
    const pctText = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '0.0%';
    const clean = s => String(s || 'Unknown').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
    const metric = (value, label, note, color) => `
      <div class="metric-card ${color || 'blue'}">
        <span class="metric-value">${value}</span>
        <span class="metric-label">${label}</span>
        ${note ? `<span class="metric-note">${note}</span>` : ''}
      </div>`;
    const insight = (label, value, note, tone = 'info') => `
      <div class="insight ${tone}">
        <strong style="display:block;color:#0F172A;margin-bottom:2px">${label}</strong>
        <span style="font-size:.9rem;font-weight:800;color:#1E293B">${value}</span>
        <span style="display:block;margin-top:2px">${note}</span>
      </div>`;
    const rows = (entries, total, color = '#2563EB') => entries.length
      ? `<div class="snapshot-list">${entries.map(([label, count]) => `
          <div class="snapshot-row">
            <span title="${clean(label)}">${clean(label)}</span>
            <div class="mini-track"><div class="mini-fill" style="width:${Math.min(count / Math.max(total, 1) * 100, 100).toFixed(1)}%;background:${color}"></div></div>
            <strong>${fmt(count)}</strong>
          </div>`).join('')}</div>`
      : '<div class="no-data-note">No data available</div>';

    const eoi = byType('eoi');
    const needs = byType('buz_needs');
    const devices = byType('devices');
    const platforms = byType('platforms');
    const credit = byType('digital_credit');
    const totalEoi = totalOf(eoi);
    const totalNeeds = totalOf(needs);
    const totalDevices = totalOf(devices);
    const totalPlatforms = totalOf(platforms);
    const totalCredit = credit.reduce((s, p) => s + (p.credit_demand || p.stats?.total || 0), 0);
    const creditReady = credit.reduce((s, p) => s + (p.credit_ready || 0), 0);
    const creditFollowup = credit.reduce((s, p) => s + (p.credit_followup || 0), 0);
    const creditDenied = credit.reduce((s, p) => s + (p.denied_loan_count || 0), 0);
    const creditRequested = credit.reduce((s, p) => s + (p.credit_amount_stats?.total_requested_ugx || 0), 0);
    const creditAvgRequest = credit.reduce((s, p) => s + (p.credit_amount_stats?.avg_requested_ugx || 0), 0);
    const creditCrossref = credit.reduce((acc, p) => {
      const x = p.eoi_credit_crossref || {};
      acc.checked += Number(x.credit_records_checked || 0);
      acc.matched += Number(x.matched_total || 0);
      acc.phone += Number(x.matched_by_phone || 0);
      acc.email += Number(x.matched_by_email || 0);
      acc.business += Number(x.matched_by_business_name || 0);
      acc.nationalId += Number(x.matched_with_national_id || 0);
      acc.eoiRegistration += Number(x.matched_with_eoi_registration || 0);
      acc.tin += Number(x.matched_with_tin || 0);
      acc.nssf += Number(x.matched_with_nssf || 0);
      acc.hasPhoneEmail = acc.hasPhoneEmail || !!x.business_needs_phone_email_available;
      acc.note = x.match_note || acc.note;
      return acc;
    }, { checked: 0, matched: 0, phone: 0, email: 0, business: 0, nationalId: 0, eoiRegistration: 0, tin: 0, nssf: 0, hasPhoneEmail: false, note: '' });
    const creditChecklist = {};
    credit.forEach(p => {
      Object.entries(p.true_readiness_checklist || {}).forEach(([key, item]) => {
        creditChecklist[key] = creditChecklist[key] || { count: 0, denominator: 0, available: false, source: item.source || '' };
        creditChecklist[key].count += Number(item.count || 0);
        creditChecklist[key].denominator += Number(item.denominator || 0);
        creditChecklist[key].available = creditChecklist[key].available || !!item.available;
        creditChecklist[key].source = item.source || creditChecklist[key].source;
      });
    });
    const creditChecklistLabels = {
      business_registered: 'Business Registered',
      business_type_sector: 'Business Type / Sector',
      repay_confidence: 'Can Repay',
      amount_needed: 'Amount Needed',
      owner_national_id: 'Owner National ID',
      eoi_business_registration: 'EOI Registration',
      eoi_tin: 'EOI TIN',
      eoi_nssf: 'EOI NSSF',
      phone_registered_in_owner_name: 'Phone in Owner Name',
      actual_provider_application: 'Provider Application',
      approved_or_disbursed: 'Approved / Disbursed',
      repayment_history: 'Repayment History',
    };
    const creditChecklistRows = Object.entries(creditChecklist).map(([key, item]) => {
      const pct = item.denominator ? (item.count / item.denominator * 100).toFixed(1) + '%' : '0.0%';
      return [creditChecklistLabels[key] || clean(key), item.available ? item.count : 0, item.available ? `${fmt(item.count)} (${pct})` : 'Missing / not linked'];
    });
    const creditReadinessObj = {
      'Screening ready': creditReady,
      'Needs follow-up': creditFollowup,
      'Not ready yet': Math.max(totalCredit - creditReady - creditFollowup, 0),
    };
    const creditCrossrefObj = {
      'Matched to EOI': creditCrossref.matched,
      'National ID matched': creditCrossref.nationalId,
      'EOI registration matched': creditCrossref.eoiRegistration,
      'TIN matched': creditCrossref.tin,
      'NSSF matched': creditCrossref.nssf,
    };

    const quality = {};
    active.forEach(p => {
      const dq = p.data_quality || {};
      Object.entries(dq).forEach(([k, v]) => quality[k] = (quality[k] || 0) + (Number(v) || 0));
      const sample = (p.raw_records || [])[0] || {};
      if (!p.raw_records || !p.raw_records.length) quality.datasets_without_raw_records = (quality.datasets_without_raw_records || 0) + 1;
      if (p.raw_records && p.raw_records.length && !('d' in sample)) quality.datasets_without_dates = (quality.datasets_without_dates || 0) + 1;
      if (p.field_availability?.approval_funnel === false) quality.datasets_without_approval_fields = (quality.datasets_without_approval_fields || 0) + 1;
      if (p.field_availability?.demographics === false) quality.datasets_without_demographics = (quality.datasets_without_demographics || 0) + 1;
    });
    const qualityTotal = Object.values(quality).reduce((a, b) => a + b, 0);
    const duplicateSignals = (quality.duplicate_phone_numbers || 0) + (quality.duplicate_founder_phones || 0);
    const districtTotals = sumObj(active.map(p => p.districts || {}));

    const esoMap = {};
    active.filter(p => p.eso).forEach(p => {
      const eso = p.eso;
      esoMap[eso] = esoMap[eso] || { eoi: 0, buz_needs: 0, devices: 0, platforms: 0, digital_credit: 0, quality: 0 };
      esoMap[eso][p.type] = (esoMap[eso][p.type] || 0) + (p.stats?.total || 0);
      esoMap[eso].quality += Object.values(p.data_quality || {}).reduce((a, b) => a + (Number(b) || 0), 0);
    });
    credit.forEach(p => {
      (p.eso_credit || []).forEach(row => {
        const eso = row.eso || 'Unknown';
        esoMap[eso] = esoMap[eso] || { eoi: 0, buz_needs: 0, devices: 0, platforms: 0, digital_credit: 0, quality: 0 };
        esoMap[eso].digital_credit += Number(row.demand || row.businesses || 0);
      });
    });
    const esoRows = Object.entries(esoMap).sort((a, b) => (b[1].eoi + b[1].devices + b[1].buz_needs) - (a[1].eoi + a[1].devices + a[1].buz_needs)).slice(0, 12)
      .map(([eso, d]) => `<tr>
        <td>${eso}</td>
        <td>${fmt(d.eoi || 0)}</td>
        <td>${fmt(d.buz_needs || 0)}</td>
        <td>${fmt(d.devices || 0)}</td>
        <td>${fmt(d.platforms || 0)}</td>
        <td>${fmt(d.digital_credit || 0)}</td>
        <td>${fmt(d.quality || 0)}</td>
      </tr>`).join('');

    const conversionRows = [
      ['EOI to Business Needs', totalEoi, totalNeeds, 'Approximate only: forms are not linked by stable person/business ID.'],
      ['Business Needs to Devices', totalNeeds, totalDevices, 'Approximate only: no shared unique applicant ID across forms.'],
      ['Devices to Platforms', totalDevices, totalPlatforms, 'Approximate only: platform data is aggregate/onboarding-oriented.'],
      ['Business Needs to Credit Demand', totalNeeds, totalCredit, 'Credit is demand/readiness, not approved/disbursed outcomes.'],
      ['Credit Demand to Screening Ready', totalCredit, creditReady, 'Screening readiness proxy; strict approval readiness still needs linked ID/provider data.'],
    ];
    const alertItems = [
      duplicateSignals ? insight('Duplicate Signals', fmt(duplicateSignals), 'Duplicate phone indicators found across EOI and Devices quality checks.', 'warn') : insight('Duplicate Signals', '0', 'No duplicate phone signals found in quality metrics.', 'good'),
      quality.datasets_without_raw_records ? insight('Raw Record Gaps', fmt(quality.datasets_without_raw_records), 'Some datasets do not expose raw records for detailed quality checks.', 'warn') : insight('Raw Record Coverage', 'Available', 'All active datasets expose some raw record detail.', 'good'),
      totalCredit === 0 ? insight('Credit Demand Gap', 'No credit demand recorded', 'Digital Credit has no demand records in current source data.', 'warn') : insight('Credit Demand Signal', fmt(totalCredit), 'Credit demand is available from Business Needs.', 'good'),
      creditCrossref.checked ? insight('Credit Cross-Reference', `${fmt(creditCrossref.matched)} / ${fmt(creditCrossref.checked)}`, creditCrossref.hasPhoneEmail ? 'Business Needs phone/email matching is available.' : 'Business Needs has no phone/email, so matches rely on normalized business name.', creditCrossref.hasPhoneEmail ? 'good' : 'warn') : '',
      credit.find(p => p.field_availability?.provider === false) ? insight('Credit Outcome Fields', 'Missing provider/disbursement/repayment', 'Credit page is truthful demand/readiness until provider outcome data is added.', 'warn') : '',
      quality.datasets_without_approval_fields ? insight('Approval Funnel Missing', fmt(quality.datasets_without_approval_fields), 'Some forms do not have eligibility/approval/disbursement/rejection fields.', 'warn') : '',
      topEntries(districtTotals, 1)[0] ? insight('Highest Geography Signal', topEntries(districtTotals, 1)[0][0], `${fmt(topEntries(districtTotals, 1)[0][1])} records`, 'info') : '',
    ].join('');

    return `
      <div class="section-hdr">
        <h2>Portfolio Analysis Center</h2>
        <span class="type-badge badge-all">${active.length} active datasets</span>
      </div>

      <div class="landing-grid three metric-grid">
        ${metric(fmt(qualityTotal), 'Quality Signals', 'Missing, duplicate, and unavailable-field counts', 'orange')}
        ${metric(fmt(Object.keys(esoMap).length), 'ESO 360 Profiles', 'Partners with linked portfolio records', 'blue')}
        ${metric(fmt(duplicateSignals), 'Duplicate Signals', 'Phone duplication indicators', duplicateSignals ? 'red' : 'green')}
        ${metric(fmt(Object.keys(districtTotals).length), 'Geographies', 'District/location labels found', 'teal')}
        ${metric(fmt(totalEoi), 'EOI Base', 'Entry-point records', 'purple')}
        ${metric(fmt(totalDevices), 'Device Demand', 'Device financing records', 'green')}
      </div>

      <div class="landing-grid two">
        <div class="landing-card">
          <h3>App-Wide Data Quality</h3>
          ${rows(topEntries(quality, 10), Math.max(...Object.values(quality), 1), '#EA580C')}
        </div>
        <div class="landing-card">
          <h3>Alerts &amp; Insights Center</h3>
          <div class="insight-list">${alertItems}</div>
        </div>
      </div>

      <div class="landing-card" style="margin-bottom:12px">
        <h3>Cross-Portfolio Conversion Signals</h3>
        <div class="funnel">
          ${conversionRows.map(([label, base, next, note]) => `
            <div class="funnel-step">
              <span class="funnel-label">${label}</span>
              <span class="funnel-value">${pctText(next, base)}</span>
              <span class="funnel-rate">${fmt(next)} of ${fmt(base)} records</span>
              <span class="funnel-rate">${note}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="section-hdr">
        <h2>Digital Credit Intelligence</h2>
        <span class="type-badge badge-digital_credit">Demand · readiness · cross-reference</span>
      </div>
      <div class="landing-grid three metric-grid">
        ${metric(fmt(totalCredit), 'Credit Demand', 'From Business Needs finance signals', 'teal')}
        ${metric(fmt(creditReady), 'Screening Ready', `${pctText(creditReady, totalCredit)} of demand`, 'green')}
        ${metric(fmt(creditFollowup), 'Needs Follow-Up', `${pctText(creditFollowup, totalCredit)} of demand`, 'orange')}
        ${metric(creditAvgRequest ? 'UGX ' + fmt(creditAvgRequest) : 'Missing', 'Avg Amount Needed', creditRequested ? `UGX ${fmt(creditRequested)} total requested` : 'Amount field missing', creditAvgRequest ? 'purple' : 'red')}
        ${metric(fmt(creditDenied), 'Denied Before', 'Prior denied-loan experience', creditDenied ? 'red' : 'blue')}
        ${metric(`${fmt(creditCrossref.matched)} / ${fmt(creditCrossref.checked)}`, 'EOI Cross-Ref Match', creditCrossref.hasPhoneEmail ? 'Phone/email matching available' : 'Phone/email missing; fallback used', creditCrossref.hasPhoneEmail ? 'green' : 'red')}
      </div>

      <div class="landing-grid three">
        <div class="landing-card">
          <h3>Credit Readiness</h3>
          ${rows(topEntries(creditReadinessObj, 3), Math.max(totalCredit, 1), '#0F766E')}

      insight('Female Founders %', (inclusion.female_founders_pct || 0) + '%', 'Needs founder gender linked to credit demand.', inclusion.female_founders_pct ? 'good' : 'info'),
      insight('Refugee Credit Demand', fmt(inclusion.refugees || 0), 'Needs refugee flag in credit-demand records.', inclusion.refugees ? 'good' : 'info'),
    ].join('');

    const scoreRows = esoCredit
      .slice()
      .sort((a, b) => (b.demand || 0) - (a.demand || 0))
      .map((e, i) => {
        const demand = e.demand || 0;
        const readyRate = demand ? Math.round((e.ready || 0) / demand * 100) : 0;
        const pwdRate = demand ? Math.round((e.pwd_demand || 0) / demand * 100) : 0;
        const status = readyRate >= 65 ? 'Strong' : readyRate >= 45 ? 'Follow-Up' : 'Risk';
        const statusCls = readyRate >= 65 ? 'good' : readyRate >= 45 ? 'info' : 'warn';
        return `<tr>
          <td class="td-main">${e.eso}</td>
          <td>${fmt(demand)}</td>
          <td>${fmt(e.ready || 0)} (${readyRate}%)</td>
          <td>${fmt(e.followup || 0)}</td>
          <td>${fmt(e.pwd_demand || 0)} (${pwdRate}%)</td>
          <td>${fmt(e.denied || 0)}</td>
          <td>${fmt(e.businesses || 0)}</td>
          <td>UGX ${fmt(e.amount_ugx || e.disbursed_ugx || 0)}</td>
          <td><span class="insight ${statusCls}" style="display:inline-flex;padding:3px 8px;margin:0">${status}</span></td>
        </tr>`;
      }).join('');
    const topDemandEso = esoCredit.slice().sort((a, b) => (b.demand || 0) - (a.demand || 0))[0];
    const topApprovalEso = esoCredit.slice().sort((a, b) => pct(b.businesses || 0, b.demand || 0) - pct(a.businesses || 0, a.demand || 0))[0];
    const topDisbursementEso = esoCredit.slice().sort((a, b) => Number(b.amount_ugx || b.disbursed_ugx || 0) - Number(a.amount_ugx || a.disbursed_ugx || 0))[0];

    /* ── v3 dark-theme helpers ── */
    const fmtAmt = v => {
      v = Number(v) || 0;
      return v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(0) + 'K' : fmt(v);
    };
    const dash = (v, fallback = '—') => (v === null || v === undefined || v === '') ? fallback : v;
    const cvBars = (obj, total, topN = 6, colorMap = null) => {
      const entries = Object.entries(obj || {}).filter(([, v]) => Number(v) > 0).sort((a, b) => b[1] - a[1]).slice(0, topN);
      if (!entries.length) return '<div class="empty"><div class="empty-icon">—</div>No data captured for this yet.</div>';
      const denom = total || entries.reduce((s, [, v]) => s + Number(v), 0) || 1;
      return entries.map(([k, v], i) => {
        const color = (colorMap && colorMap[k]) || CREDIT_COLORS[i % CREDIT_COLORS.length];
        const w = Math.min(Number(v) / denom * 100, 100).toFixed(1);
        return `<div class="bar-row">
          <div class="bar-top">
            <div class="bar-name"><div class="bar-dot" style="background:${color}"></div>${k}</div>
            <div class="bar-stats"><strong>${fmt(v)}</strong>&nbsp;(${pct(v, denom)}%)</div>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
        </div>`;
      }).join('');
    };
    const districtBarsHTML = (obj, total, topN = 8) => {
      const entries = Object.entries(obj || {}).filter(([, v]) => Number(v) > 0).sort((a, b) => b[1] - a[1]).slice(0, topN);
      if (!entries.length) return '<div class="empty"><div class="empty-icon">—</div>No data captured for this yet.</div>';
      const denom = total || entries.reduce((s, [, v]) => s + Number(v), 0) || 1;
      const sectorMix = cvBars(demandBySector, sumVals(demandBySector), 6);
      return entries.map(([k, v], i) => {
        const color = CREDIT_COLORS[i % CREDIT_COLORS.length];
        const w = Math.min(Number(v) / denom * 100, 100).toFixed(1);
        return `<details class="dist-row">
          <summary class="bar-row">
            <div class="bar-top">
              <div class="bar-name"><div class="bar-dot" style="background:${color}"></div>${k}</div>
              <div class="bar-stats"><strong>${fmt(v)}</strong>&nbsp;(${pct(v, denom)}%)</div>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
          </summary>
          <div class="dist-detail">
            <div class="dist-detail-label">Overall sector mix (all districts)</div>
            ${sectorMix}
          </div>
        </details>`;
      }).join('');
    };
    const idvRow = (icon, dimVar, name, desc, value, valVar) => `<div class="idv-row">
      <div class="idv-left"><div><div class="idv-name">${name}</div><div class="idv-desc">${desc}</div></div></div>
      <div class="idv-val" style="color:var(${valVar})">${value}</div>
    </div>`;
    const repayRow = (icon, dimVar, name, desc, value, colorVar) => `<div class="repay-row">
      <div class="repay-left"><div><div class="repay-name">${name}</div><div class="repay-desc">${desc}</div></div></div>
      <div class="repay-val" style="color:var(${colorVar})">${value}</div>
    </div>`;
    const callout = (tone, label, text) => `<div class="callout callout-${tone}"><div class="callout-lbl">${label}</div><div class="callout-text">${text}</div></div>`;
    const parCard = (label, value, threshold) => {
      const num = Number(value) || 0;
      const safe = num <= threshold;
      return `<div class="par-card">
        <div class="par-label ${safe ? 'par-label-green' : 'par-label-red'}">${label}</div>
        <div class="par-val" style="color:var(${safe ? '--green' : '--red'})">${value}%</div>
        <div class="par-desc">Threshold: &gt;${threshold}%</div>
        <div class="par-bar" style="background:var(${safe ? '--green' : '--red'})"></div>
      </div>`;
    };

    const esoTotalDemand = esoCredit.reduce((s, e) => s + (e.demand || 0), 0) || 1;
    const esoBarsTop = esoCredit.slice().sort((a, b) => (b.demand || 0) - (a.demand || 0)).slice(0, 8).map((e, i) => {
      const color = CREDIT_COLORS[i % CREDIT_COLORS.length];
      const w = Math.min((e.demand || 0) / esoTotalDemand * 100, 100).toFixed(1);
      const readyPct = e.demand ? Math.round((e.ready || 0) / e.demand * 100) : 0;
      return `<div class="bar-row">
        <div class="bar-top">
          <div class="bar-name"><div class="bar-dot" style="background:${color}"></div>${e.eso}</div>
          <div class="bar-stats"><strong>${fmt(e.demand || 0)}</strong>&nbsp;demand · ${readyPct}% ready</div>
        </div>

    const readinessTotal = sumVals(readiness);
    const readinessOrder = [
      ['Ready for Screening', 'var(--green)'],
      ['Needs Follow-Up', 'var(--amber)'],
      ['Not Ready Yet', 'var(--red)'],

    let _acc = 0;
    const donutStops = readinessOrder.map(([k, color]) => {
      const v = Number(readiness[k] || 0);
      const slice = readinessTotal ? v / readinessTotal * 100 : 0;
      const from = _acc; _acc += slice;
      return `${color} ${from.toFixed(2)}% ${_acc.toFixed(2)}%`;
    }).join(', ');
    const donutLegend = readinessOrder.map(([k, color]) => {
      const v = Number(readiness[k] || 0);
      return `<div class="leg-row"><div class="leg-dot" style="background:${color}"></div><span class="leg-name">${k}</span><span class="leg-pct">${pct(v, readinessTotal)}%</span></div>`;

    const checklistRowsTbl = Object.entries(trueChecklist).map(([key, item]) => {
      const denom = Number(item.denominator || total || 1);

      return `<tr>
        <td class="td-main">${checklistLabel(key)}</td>

        <td>${p}%</td>
      </tr>`;
    }).join('');

    const esoMaxDemand = Math.max(...esoCredit.map(e => e.demand || 0), 1);
    const esoScoreRows = esoCredit.slice().sort((a, b) => (b.demand || 0) - (a.demand || 0)).map((e, i) => {
      const color = CREDIT_COLORS[i % CREDIT_COLORS.length];
      const demand = e.demand || 0;
      const readyPct = demand ? Math.round((e.ready || 0) / demand * 100) : 0;
      const status = readyPct >= 65 ? ['Strong', 'rag-g'] : readyPct >= 45 ? ['Follow-Up', 'rag-a'] : ['Needs Outreach', 'rag-r'];

        <div class="eso-name">${e.eso}</div>
        <div class="eso-bar-wrap"><div class="eso-bar-fill" style="width:${Math.min(demand / esoMaxDemand * 100, 100).toFixed(1)}%;background:${color}"></div></div>
        <div class="eso-stat"><strong>${fmt(demand)}</strong></div>

        <div class="eso-stat"><span class="rag ${status[1]}">${status[0]}</span></div>

    }).join('');

    const deniedLoanCount = Number(creditData.denied_loan_count || 0);

    return `<div class="cv3">
      <div class="hd">
        <div class="hd-left">
          <h1>Digital Credit — Demand &amp; Readiness</h1>
          <div class="sub">
            ${esoCredit.length} ESO Partners &nbsp;·&nbsp; Business Needs source &nbsp;·&nbsp; ${new Date().toLocaleDateString('en-UG', { month: 'long', year: 'numeric' })}
            <span class="badge">${fmt(total)} BUSINESSES SCREENED</span>
            <span class="badge badge-rose">INCLUSION TRACKED</span>
          </div>
        </div>
      </div>

      <div class="sec-label">Loan Book Overview</div>
      <div class="kpi-strip">

        <div class="kpi c-teal"><div class="kpi-lbl">Ready for Screening</div><div class="kpi-val teal">${fmt(ready)}</div><div class="kpi-sub">${total ? Math.round(ready / total * 100) : 0}% of demand</div></div>
        <div class="kpi c-amber"><div class="kpi-lbl">Needs Follow-Up</div><div class="kpi-val amber">${fmt(followup)}</div><div class="kpi-sub">flagged for outreach</div></div>
        <div class="kpi c-violet"><div class="kpi-lbl">Avg Amount Requested</div><div class="kpi-val violet">${fmtAmt(amountStats.avg_requested_ugx)}</div><div class="kpi-sub">UGX per business</div></div>
        <div class="kpi c-green"><div class="kpi-lbl">Total Requested</div><div class="kpi-val green">${fmtAmt(amountStats.total_requested_ugx)}</div><div class="kpi-sub">UGX across ${fmt(amountStats.count || 0)} records</div></div>
        <div class="kpi c-blue"><div class="kpi-lbl">ESO Partners</div><div class="kpi-val blue">${esoCredit.length}</div><div class="kpi-sub">delivering credit demand</div></div>
        <div class="kpi c-orange"><div class="kpi-lbl">Approved / Disbursed</div><div class="kpi-val orange">${(approved || disbursedCount) ? fmt(Math.max(approved, disbursedCount)) : '—'}</div><div class="kpi-sub">${availability.approval ? 'from provider data' : 'awaiting provider data'}</div></div>
      </div>

      <div class="inclusion-kpi-row">
        <div class="inclusion-kpi-label">Inclusion Metrics — Women · PWD · Refugees</div>
        <div class="kpi-strip-5">
          <div class="kpi c-rose"><div class="kpi-lbl">PWD Credit Demand</div><div class="kpi-val rose">${fmt(inclusion.pwd_demand || 0)}</div><div class="kpi-sub">of ${fmt(total)} businesses</div></div>
          <div class="kpi c-rose"><div class="kpi-lbl">Women-Led Businesses</div><div class="kpi-val rose">${dash(inclusion.women_led)}</div><div class="kpi-sub">needs gender field</div></div>
          <div class="kpi c-blue"><div class="kpi-lbl">Female Founders %</div><div class="kpi-val blue">${dash(inclusion.female_founders_pct !== null ? inclusion.female_founders_pct + '%' : null)}</div><div class="kpi-sub">lead founder is female</div></div>
          <div class="kpi c-lime"><div class="kpi-lbl">Refugee Borrowers</div><div class="kpi-val lime">${dash(inclusion.refugees)}</div><div class="kpi-sub">needs refugee flag</div></div>
          <div class="kpi c-gold"><div class="kpi-lbl">PWD Ready for Screening</div><div class="kpi-val gold">${dash(inclusion.pwd_ready)}</div><div class="kpi-sub">vs ${fmt(inclusion.pwd_demand || 0)} total PWD</div></div>
        </div>
      </div>

      <div class="sec-label">Demand Breakdown</div>
      <div class="g3">
        <div class="card">
          <div class="card-hd"><div class="card-title"><div class="card-title-dot" style="background:var(--cyan)"></div>By ESO Partner</div><span class="card-meta">demand &amp; ready %</span></div>
          <div class="card-body">${esoBarsTop}</div>
        </div>
        <div class="card">
          <div class="card-hd"><div class="card-title"><div class="card-title-dot" style="background:var(--violet)"></div>Readiness Mix</div><span class="card-meta">${fmt(readinessTotal)} total</span></div>
          <div class="card-body">
            <div class="donut-wrap">
              <div class="cv3-donut" style="background:conic-gradient(${donutStops})"><div class="cv3-donut-hole">${fmt(total)}</div></div>
              <div class="donut-legend">${donutLegend}</div>
            </div>
            <div class="callout callout-violet">
              <div class="callout-lbl">Screening Proxy</div>

            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-hd"><div class="card-title"><div class="card-title-dot" style="background:var(--amber)"></div>Demand by Sector</div><span class="card-meta">top sectors</span></div>
          <div class="card-body">${cvBars(demandBySector, sumVals(demandBySector), 6)}</div>
        </div>
      </div>

      <div class="sec-label">Portfolio Quality</div>
      <div class="par-grid">
        ${parCard('PAR 1 — 1 Day Overdue', par30, 5)}
        ${parCard('PAR 7 — 7 Days Overdue', par60, 8)}
        ${parCard('PAR 30 — 30 Days Overdue', par90, 10)}
      </div>
      <div class="g2">
        <div class="card">
          <div class="card-hd"><div class="card-title"><div class="card-title-dot" style="background:var(--green)"></div>Repayment Behaviour</div><span class="card-meta">needs provider/repayment data</span></div>
          <div class="card-body">
            ${repayRow('✅', '--green-dim', 'On-time repayment', 'paid by due date', repaymentRate ? repaymentRate + '%' : '—', '--green')}
            ${repayRow('🔴', '--red-dim', 'Default rate', 'non-performing', defaultRate ? defaultRate + '%' : '—', '--red')}
            ${repayRow('🔁', '--cyan-dim', 'Repeat borrowers', '2nd+ loan', repeatBorrowers ? fmt(repeatBorrowers) : '—', '--cyan')}
            ${repayRow('💰', '--violet-dim', 'Repeat borrowed value', 'UGX cumulative', repeatBorrowedValue ? 'UGX ' + fmtAmt(repeatBorrowedValue) : '—', '--violet')}
            <div class="callout callout-amber">
              <div class="callout-lbl">Status</div>
              <div class="callout-text">${availability.repayment ? 'Repayment data is connected.' : 'Repayment, PAR and disbursement figures activate once provider/loan-outcome records are linked to these credit-demand businesses.'}</div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-hd"><div class="card-title"><div class="card-title-dot" style="background:var(--blue)"></div>Self-Reported Repay Capacity</div><span class="card-meta">${fmt(sumVals(repayCapacity))} responses</span></div>
          <div class="card-body">${cvBars(repayCapacity, sumVals(repayCapacity), 5, { 'Yes': 'var(--green)', 'Not Sure': 'var(--amber)', 'No': 'var(--red)' })}</div>
        </div>
      </div>

      <div class="sec-label inclusion">Inclusion Deep Dive — Women · PWD · Refugees</div>
      <div class="g3">
        <div class="card inclusion-card">
          <div class="card-hd"><div class="card-title"><div class="card-title-dot" style="background:var(--rose)"></div>Women-Led Businesses</div><span class="card-meta" style="color:var(--rose)">gender equity</span></div>
          <div class="card-body">
            ${idvRow('👩‍💼', '--rose-dim', 'Women-led businesses', 'lead founder is female', dash(inclusion.women_led), '--rose')}
            ${idvRow('🎯', '--rose-dim', 'Ready for screening — women', 'vs overall readiness', dash(inclusion.women_ready), '--rose')}
            ${idvRow('📊', '--rose-dim', 'Female founders %', 'of total founders', dash(inclusion.female_founders_pct !== null ? inclusion.female_founders_pct + '%' : null), '--rose')}
            ${callout('rose', 'Why Track This', 'Women-led businesses often receive smaller loans even with equivalent collateral. This needs a gender/founder field linked to credit-demand records — currently not captured by Business Needs.')}
          </div>

        <div class="card pwd-card">
          <div class="card-hd"><div class="card-title"><div class="card-title-dot" style="background:var(--blue)"></div>PWD Borrowers</div><span class="card-meta" style="color:var(--blue)">disability inclusion</span></div>
          <div class="card-body">
            ${idvRow('♿', '--blue-dim', 'PWD credit demand', 'persons with disability', fmt(inclusion.pwd_demand || 0), '--blue')}
            ${idvRow('🎯', '--blue-dim', 'PWD ready for screening', `of ${fmt(inclusion.pwd_demand || 0)} PWD demand`, dash(inclusion.pwd_ready), '--blue')}
            ${idvRow('📊', '--blue-dim', 'Share of total demand', 'PWD as % of all demand', total ? pct(inclusion.pwd_demand || 0, total) + '%' : '—', '--blue')}
            ${callout('blue', 'Accessibility Signal', `PWD credit demand is captured (${total ? pct(inclusion.pwd_demand || 0, total) : 0}% of all demand). Linking provider and approval data will show which FSP channels are most accessible to PWD borrowers.`)}
          </div>

        <div class="card ref-card">

          <div class="card-body">

            <div style="margin-top:6px">
              ${idvRow('💵', '--teal-dim', 'Total requested', 'sum of all usable responses', 'UGX ' + fmtAmt(amountStats.total_requested_ugx), '--teal')}
              ${idvRow('📊', '--teal-dim', 'Median requested', 'typical request size', 'UGX ' + fmtAmt(amountStats.median_requested_ugx), '--teal')}
            </div>

        <div class="card">

          <div class="card-body">
            <div class="sub-bar-group"><h4>Loan Purpose</h4>${cvBars(loanPurpose, sumVals(loanPurpose), 5)}</div>
            <div class="sub-bar-group"><h4>Previous Credit Source</h4>${cvBars(priorSources, sumVals(priorSources), 5)}</div>

      <div class="sec-label">Readiness &amp; Compliance</div>
      <div class="g3">
        <div class="card" style="grid-column:span 2">
          <div class="card-hd"><div class="card-title"><div class="card-title-dot" style="background:var(--cyan)"></div>True Readiness Checklist</div><span class="card-meta">proxy vs. strict approval readiness</span></div>
          <div class="card-body">

          <div class="card-body">
            ${idvRow('🔎', '--gold-dim', 'Records checked', 'prepared for EOI matching', fmt(eoiCrossref.credit_records_checked || 0), '--gold')}
            ${idvRow('🔗', '--gold-dim', 'Matched to EOI', `${fmt(eoiCrossref.matched_by_business_name || 0)} by business name`, fmt(eoiCrossref.matched_total || 0), '--gold')}
            ${idvRow('🪪', '--gold-dim', 'Matched with National ID', 'from EOI founder ID upload', fmt(eoiCrossref.matched_with_national_id || 0), '--gold')}
            <div style="margin-top:10px">${cvBars({
              'National ID': eoiCrossref.matched_with_national_id || 0,

      <div class="sec-label">ESO Credit Performance Scorecard</div>
      <div class="card">
        <div class="card-hd"><div class="card-title"><div class="card-title-dot" style="background:var(--amber)"></div>ESO-Level Demand &amp; Readiness</div><span class="card-meta">${esoCredit.length} ESO partners</span></div>

  function buildOperationsHTML(p) {
    const activities = p.activities || [];
    const tickets = p.tickets || [];
    const events = p.events || [];
    const team = p.team || Array.from(new Set(activities.map(a => a.owner).filter(Boolean)));
    const totalHours = activities.reduce((s, a) => s + (Number(a.hours) || 0), 0);
    const doneActivities = activities.filter(a => String(a.status || '').toLowerCase() === 'done').length;
    const openTickets = tickets.filter(t => !/done|closed|resolved/i.test(t.status || '')).length;
    const nextEvent = events.slice().sort((a, b) => new Date(a.date) - new Date(b.date))[0];
    const ownerHours = team.map(owner => ({
      owner,
      hours: activities.filter(a => a.owner === owner).reduce((s, a) => s + (Number(a.hours) || 0), 0),
      tickets: tickets.filter(t => t.owner === owner && !/done|closed|resolved/i.test(t.status || '')).length,
    }));
    const maxHours = Math.max(...ownerHours.map(r => r.hours), 1);
    const statusColor = status => /done|closed|resolved/i.test(status || '') ? '#16A34A' : /progress/i.test(status || '') ? '#D97706' : '#2563EB';
    const priorityColor = priority => /high|urgent/i.test(priority || '') ? '#DC2626' : /medium/i.test(priority || '') ? '#D97706' : '#2563EB';

    const ownerRows = ownerHours.map(r => `
      <div class="target-row">
        <span class="target-label">${r.owner}</span>
        <span class="target-pct-badge" style="background:#DBEAFE;color:#1D4ED8">${r.tickets} open</span>
        <div class="target-track"><div class="target-fill" style="width:${Math.min(r.hours / maxHours * 100, 100).toFixed(1)}%;background:#14B8A6"></div></div>
        <span class="target-vals">${r.hours.toFixed(1)} hrs</span>
      </div>`).join('');

    const activityRows = activities.slice(0, 8).map(a => `
      <tr>
        <td>${a.date || ''}</td>
        <td class="td-main">${a.owner || ''}</td>
        <td>${a.stream || ''}</td>
        <td>${a.activity || ''}</td>
        <td>${Number(a.hours || 0).toFixed(1)}</td>
        <td><span class="target-pct-badge" style="background:${statusColor(a.status)}22;color:${statusColor(a.status)}">${a.status || 'Open'}</span></td>
      </tr>`).join('');

    const ticketRows = tickets.map(t => `
      <tr>
        <td class="td-main">${t.id || ''}</td>
        <td>${t.title || ''}</td>
        <td>${t.owner || ''}</td>
        <td><span class="target-pct-badge" style="background:${priorityColor(t.priority)}22;color:${priorityColor(t.priority)}">${t.priority || 'Normal'}</span></td>
        <td>${t.status || 'Open'}</td>
        <td>${t.due || ''}</td>
      </tr>`).join('');

    const eventRows = events.slice().sort((a, b) => new Date(a.date) - new Date(b.date)).map(e => `
      <div class="cohort-item">
        <div class="cohort-dot" style="background:#3B82F6"></div>
        <div style="flex:1;min-width:0">
          <div class="cohort-name">${e.title || ''}</div>
          <div class="cohort-meta">${e.date || ''} &nbsp;·&nbsp; ${e.owner || 'Team'}</div>
        </div>
        <span class="cohort-badge active">${e.type || 'Event'}</span>
      </div>`).join('');

    return `
      <div class="port-header">
        <div class="port-bar-strip"><div class="port-bar-orange"></div><div class="port-bar-blue"></div></div>
        <div class="port-title-area">
          <div class="port-title">Team Operations Tracker</div>
          <div class="port-filename">Daniel, Dorothy and Martha · Timesheets, issue tracker and calendar</div>
        </div>
      </div>

      <div class="kpi-strip-7">
        ${kpiBox(team.length, 'Team Members', 'kb')}
        ${kpiBox(activities.length, 'Activities', 'kg')}
        ${kpiBox(totalHours.toFixed(1), 'Logged Hours', 'kt')}
        ${kpiBox(openTickets, 'Open Tickets', 'kr')}
        ${kpiBox(doneActivities, 'Done Items', 'kp')}
        ${kpiBox(events.length, 'Events', 'ka')}
        ${kpiBox(nextEvent ? nextEvent.date : '-', 'Next Event', 'ko')}

      <div class="card" style="margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap">

        <button class="summary-toggle" onclick="downloadOpsTicketsCSV()">Download Ticket CSV</button>

      <div class="cg cg-21">

          <div class="col-hdr teal-hdr">TEAM WORKLOAD</div>

        </div>
        <div class="col-section">
