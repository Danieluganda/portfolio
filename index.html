<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Insights</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="data.js?v=20260605-devices-eso"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #F1F5F9; color: #1E293B; min-height: 100vh; }

    /* ─── Header ─── */
    .header {
      background: #0F172A;
      color: #F8FAFC;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 12px rgba(0,0,0,.45);
    }
    .header-left h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .3px; }
    .header-left .sub { font-size: .72rem; color: #94A3B8; margin-top: 3px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .pill {
      font-size: .7rem; font-weight: 700; padding: 4px 12px;
      border-radius: 20px; background: #1E40AF; color: #DBEAFE;
      letter-spacing: .3px;
    }
    .btn-refresh {
      font-size: .72rem; font-weight: 600; padding: 5px 12px;
      border-radius: 6px; border: 1px solid #334155; background: #1E293B;
      color: #94A3B8; cursor: pointer; transition: all .15s;
    }
    .btn-refresh:hover { border-color: #3B82F6; color: #BFDBFE; }

    /* ─── Tier 1: type tabs ─── */
    .type-tabs-bar {
      background: #1E293B;
      padding: 0 24px;
      display: flex;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .type-tab-btn {
      padding: 13px 22px;
      font-size: .84rem; font-weight: 600;
      color: #94A3B8; border: none; background: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
    }
    .type-tab-btn:hover { color: #E2E8F0; }
    .type-tab-btn.active { color: #F8FAFC; border-bottom-color: #3B82F6; font-weight: 700; }

    /* ─── Tier 2: portfolio sub-tabs ─── */
    .sub-tabs-bar {
      background: #fff;
      border-bottom: 2px solid #E2E8F0;
      padding: 0 24px;
      display: flex;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: thin;
      min-height: 42px;
    }
    .sub-tab-btn {
      padding: 10px 18px;
      font-size: .8rem; font-weight: 500;
      color: #64748B; border: none; background: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
      margin-bottom: -2px;
    }
    .sub-tab-btn:hover { color: #3B82F6; }
    .sub-tab-btn.active { color: #1D4ED8; border-bottom-color: #3B82F6; font-weight: 700; }

    /* ─── Content ─── */
    .content { max-width: 1440px; margin: 0 auto; padding: 28px 24px; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* ─── Section header ─── */
    .section-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .section-hdr h2 { font-size: 1.2rem; font-weight: 700; color: #0F172A; }
    .type-badge {
      font-size: .65rem; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: .5px;
    }
    .badge-seg   { background: #DBEAFE; color: #1D4ED8; }
    .badge-grow  { background: #D1FAE5; color: #065F46; }
    .badge-all   { background: #F3E8FF; color: #6B21A8; }

    /* ─── KPI Cards ─── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(152px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .kpi {
      background: #fff;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      border-left: 4px solid #CBD5E1;
    }
    .kpi.blue   { border-left-color: #3B82F6; }
    .kpi.green  { border-left-color: #10B981; }
    .kpi.amber  { border-left-color: #F59E0B; }
    .kpi.red    { border-left-color: #EF4444; }
    .kpi.violet { border-left-color: #8B5CF6; }
    .kpi.pink   { border-left-color: #EC4899; }
    .kpi.teal   { border-left-color: #14B8A6; }
    .kpi .lbl { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #64748B; }
    .kpi .val { font-size: 1.65rem; font-weight: 800; color: #0F172A; margin: 5px 0 3px; line-height: 1; }
    .kpi .hint { font-size: .7rem; color: #94A3B8; }

    /* ─── Chart Grid ─── */
    .cg { display: grid; gap: 18px; margin-bottom: 18px; }
    .cg-1   { grid-template-columns: 1fr; }
    .cg-2   { grid-template-columns: 1fr 1fr; }
    .cg-3   { grid-template-columns: 1fr 1fr 1fr; }
    .cg-21  { grid-template-columns: 2fr 1fr; }
    .cg-12  { grid-template-columns: 1fr 2fr; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .card h3 {
      font-size: .72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .6px;
      color: #64748B; margin-bottom: 16px;
    }
    .chart-wrap { position: relative; }
    .chart-wrap canvas { max-height: 300px; }
    .chart-wrap.tall  canvas { max-height: 380px; }
    .chart-wrap.squat canvas { max-height: 220px; }

    /* ─── Divider ─── */
    .divider { height: 1px; background: #E2E8F0; margin: 24px 0; }

    /* ─── No-data state ─── */
    .no-data {
      text-align: center; padding: 80px 24px;
      max-width: 520px; margin: 0 auto;
    }
    .no-data .icon { font-size: 3rem; margin-bottom: 16px; }
    .no-data h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
    .no-data p  { font-size: .9rem; color: #64748B; margin-bottom: 8px; line-height: 1.6; }
    .no-data code {
      display: inline-block;
      background: #F1F5F9; border: 1px solid #CBD5E1;
      padding: 4px 10px; border-radius: 6px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: .85rem; color: #1D4ED8;
    }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {
      .cg-2, .cg-3, .cg-21, .cg-12 { grid-template-columns: 1fr; }
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .kpi-row { grid-template-columns: 1fr; }
      .content { padding: 16px 12px; }
    }

    /* ─── Portfolio Page — Excel Style ─── */
    .port-header { background:#fff; border-radius:12px; overflow:hidden; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
    .port-bar-strip { display:flex; height:8px; }
    .port-bar-orange { width:33%; background:#F59E0B; }
    .port-bar-blue   { flex:1; background:#D1D5DB; }
    .port-title-area { padding:14px 20px 16px; }
    .port-title    { font-size:1.25rem; font-weight:800; color:#0F172A; }
    .port-filename { font-size:.72rem; color:#3B82F6; text-decoration:underline; margin-top:3px; }

    /* KPI strip — 7 boxes */
    .kpi-strip-7 { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-bottom:16px; }
    .kpi-box { background:#fff; border-radius:8px; padding:13px 10px 11px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.07); }
    .kpi-box .kv { font-size:1.55rem; font-weight:800; line-height:1; display:block; }
    .kpi-box .kl { font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:#64748B; margin-top:5px; display:block; }
    .kpi-box.ko .kv { color:#EA580C } .kpi-box.kb .kv { color:#2563EB }
    .kpi-box.kr .kv { color:#DC2626 } .kpi-box.kp .kv { color:#7C3AED }
    .kpi-box.kg .kv { color:#16A34A } .kpi-box.kt .kv { color:#0D9488 }
    .kpi-box.ka .kv { color:#D97706 } .kpi-box.kk .kv { color:#DB2777 }

    /* Three-column layout */
    .three-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
    .col-section { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.07); display:flex; flex-direction:column; }
    .col-hdr { padding:9px 14px; font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:#fff; }
    .green-hdr  { background:#166534 } .orange-hdr { background:#9A3412 } .purple-hdr { background:#4C1D95 }
    .teal-hdr   { background:#0F766E } .indigo-hdr { background:#3730A3 }
    .col-body { padding:12px 14px; flex:1; }
    .sub-hdr { font-size:.61rem; font-weight:800; text-transform:uppercase; letter-spacing:.6px; padding:7px 0 4px; border-bottom:1.5px solid currentColor; margin-bottom:6px; }
    .green-txt { color:#15803D } .orange-txt { color:#C2410C } .purple-txt { color:#6D28D9 }
    .teal-txt  { color:#0F766E } .indigo-txt { color:#3730A3 }
    .no-data-note { font-size:.67rem; color:#94A3B8; padding:4px 0; font-style:italic; }

    /* Bar rows */
    .bar-row { display:grid; grid-template-columns:110px 1fr auto; align-items:center; gap:7px; margin-bottom:4px; }
    .bar-track { height:7px; background:#E8EDF2; border-radius:2px; overflow:hidden; }
    .bar-fill  { height:100%; border-radius:2px; }
    .bar-name  { font-size:.73rem; color:#1E293B; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bar-stat  { font-size:.7rem; color:#64748B; white-space:nowrap; font-variant-numeric:tabular-nums; }

    /* Device type drill-down */
    .device-expand-row { cursor:pointer; user-select:none; }
    .device-expand-row .bar-row { grid-template-columns:110px 1fr auto auto; }
    .drill-arrow { font-size:.65rem; color:#94A3B8; transition:transform .2s; padding-left:2px; flex-shrink:0; }
    .device-expand-row.open .drill-arrow { transform:rotate(90deg); color:#3B82F6; }
    .device-drill-panel { max-height:0; overflow:hidden; transition:max-height .3s ease;
      padding-left:10px; border-left:2px solid #E2E8F0; margin-bottom:4px; }
    .device-drill-panel.open { max-height:400px; }
    .drill-label { font-size:.58rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.5px; color:#64748B; padding:4px 0 3px; }

    /* Foundation activity strip */
    .activity-strip { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin:10px 0; }
    .act-card { background:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px;
      padding:8px 10px; text-align:center; }
    .act-card .act-val { font-size:1.1rem; font-weight:800; color:#1E293B; line-height:1.1; }
    .act-card .act-lbl { font-size:.58rem; font-weight:600; text-transform:uppercase;
      letter-spacing:.5px; color:#64748B; margin-top:2px; }
    .act-card.act-green { border-color:#A7F3D0; background:#F0FDF4; }
    .act-card.act-blue  { border-color:#BFDBFE; background:#EFF6FF; }
    .act-card .act-val.green { color:#059669; }
    .act-card .act-val.blue  { color:#2563EB; }

    /* ESO performance rows */
    .eso-perf-row { display:grid; grid-template-columns:120px 1fr 70px 80px 60px;
      align-items:center; gap:6px; margin-bottom:5px; }
    .eso-perf-row .eso-name { font-size:.72rem; font-weight:600; color:#1E293B;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .eso-perf-row .eso-bar-wrap { position:relative; height:14px; background:#E8EDF2;
      border-radius:3px; overflow:hidden; }
    .eso-perf-row .eso-bar-fill { height:100%; border-radius:3px; transition:width .4s; }
    .eso-perf-row .eso-bar-label { position:absolute; right:4px; top:50%; transform:translateY(-50%);
      font-size:.58rem; font-weight:700; color:#fff; text-shadow:0 0 3px rgba(0,0,0,.4); }
    .eso-perf-row .eso-stat { font-size:.65rem; color:#64748B; white-space:nowrap; text-align:right; }
    .eso-perf-row .eso-week { font-size:.6rem; font-weight:700; color:#10B981;
      white-space:nowrap; text-align:right; }
    .rank-badge { display:inline-block; font-size:.55rem; font-weight:800;
      border-radius:50%; width:14px; height:14px; text-align:center; line-height:14px;
      margin-right:3px; flex-shrink:0; }
    .rank-1 { background:#F59E0B; color:#fff; }
    .rank-2 { background:#94A3B8; color:#fff; }
    .rank-3 { background:#B45309; color:#fff; }

    /* Progress bands */
    .prog-band-row { display:grid; grid-template-columns:100px 1fr auto;
      align-items:center; gap:6px; margin-bottom:5px; }
    .prog-band-row .pb-label { font-size:.68rem; font-weight:600; color:#374151;
      white-space:nowrap; }
    .prog-band-row .pb-track { height:10px; background:#E8EDF2; border-radius:2px; overflow:hidden; }
    .prog-band-row .pb-fill  { height:100%; border-radius:2px; }
    .prog-band-row .pb-stat  { font-size:.66rem; color:#64748B; white-space:nowrap;
      font-variant-numeric:tabular-nums; }

    /* Device weekly row */
    .dev-weekly-row { display:grid; grid-template-columns:110px 1fr 60px 60px 60px;
      align-items:center; gap:6px; margin-bottom:5px; }
    .dev-weekly-row .dw-name { font-size:.71rem; font-weight:600; color:#1E293B; white-space:nowrap; }
    .dev-weekly-row .dw-stat { font-size:.65rem; color:#64748B; text-align:right; font-variant-numeric:tabular-nums; }

    /* Gender line */
    .gender-line { text-align:center; font-size:.8rem; font-weight:700; color:#374151;
      background:#F8FAFC; border:1px solid #E2E8F0; border-radius:6px; padding:6px; margin:8px 0; }

    /* Section footer (URSB/PWD/Refugees/AvgRev strip) */
    .section-footer { padding:10px 14px; background:#F8FAFC; border-top:1px solid #E2E8F0;
      display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
    .section-footer span { text-align:center; font-size:.68rem; color:#64748B; line-height:1.4; }
    .section-footer span strong { font-size:.82rem; color:#1E293B; display:block; }

    @media(max-width:1100px){ .three-col{grid-template-columns:1fr 1fr;} .kpi-strip-7{grid-template-columns:repeat(4,1fr);} }
    @media(max-width:700px) { .three-col{grid-template-columns:1fr;}    .kpi-strip-7{grid-template-columns:repeat(2,1fr);} }

    /* ─── Time Period Filter Bar ─── */
    .time-filter-bar {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
      border-bottom: 1px solid #334155;
    }
    .tf-label {
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #64748B; white-space: nowrap;
      padding-right: 8px; border-right: 1px solid #334155;
      margin-right: 4px; flex-shrink: 0;
    }
    .tf-btn {
      font-size: .68rem; font-weight: 600; padding: 4px 11px;
      border-radius: 20px; border: 1.5px solid #334155;
      background: transparent; color: #94A3B8;
      cursor: pointer; white-space: nowrap; transition: all .15s;
      flex-shrink: 0;
    }
    .tf-btn:hover { border-color: #60A5FA; color: #BFDBFE; }
    .tf-btn.active {
      background: #1D4ED8; border-color: #3B82F6;
      color: #fff; box-shadow: 0 0 8px rgba(59,130,246,.4);
    }
    .tf-badge {
      margin-left: auto; font-size: .6rem; font-weight: 700;
      padding: 3px 9px; border-radius: 20px;
      background: rgba(59,130,246,.15); color: #93C5FD;
      border: 1px solid rgba(59,130,246,.3); white-space: nowrap; flex-shrink: 0;
    }

    /* ─── Archetype Cards ─── */
    .arch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 8px; margin-bottom: 10px; }
    .arch-card {
      border-radius: 10px; padding: 10px 12px; border: 1.5px solid;
      position: relative; overflow: hidden;
    }
    .arch-card::before {
      content: ''; position: absolute; top: -20px; right: -20px;
      width: 60px; height: 60px; border-radius: 50%;
      opacity: .12;
    }
    .arch-card .arch-icon { font-size: 1.4rem; margin-bottom: 6px; display: block; }
    .arch-card .arch-count { font-size: 1.45rem; font-weight: 800; line-height: 1; display: block; }
    .arch-card .arch-pct { font-size: .6rem; font-weight: 600; opacity: .75; }
    .arch-card .arch-name { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; display: block; }
    .arch-card .arch-def { font-size: .57rem; color: #64748B; line-height: 1.4; margin-top: 4px; }
    .arch-gig { background: #FFF7ED; border-color: #FDBA74; color: #9A3412; }
    .arch-gig::before { background: #F97316; }
    .arch-boot { background: #EFF6FF; border-color: #93C5FD; color: #1D4ED8; }
    .arch-boot::before { background: #3B82F6; }
    .arch-sme { background: #F0FDF4; border-color: #86EFAC; color: #15803D; }
    .arch-sme::before { background: #22C55E; }
    .arch-inv { background: #F8FAFC; border-color: #CBD5E1; color: #475569; }
    .arch-inv::before { background: #94A3B8; }
    .arch-gaz { background: #FDF4FF; border-color: #D8B4FE; color: #7E22CE; }
    .arch-gaz::before { background: #A855F7; }
    .arch-norev { background: #FFF1F2; border-color: #FDA4AF; color: #BE123C; }
    .arch-norev::before { background: #F43F5E; }

    /* ─── Cohorts ─── */
    .cohort-timeline { display: flex; flex-direction: column; gap: 10px; }
    .cohort-item {
      background: #fff; border-radius: 10px; border: 1px solid #E2E8F0;
      padding: 12px 16px; display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center; gap: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .cohort-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .cohort-name { font-size: .82rem; font-weight: 700; color: #1E293B; }
    .cohort-meta { font-size: .67rem; color: #64748B; margin-top: 2px; }
    .cohort-badge { font-size: .6rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .badge-active { background: #D1FAE5; color: #065F46; }
    .badge-upcoming { background: #DBEAFE; color: #1E40AF; }
    .badge-completed { background: #F1F5F9; color: #475569; }
    .cohort-progress { height: 5px; background: #E2E8F0; border-radius: 3px; overflow: hidden; margin-top: 6px; }
    .cohort-progress-fill { height: 100%; border-radius: 3px; transition: width .4s; }

    /* ─── Digital Credit ─── */
    .credit-card {
      background: #fff; border-radius: 10px; border: 1.5px solid #E2E8F0;
      padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .credit-total { font-size: 2rem; font-weight: 800; color: #1D4ED8; line-height: 1; }
    .credit-row { display: grid; grid-template-columns: 130px 1fr 80px 80px; align-items: center; gap: 8px; margin-bottom: 6px; }
    .credit-eso { font-size: .75rem; font-weight: 600; color: #1E293B; }
    .credit-amt { font-size: .72rem; font-weight: 700; color: #1D4ED8; text-align: right; }
    .credit-count { font-size: .68rem; color: #64748B; text-align: right; }

    /* ─── ESO Targets ─── */
    .target-row {
      display: grid; grid-template-columns: 130px auto 1fr auto;
      align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .target-label { font-size: .72rem; font-weight: 600; color: #1E293B; }
    .target-pct-badge { font-size: .65rem; font-weight: 800; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
    .tgt-green { background: #D1FAE5; color: #065F46; }
    .tgt-amber { background: #FEF3C7; color: #92400E; }
    .tgt-red   { background: #FEE2E2; color: #991B1B; }
    .target-track { height: 10px; background: #E8EDF2; border-radius: 3px; overflow: hidden; position: relative; }
    .target-fill { height: 100%; border-radius: 3px; transition: width .4s; }
    .target-marker {
      position: absolute; top: -3px; bottom: -3px; width: 2px;
      background: #DC2626; border-radius: 1px;
    }
    .target-vals { font-size: .62rem; color: #64748B; white-space: nowrap; text-align: right; }

    /* Clean dashboard polish */
    :root {
      --page-bg: #F6F8FB;
      --surface: #FFFFFF;
      --surface-soft: #F8FAFC;
      --line: #E2E8F0;
      --line-strong: #CBD5E1;
      --text: #0F172A;
      --muted: #64748B;
      --muted-soft: #94A3B8;
      --accent-blue: #2563EB;
      --accent-green: #059669;
      --accent-orange: #EA580C;
      --accent-purple: #7C3AED;
      --accent-teal: #0F766E;
      --radius: 8px;
      --shadow-soft: 0 1px 2px rgba(15, 23, 42, .06);
    }

    body { background: var(--page-bg); color: var(--text); }
    .header {
      background: #FFFFFF;
      color: var(--text);
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      box-shadow: none;
    }
    .header-left h1 { font-size: 1rem; letter-spacing: 0; }
    .header-left .sub { color: var(--muted); }
    .header-right { gap: 8px; }
    .pill {
      background: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #BFDBFE;
      border-radius: 999px;
    }
    .btn-refresh {
      background: #FFFFFF;
      color: #475569;
      border-color: var(--line-strong);
      border-radius: 7px;
    }
    .btn-refresh:hover { border-color: #93C5FD; color: #1D4ED8; background: #EFF6FF; }

    .type-tabs-bar {
      background: #FFFFFF;
      border-bottom: 1px solid var(--line);
      padding: 0 24px;
    }
    .type-tab-btn {
      color: #475569;
      padding: 11px 18px;
      font-size: .78rem;
      letter-spacing: 0;
      border-bottom-width: 2px;
    }
    .type-tab-btn:hover { color: var(--accent-blue); background: #F8FAFC; }
    .type-tab-btn.active { color: #1D4ED8; border-bottom-color: #2563EB; }

    .sub-tabs-bar {
      background: #F8FAFC;
      border-bottom: 1px solid var(--line);
      min-height: 40px;
      padding: 0 24px;
    }
    .sub-tab-btn {
      color: #64748B;
      padding: 9px 14px;
      font-size: .76rem;
      border-bottom-width: 2px;
    }
    .sub-tab-btn:hover { color: #1D4ED8; background: #FFFFFF; }
    .sub-tab-btn.active { color: #1D4ED8; border-bottom-color: #2563EB; background: #FFFFFF; }

    .time-filter-bar {
      background: #FFFFFF;
      border-bottom: 1px solid var(--line);
      padding: 8px 24px;
      gap: 7px;
    }
    .tf-label {
      color: var(--muted);
      border-right-color: var(--line);
    }
    .tf-btn {
      color: #475569;
      border: 1px solid var(--line-strong);
      background: #FFFFFF;
      border-radius: 7px;
      padding: 5px 10px;
    }
    .tf-btn:hover { color: #1D4ED8; border-color: #93C5FD; background: #EFF6FF; }
    .tf-btn.active {
      color: #FFFFFF;
      background: #2563EB;
      border-color: #2563EB;
      box-shadow: none;
    }
    .tf-badge {
      color: #1D4ED8;
      background: #EFF6FF;
      border-color: #BFDBFE;
    }

    .content { max-width: 1320px; padding: 22px 24px 36px; }
    .section-hdr { margin-bottom: 14px; }
    .section-hdr h2 { font-size: 1.05rem; letter-spacing: 0; }

    .card,
    .kpi,
    .kpi-box,
    .port-header,
    .col-section,
    .credit-card,
    .cohort-item {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
    }
    .card { padding: 16px; }
    .card h3 {
      color: #334155;
      font-size: .68rem;
      letter-spacing: .04em;
      margin-bottom: 12px;
    }

    .port-header { margin-bottom: 12px; }
    .port-bar-strip { height: 0; display: none; }
    .port-title-area { padding: 14px 16px; }
    .port-title { font-size: 1.05rem; font-weight: 750; letter-spacing: 0; }
    .port-filename {
      color: var(--muted);
      text-decoration: none;
      font-size: .68rem;
    }

    .kpi-row,
    .kpi-strip-7 { gap: 10px; margin-bottom: 12px; }
    .kpi { padding: 14px 15px; border-left-width: 3px; }
    .kpi-box {
      padding: 11px 9px 10px;
      text-align: left;
      border-top: 3px solid #CBD5E1;
      box-shadow: none;
    }
    .kpi-box.ko { border-top-color: var(--accent-orange); }
    .kpi-box.kb { border-top-color: var(--accent-blue); }
    .kpi-box.kr { border-top-color: #DC2626; }
    .kpi-box.kp { border-top-color: var(--accent-purple); }
    .kpi-box.kg { border-top-color: var(--accent-green); }
    .kpi-box.kt { border-top-color: var(--accent-teal); }
    .kpi-box.ka { border-top-color: #D97706; }
    .kpi-box.kk { border-top-color: #DB2777; }
    .kpi-box .kv { font-size: 1.18rem; color: var(--text) !important; }
    .kpi-box .kl { font-size: .56rem; color: var(--muted); letter-spacing: .05em; }

    .three-col { gap: 12px; }
    .col-section { overflow: hidden; }
    .col-hdr {
      background: #FFFFFF !important;
      color: #334155;
      padding: 10px 14px 8px;
      border-top: 3px solid #CBD5E1;
      border-bottom: 1px solid var(--line);
      font-size: .64rem;
      letter-spacing: .05em;
    }
    .green-hdr  { border-top-color: var(--accent-green); }
    .orange-hdr { border-top-color: var(--accent-orange); }
    .purple-hdr { border-top-color: var(--accent-purple); }
    .teal-hdr   { border-top-color: var(--accent-teal); }
    .indigo-hdr { border-top-color: var(--accent-blue); }
    .col-body { padding: 12px 14px 14px; }
    .sub-hdr {
      border-bottom: 1px solid var(--line);
      color: #334155 !important;
      padding: 7px 0 5px;
      margin-bottom: 8px;
      letter-spacing: .05em;
    }

    .activity-strip { gap: 8px; margin: 0 0 12px; }
    .act-card {
      background: #FFFFFF;
      border-color: var(--line);
      border-radius: 7px;
      padding: 8px 9px;
    }
    .act-card.act-green,
    .act-card.act-blue { background: #FFFFFF; border-color: var(--line); }

    .bar-row { margin-bottom: 6px; gap: 8px; }
    .bar-track { background: #E5EAF1; border-radius: 3px; }
    .bar-fill { border-radius: 3px; }
    .bar-name { color: #1F2937; font-size: .71rem; }
    .bar-stat { color: var(--muted); }
    .no-data-note { color: var(--muted-soft); }

    .device-drill-panel {
      border-left-color: var(--line);
      background: #F8FAFC;
      margin: 2px 0 8px 8px;
      padding-left: 12px;
    }
    .drill-label { color: var(--muted); }

    .arch-card {
      border-radius: 8px;
      background: #FFFFFF !important;
      border-color: var(--line) !important;
      color: #334155 !important;
    }
    .arch-card::before,
    .arch-card .arch-icon { display: none; }

    @media(max-width:1100px){
      .content { padding: 18px 16px 28px; }
      .header, .type-tabs-bar, .sub-tabs-bar, .time-filter-bar { padding-left: 16px; padding-right: 16px; }
    }

    .landing-grid { display: grid; gap: 12px; margin-bottom: 12px; }
    .landing-grid.two { grid-template-columns: 1.15fr .85fr; }
    .landing-grid.three { grid-template-columns: repeat(3, 1fr); }
    .landing-grid.four { grid-template-columns: repeat(4, 1fr); }
    .landing-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      padding: 14px;
    }
    .landing-card h3 {
      font-size: .68rem;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 10px;
    }
    .metric-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      border-top: 3px solid #CBD5E1;
      padding: 12px;
      min-height: 82px;
    }
    .metric-card .metric-value {
      display: block;
      font-size: 1.35rem;
      line-height: 1;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .metric-card .metric-label {
      display: block;
      font-size: .62rem;
      color: var(--muted);
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .metric-card .metric-note {
      display: block;
      font-size: .66rem;
      color: var(--muted-soft);
      margin-top: 5px;
    }
    .metric-card.blue { border-top-color: var(--accent-blue); }
    .metric-card.green { border-top-color: var(--accent-green); }
    .metric-card.orange { border-top-color: var(--accent-orange); }
    .metric-card.purple { border-top-color: var(--accent-purple); }
    .metric-card.teal { border-top-color: var(--accent-teal); }
    .metric-card.red { border-top-color: #DC2626; }
    .funnel {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      align-items: stretch;
    }
    .funnel-step {
      position: relative;
      background: #F8FAFC;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 10px;
      min-height: 92px;
    }
    .funnel-step::after {
      content: '';
      position: absolute;
      right: -7px;
      top: 50%;
      width: 10px;
      height: 10px;
      border-top: 1px solid var(--line-strong);
      border-right: 1px solid var(--line-strong);
      transform: translateY(-50%) rotate(45deg);
      background: #F8FAFC;
      z-index: 2;
    }
    .funnel-step:last-child::after { display: none; }
    .funnel-label {
      display: block;
      font-size: .62rem;
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }
    .funnel-value {
      display: block;
      font-size: 1.18rem;
      font-weight: 850;
      color: var(--text);
      line-height: 1;
    }
    .funnel-rate {
      display: block;
      margin-top: 7px;
      font-size: .66rem;
      color: var(--muted);
    }
    .snapshot-list { display: grid; gap: 7px; }
    .snapshot-row {
      display: grid;
      grid-template-columns: minmax(96px, 1fr) 1.4fr auto;
      gap: 8px;
      align-items: center;
      font-size: .72rem;
    }
    .snapshot-row span:first-child {
      color: #1F2937;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .snapshot-row strong {
      color: var(--muted);
      font-size: .68rem;
      font-variant-numeric: tabular-nums;
    }
    .mini-track {
      height: 7px;
      background: #E5EAF1;
      border-radius: 3px;
      overflow: hidden;
    }
    .mini-fill { height: 100%; border-radius: 3px; background: var(--accent-blue); }
    .insight-list { display: grid; gap: 8px; }
    .insight {
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent-blue);
      background: #F8FAFC;
      border-radius: 7px;
      padding: 9px 10px;
      font-size: .75rem;
      color: #334155;
      line-height: 1.45;
    }
    .insight.good { border-left-color: var(--accent-green); }
    .insight.warn { border-left-color: var(--accent-orange); }
    .insight.info { border-left-color: var(--accent-blue); }
    .credit-page {
      display: grid;
      gap: 18px;
    }
    .credit-page .section-hdr {
      margin: 4px 0 -2px;
      padding-top: 4px;
    }
    .credit-page .section-hdr h2 {
      font-size: 1.05rem;
    }
    .credit-page .landing-grid {
      gap: 14px;
      margin-bottom: 0;
    }
    .credit-page .landing-card {
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
    }
    .credit-page .landing-card h3 {
      color: #0F172A;
      font-size: .72rem;
      margin-bottom: 12px;
    }
    .credit-page .credit-kpi-strip {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)) !important;
      gap: 12px;
      margin-bottom: 0 !important;
    }
    .credit-page .credit-kpi-strip .kpi-box {
      min-height: 86px;
      padding: 14px 14px 13px;
      text-align: left;
    }
    .credit-page .credit-kpi-strip .kv {
      font-size: clamp(1.15rem, 1.5vw, 1.45rem);
      overflow-wrap: anywhere;
    }
    .credit-page .credit-priority-grid {
      grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr) !important;
    }
    .credit-page .credit-two-even {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    }
    .credit-page .credit-analysis-grid {
      grid-template-columns: minmax(260px, .75fr) minmax(0, 1.25fr) !important;
    }
    .credit-page .credit-wide-card {
      grid-column: 1 / -1;
    }
    .credit-page .credit-table-card .eso-summary-table {
      min-width: 620px;
    }
    .credit-page .bar-row {
      grid-template-columns: minmax(100px, 130px) 1fr max-content;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
    }
    .credit-page .bar-row .bar-name { order: 1; }
    .credit-page .bar-row .bar-track { order: 2; height: 8px; }
    .credit-page .bar-row .bar-stat { order: 3; }
    .credit-page .sub-bar-group + .sub-bar-group {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .credit-page .sub-bar-group h4 {
      font-size: .64rem;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 750;
      margin-bottom: 8px;
    }
    .credit-page .credit-funnel-row {
      display: grid;
      grid-template-columns: minmax(140px, .8fr) minmax(160px, 1.2fr) minmax(170px, max-content);
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .credit-page .credit-funnel-row .bar-track {
      height: 10px;
    }
    .credit-page .credit-funnel-stat {
      color: #475569;
      font-size: .68rem;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }
    .credit-page .insight {
      background: #fff;
      min-height: 68px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      justify-content: center;
    }
    .credit-page .insight strong {
      display: block;
      color: #0F172A;
      font-size: .72rem;
    }
    .credit-page .insight span {
      display: block;
      font-size: .92rem;
      font-weight: 800;
      color: #1E293B;
    }
    .credit-page .insight small {
      display: block;
      line-height: 1.35;
      color: var(--muted);
    }
    @media (max-width: 900px) {
      .credit-page .credit-priority-grid,
      .credit-page .credit-two-even,
      .credit-page .credit-analysis-grid {
        grid-template-columns: 1fr !important;
      }
      .credit-page .credit-funnel-row {
        grid-template-columns: 1fr;
      }
      .credit-page .credit-funnel-stat {
        text-align: left;
      }
    }

    /* ═══════════════════════════════════════
       Digital Credit v3 — dark theme (scoped)
    ═══════════════════════════════════════ */
    .cv3 {
      --bg:#F1F5F9;--surface:#FFFFFF;--surface2:#F8FAFC;--surface3:#E2E8F0;
      --ink:#0F172A;--ink2:#475569;--ink3:#94A3B8;
      --border:#E2E8F0;--border2:#CBD5E1;
      --cyan:#0891B2;--cyan-dim:rgba(8,145,178,.08);
      --teal:#0F766E;--teal-dim:rgba(15,118,110,.08);
      --amber:#D97706;--amber-dim:rgba(217,119,6,.08);
      --red:#DC2626;--red-dim:rgba(220,38,38,.08);
      --green:#059669;--green-dim:rgba(5,150,105,.08);
      --rose:#E11D48;--rose-dim:rgba(225,29,72,.08);
      --violet:#7C3AED;--violet-dim:rgba(124,58,237,.08);
      --orange:#EA580C;--orange-dim:rgba(234,88,12,.08);
      --blue:#2563EB;--blue-dim:rgba(37,99,235,.08);
      --gold:#CA8A04;--gold-dim:rgba(202,138,4,.08);
      --lime:#65A30D;--lime-dim:rgba(101,163,13,.08);
      --font:'Segoe UI', system-ui, -apple-system, sans-serif;--font-num:'Segoe UI', system-ui, -apple-system, sans-serif;
      --r:12px;--r-sm:8px;--r-xs:5px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 13.5px;
      border-radius: 14px;
      padding: 22px;
      -webkit-font-smoothing: antialiased;
      display: block;
    }
    .cv3 .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--border)}
    .cv3 .hd-left h1{font-family:var(--font);font-weight:800;font-size:21px;color:var(--ink);letter-spacing:-.2px}
    .cv3 .hd-left .sub{font-size:12px;color:var(--ink3);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .cv3 .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--cyan-dim);color:var(--cyan);letter-spacing:.3px}
    .cv3 .badge-rose{background:var(--rose-dim);color:var(--rose)}

    .cv3 .sec-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);margin-bottom:14px;margin-top:26px;display:flex;align-items:center;gap:10px}
    .cv3 .sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
    .cv3 .sec-label:first-of-type{margin-top:0}
    .cv3 .sec-label.inclusion{color:var(--rose)}
    .cv3 .sec-label.inclusion::after{background:linear-gradient(90deg,var(--rose-dim),transparent)}

    .cv3 .kpi-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:10px}
    .cv3 .kpi-strip-5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:0}
    .cv3 .kpi{background:var(--surface);border-radius:var(--r);padding:16px 16px 14px;border:1px solid var(--border);position:relative;overflow:hidden;transition:border-color .2s}
    .cv3 .kpi:hover{border-color:var(--border2)}
    .cv3 .kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
    .cv3 .kpi.c-cyan::after{background:var(--cyan)} .cv3 .kpi.c-teal::after{background:var(--teal)}
    .cv3 .kpi.c-amber::after{background:var(--amber)} .cv3 .kpi.c-green::after{background:var(--green)}
    .cv3 .kpi.c-rose::after{background:var(--rose)} .cv3 .kpi.c-violet::after{background:var(--violet)}
    .cv3 .kpi.c-blue::after{background:var(--blue)} .cv3 .kpi.c-orange::after{background:var(--orange)}
    .cv3 .kpi.c-gold::after{background:var(--gold)} .cv3 .kpi.c-lime::after{background:var(--lime)}
    .cv3 .kpi-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-bottom:8px}
    .cv3 .kpi-val{font-family:var(--font-num);font-size:26px;color:var(--ink);line-height:1;margin-bottom:3px;overflow-wrap:anywhere}
    .cv3 .kpi-val.cyan{color:var(--cyan)} .cv3 .kpi-val.teal{color:var(--teal)} .cv3 .kpi-val.amber{color:var(--amber)}
    .cv3 .kpi-val.green{color:var(--green)} .cv3 .kpi-val.rose{color:var(--rose)} .cv3 .kpi-val.violet{color:var(--violet)}
    .cv3 .kpi-val.blue{color:var(--blue)} .cv3 .kpi-val.orange{color:var(--orange)} .cv3 .kpi-val.gold{color:var(--gold)} .cv3 .kpi-val.lime{color:var(--lime)}
    .cv3 .kpi-sub{font-size:10.5px;color:var(--ink3)}

    .cv3 .inclusion-kpi-row{background:linear-gradient(135deg,rgba(251,113,133,.06),rgba(167,139,250,.04));border:1px solid rgba(251,113,133,.18);border-radius:var(--r);padding:14px;margin-bottom:14px}
    .cv3 .inclusion-kpi-row .kpi{background:rgba(255,255,255,.03);border-color:rgba(251,113,133,.15)}
    .cv3 .inclusion-kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--rose);margin-bottom:12px;display:flex;align-items:center;gap:7px}
    .cv3 .inclusion-kpi-label::before{content:'';width:3px;height:12px;background:var(--rose);border-radius:2px}

    .cv3 .card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
    .cv3 .card.inclusion-card{border-color:rgba(251,113,133,.22);background:linear-gradient(135deg,var(--surface),rgba(251,113,133,.04))}
    .cv3 .card.pwd-card{border-color:rgba(96,165,250,.22);background:linear-gradient(135deg,var(--surface),rgba(96,165,250,.04))}
    .cv3 .card.ref-card{border-color:rgba(163,230,53,.22);background:linear-gradient(135deg,var(--surface),rgba(163,230,53,.04))}
    .cv3 .card-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);gap:10px}
    .cv3 .card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);display:flex;align-items:center;gap:7px}
    .cv3 .card-title-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .cv3 .card-meta{font-size:11px;color:var(--ink3);text-align:right}
    .cv3 .card-body{padding:18px}

    .cv3 .idv-desc{font-size:10.5px;color:var(--ink3)}
    .cv3 .idv-val{font-family:var(--font-num);font-size:19px;text-align:right;white-space:nowrap}

    .cv3 .callout{border-radius:var(--r-sm);padding:12px 14px;border-left:3px solid;margin-top:14px}

    .cv3 .callout-blue{background:var(--blue-dim);border-color:var(--blue)}
    .cv3 .callout-lime{background:var(--lime-dim);border-color:var(--lime)}

    .cv3 .callout-amber .callout-lbl{color:var(--amber)} .cv3 .callout-rose .callout-lbl{color:var(--rose)}
    .cv3 .callout-violet .callout-lbl{color:var(--violet)} .cv3 .callout-blue .callout-lbl{color:var(--blue)}

    .cv3 .empty{text-align:center;padding:26px 16px;color:var(--ink3);font-size:12px;line-height:1.6}

    .cv3 .tbl-wrap{overflow-x:auto}
    .cv3 table{width:100%;border-collapse:collapse;font-size:12px}

    @media(max-width:1200px){

    /* App-wide layout refresh */
    html { scroll-behavior: smooth; }

<script>
/* ─── Global Time Period Filter ─── */
window.TIME_FILTER = 'all';
window.getRecordDate = function(r) {
  const raw = r && (r.date || r.d || r._submission_time || r.submission_time || r.SubmissionDate);
  if (!raw) return null;
  if (raw instanceof Date && !Number.isNaN(raw.getTime())) return raw;

  const text = String(raw).trim();
  if (!text) return null;

  const monthMap = {
    jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2,
    apr: 3, april: 3, may: 4, jun: 5, june: 5, jul: 6, july: 6,
    aug: 7, august: 7, sep: 8, sept: 8, september: 8, oct: 9,
    october: 9, nov: 10, november: 10, dec: 11, december: 11
  };
  let match = text.match(/^(\d{1,2})\/([A-Za-z]{3,9})\/(\d{4})$/);
  if (match) {
    const month = monthMap[match[2].toLowerCase()];
    if (month != null) return new Date(Number(match[3]), month, Number(match[1]));
  }

  match = text.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
  if (match) {
    const first = Number(match[1]);
    const second = Number(match[2]);
    const year = Number(match[3]);
    const day = first > 12 ? first : second;
    const month = first > 12 ? second - 1 : first - 1;
    return new Date(year, month, day);
  }

  const parsed = new Date(text);
  return Number.isNaN(parsed.getTime()) ? null : parsed;
};

window.getPeriodRange = function(period, records) {
  const dated = (records || [])
    .map(r => window.getRecordDate(r))
    .filter(Boolean)
    .sort((a, b) => b - a);
  const anchor = dated[0] || new Date();
  const start = new Date(anchor);
  start.setHours(0, 0, 0, 0);
  let end = new Date(start);
  end.setDate(end.getDate() + 1);

  if (period === 'yday') {
    start.setDate(start.getDate() - 1);
    end.setDate(end.getDate() - 1);
  } else if (period === 'week' || period === 'lweek') {
    const day = start.getDay() || 7;
    start.setDate(start.getDate() - day + 1);
    if (period === 'lweek') start.setDate(start.getDate() - 7);
    end = new Date(start);
    end.setDate(end.getDate() + 7);
  } else if (period === 'month' || period === 'lmonth') {
    start.setDate(1);
    if (period === 'lmonth') start.setMonth(start.getMonth() - 1);
    end = new Date(start);
    end.setMonth(end.getMonth() + 1);
  } else if (period === 'qtr' || period === 'lqtr') {
    start.setMonth(Math.floor(start.getMonth() / 3) * 3, 1);
    if (period === 'lqtr') start.setMonth(start.getMonth() - 3);
    end = new Date(start);
    end.setMonth(end.getMonth() + 3);
  }

  return { start, end, anchor };
};

window.recalculatePortfolio = function(p, period) {
  if (period === 'all' || !p.raw_records || p.raw_records.length === 0) return p;

  // Deep clone to avoid mutating the all-time original data
  const p_dyn = JSON.parse(JSON.stringify(p));
  const { start, end } = window.getPeriodRange(period, p.raw_records);

  const records = p.raw_records.filter(r => {
    const rd = window.getRecordDate(r);
    if (!rd) return false;
    return rd >= start && rd < end;
  });

  const agg = (key) => records.reduce((acc, r) => {
    if (r[key]) acc[r[key]] = (acc[r[key]] || 0) + 1;
    return acc;
  }, {});

  p_dyn.raw_records = records;
  p_dyn.sectors = agg('sector');
  p_dyn.districts = agg('district');
  p_dyn.archetypes = agg('archetype');
  p_dyn.by_district = p_dyn.districts;

  const yes = v => /^(yes|true|1)$/i.test(String(v || '').trim());
  if (p_dyn.stats) {
    p_dyn.stats.total = records.length;
    p_dyn.stats.record_count = records.length;
    p_dyn.stats.clean = records.length;
    p_dyn.stats.ursb = records.filter(r => yes(r.ursb) || yes(r.business_registered)).length;
    p_dyn.stats.tin = records.filter(r => yes(r.tin)).length;
    p_dyn.stats.nssf = records.filter(r => yes(r.nssf)).length;
    p_dyn.stats.pwd = records.filter(r => yes(r.pwd) || yes(r.disability) || String(r.disability_status || '').toLowerCase().includes('with')).length;
    p_dyn.stats.refugee = records.filter(r => yes(r.refugee)).length;
  }
  
  // Re-aggregate gender globally or within founders if necessary
  const genAgg = agg('gender');
  if (p_dyn.gender) p_dyn.gender = genAgg;
  if (p_dyn.founders) {
      if (!p_dyn.founders.gender) p_dyn.founders.gender = {};
      p_dyn.founders.gender = genAgg;
      const f = genAgg.Female || 0;
      const m = genAgg.Male || 0;
      p_dyn.founders.female_pct = (f+m) > 0 ? Number(((f/(f+m))*100).toFixed(1)) : 0;
  }

  if (p_dyn.revenue && p.revenue) {
    const revs = records.map(r => r.revenue).filter(v => v>0).sort((a,b)=>a-b);
    p_dyn.revenue.count = revs.length;
    p_dyn.revenue.mean = revs.length ? Math.floor(revs.reduce((a,b)=>a+b,0)/revs.length) : 0;
    p_dyn.revenue.median = revs.length ? revs[Math.floor(revs.length/2)] : 0;
  }
  if (p_dyn.funding && p.funding) {
    const funds = records.map(r => r.funding).filter(v => v>0).sort((a,b)=>a-b);
    p_dyn.funding.count = funds.length;
    p_dyn.funding.mean = funds.length ? Math.floor(funds.reduce((a,b)=>a+b,0)/funds.length) : 0;
    p_dyn.funding.median = funds.length ? funds[Math.floor(funds.length/2)] : 0;
  }
  return p_dyn;
};

window.setTimePeriod = function(btn, period) {
  window.TIME_FILTER = period;
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const labels = {
    all:'All Records', today:'Today Only', yday:'Yesterday',
    week:'This Week', lweek:'Last Week', month:'This Month',
    lmonth:'Last Month', qtr:'This Quarter', lqtr:'Last Quarter'
  };
  const badge = document.getElementById('tf-badge');
  if (badge) badge.textContent = labels[period] || 'All Records';

  if (typeof window.triggerActivePanelReRender === 'function') {
      window.triggerActivePanelReRender();
  }
};

(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════

  const PALETTE = [

    '#EC4899','#14B8A6','#F97316','#6366F1','#84CC16',

  };

  /* ─────────────────────────────────────────────────────────────
     ARCHETYPE CARD DEFINITIONS
  ───────────────────────────────────────────────────────────── */
  const ARCH_META = {
    'Gig Workers':       { cls:'arch-gig',   icon:'⚙️',  def:'Self-employed with inconsistent revenue streams. Hustling but not yet structured.' },
    'Bootstrappers':     { cls:'arch-boot',  icon:'🔧',  def:'Growing businesses with some revenue and reinvestment. Structured but pre-scale.' },
    'Bootstrappers SME': { cls:'arch-sme',   icon:'🏗️',  def:'Established SMEs generating consistent revenue. Ready for growth capital.' },

    'Gazelles':          { cls:'arch-gaz',   icon:'🦁',  def:'High-growth businesses with strong revenue trajectory. Investment-ready.' },
    'No Revenue Data':   { cls:'arch-norev', icon:'❓',  def:'Businesses with incomplete revenue information. Needs follow-up.' },
  };

  function archetypeCardsHTML(archetypes, total) {
    if (!archetypes || !Object.keys(archetypes).length)
      return '<div class="no-data-note">No archetype data available</div>';
    const order = ['Gazelles','Bootstrappers SME','Bootstrappers','Gig Workers','Invisibles','No Revenue Data'];
    const sorted = order.filter(k => archetypes[k]).concat(
      Object.keys(archetypes).filter(k => !order.includes(k))
    );
    return '<div class="arch-grid">' + sorted.map(k => {
      const count = archetypes[k] || 0;
      const pct   = total > 0 ? (count/total*100).toFixed(1) : '0';
      const meta  = ARCH_META[k] || { cls:'arch-inv', icon:'📊', def:'' };
      return `<div class="arch-card ${meta.cls}">

  }

  /* ─────────────────────────────────────────────────────────────
     ESO TARGETS BUILDER
  ───────────────────────────────────────────────────────────── */
  function targetRowsHTML(targets) {
    if (!targets || !targets.length) return '<div class="no-data-note">No targets configured</div>';
    return targets.map(t => {
      const pct   = t.target > 0 ? Math.min(t.actual / t.target * 100, 100) : 0;
      const pctStr= pct.toFixed(0);
      const cls   = pct >= 90 ? 'tgt-green' : pct >= 70 ? 'tgt-amber' : 'tgt-red';
      const color = pct >= 90 ? '#10B981' : pct >= 70 ? '#F59E0B' : '#EF4444';
      return `<div class="target-row">
        <span class="target-label">${t.label}</span>
        <span class="target-pct-badge ${cls}">${pctStr}%</span>
        <div class="target-track">
          <div class="target-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div>
        </div>
        <span class="target-vals">${(t.actual||0).toLocaleString()} / ${(t.target||0).toLocaleString()}</span>
      </div>`;
    }).join('');
  }

  function buildTargetsPanel(p) {
    const targets = p.targets || [];
    if (!targets.length) return '';
    return `<div class="col-section" style="margin-top:12px">
      <div class="col-hdr" style="background:#1D4ED8">ESO TARGETS — ${(p.eso || p.name).toUpperCase()}</div>
      <div class="col-body">${targetRowsHTML(targets)}</div>
    </div>`;
  }

  /* ─────────────────────────────────────────────────────────────
     COHORT BUILDER
  ───────────────────────────────────────────────────────────── */
  function buildCohortsHTML(cohorts) {
    if (!cohorts || !cohorts.length)
      return '<div class="no-data-note" style="padding:20px">No acceleration cohorts recorded yet.</div>';

    const now = new Date();
    const statusOf = c => {
      const s = new Date(c.start_date), e = new Date(c.end_date);
      if (now < s) return { label:'Upcoming', cls:'badge-upcoming', color:'#3B82F6', pct:0 };
      if (now > e) return { label:'Completed', cls:'badge-completed', color:'#64748B', pct:100 };
      const pct = Math.min((now-s)/(e-s)*100,100);
      return { label:'Active', cls:'badge-active', color:'#10B981', pct };
    };

    const byEso = {};
    cohorts.forEach(c => {

    const COHORT_COLORS = ['#3B82F6','#10B981','#F59E0B','#8B5CF6','#EF4444','#EC4899','#14B8A6','#F97316'];
    const esoList = Object.keys(byEso);

    // KPI strip
    const active    = cohorts.filter(c => statusOf(c).label === 'Active').length;

      ${kpiBox(totalPart,       'Total Participants','kt')}

    // Timeline per cohort
    const timeline = cohorts
      .slice().sort((a,b) => new Date(a.start_date) - new Date(b.start_date))
      .map((c, i) => {
        const st = statusOf(c);
        const esoIdx = esoList.indexOf(c.eso);

        return `<div class="cohort-item">
          <div class="cohort-dot" style="background:${color}"></div>
          <div>
            <div class="cohort-name">${c.name}</div>
            <div class="cohort-meta">
              ${c.eso} &nbsp;·&nbsp; ${c.start_date} → ${c.end_date}

            <div class="cohort-progress">
              <div class="cohort-progress-fill" style="width:${st.pct.toFixed(0)}%;background:${st.color}"></div>

          </div>
          <span class="cohort-badge ${st.cls}">${st.label}</span>
        </div>`;
      }).join('');

    // By ESO breakdown
    const byEsoRows = esoList.map((eso, i) => {
      const cs = byEso[eso];
      const act = cs.filter(c => statusOf(c).label==='Active').length;
      const parts = cs.reduce((s,c) => s+(c.participants||0), 0);
      const color = COHORT_COLORS[i % COHORT_COLORS.length];
      return `<div class="bar-row">
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(parts/Math.max(totalPart,1)*100,100).toFixed(1)}%;background:${color}"></div></div>
        <span class="bar-name">${eso}</span>
        <span class="bar-stat">${parts} pax &ensp; ${act} active</span>
      </div>`;
    }).join('');

    return `
      <div class="port-header">
        <div class="port-bar-strip"><div class="port-bar-orange"></div><div class="port-bar-blue"></div></div>
        <div class="port-title-area">
          <div class="port-title">Acceleration Cohorts — Programme Overview</div>
          <div class="port-filename">10X Digital Economy · All ESOs · ${new Date().toLocaleDateString('en-UG',{month:'long',year:'numeric'})}</div>
        </div>
      </div>
      ${kpis}
      <div class="three-col">
        <div class="col-section" style="grid-column:span 2">
          <div class="col-hdr" style="background:#0F766E">COHORT TIMELINE</div>
          <div class="col-body"><div class="cohort-timeline">${timeline}</div></div>
        </div>
        <div class="col-section">
          <div class="col-hdr" style="background:#7C3AED">PARTICIPANTS BY ESO</div>
          <div class="col-body">${byEsoRows || '<div class="no-data-note">No ESO data</div>'}</div>
        </div>
      </div>`;
  }

    const totalAmt    = esoCredit.reduce((s,e) => s + (e.amount_ugx||0), 0);

    const nEsos       = esoCredit.length;

    // Breakdown by credit type

        ${kpiBox('UGX '+totalAmtStr,          'Total Credit Disbursed','ko')}
        ${kpiBox('UGX '+avgAmtStr,            'Avg Credit / Business', 'kg')}
        ${kpiBox(nEsos,                        'ESO Partners',          'kp')}
        ${kpiBox(creditData.period||'2025–26','Programme Period',      'kt')}
        ${kpiBox(creditData.credit_types||(Object.keys(byType).length)||'—', 'Credit Types', 'kr')}
        ${kpiBox(creditData.repayment_rate ? creditData.repayment_rate+'%' : '—', 'Avg Repayment', 'ka')}
      </div>

      <div class="three-col">
        <div class="col-section" style="grid-column:span 2">
          <div class="col-hdr" style="background:#1D4ED8">CREDIT BY ESO PARTNER</div>

            <div class="credit-row" style="margin-bottom:8px">
              <span style="font-size:.6rem;color:#94A3B8;font-weight:700">ESO</span>
              <span></span>
              <span style="font-size:.6rem;color:#94A3B8;text-align:right">Amount</span>
              <span style="font-size:.6rem;color:#94A3B8;text-align:right">Businesses</span>
            </div>
            ${esoRows || '<div class="no-data-note">No credit data</div>'}

        <div class="col-section">
          <div class="col-hdr" style="background:#065F46">CREDIT TYPE BREAKDOWN</div>
          <div class="col-body">
            ${Object.keys(byType).length
              ? barRowsHTML(byType, {'Loan':'#3B82F6','Grant':'#10B981','SACCO':'#F59E0B','MFI':'#8B5CF6'}, typeTotal, 10)
              : '<div class="no-data-note">No type breakdown available</div>'}

  /* ═══════════════════════════════════════════════════════════════
     CHART REGISTRY
  ═══════════════════════════════════════════════════════════════ */

  const _charts = {};

  function destroyPanel(prefix) {
    Object.keys(_charts).forEach(k => {
      if (k.startsWith(prefix)) { _charts[k].destroy(); delete _charts[k]; }
    });
  }

  function makeChart(id, type, labels, datasets, opts) {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; }
    const ctx = canvas.getContext('2d');
    _charts[id] = new Chart(ctx, {
      type,
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        animation: { duration: 400 },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.dataset.label || ctx.label}: ${Number(ctx.raw).toLocaleString()}`
            }
          }
        },
        ...opts
      }
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     CHART HELPERS
  ═══════════════════════════════════════════════════════════════ */
  function sorted(obj, n) {
    let e = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
    return n ? e.slice(0, n) : e;
  }

  function colorsFor(labels, map) {
    return labels.map((l, i) => (map && map[l]) ? map[l] : PALETTE[i % PALETTE.length]);
  }

  /* Horizontal bar */
  function hBar(id, obj, colorMap, n) {
    const e = sorted(obj, n);
    if (!e.length) return;
    const labels = e.map(x => x[0]);
    const values = e.map(x => x[1]);
    makeChart(id, 'bar', labels, [{
      data: values,
      backgroundColor: colorsFor(labels, colorMap),
      borderRadius: 4,
    }], {
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${Number(c.raw).toLocaleString()}` } }
      },
      scales: {
        x: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 11 } } },
        y: { grid: { display: false }, ticks: { font: { size: 11 }, crossAlign: 'far' } }
      }
    });
  }

  /* Vertical bar */
  function vBar(id, obj, colorMap, order) {
    let e = order
      ? order.map(k => [k, (obj || {})[k] || 0]).filter(x => x[1] > 0)
      : sorted(obj);
    if (!e.length) return;
    const labels = e.map(x => x[0]);
    const values = e.map(x => x[1]);
    makeChart(id, 'bar', labels, [{
      data: values,
      backgroundColor: colorsFor(labels, colorMap),
      borderRadius: 4,
    }], {
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${Number(c.raw).toLocaleString()}` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 11 } } }
      }
    });
  }

  /* Donut */
  function donut(id, obj, colorMap) {
    const e = sorted(obj);
    if (!e.length) return;
    const labels = e.map(x => x[0]);
    const values = e.map(x => x[1]);
    const total  = values.reduce((a, b) => a + b, 0);
    makeChart(id, 'doughnut', labels, [{
      data: values,
      backgroundColor: colorsFor(labels, colorMap),
      borderWidth: 2,
      borderColor: '#fff',
      hoverOffset: 6,
    }], {
      cutout: '62%',
      plugins: {
        legend: { display: true, position: 'bottom', labels: { font: { size: 11 }, padding: 10, usePointStyle: true, boxWidth: 8 } },
        tooltip: {
          callbacks: {
            label: c => ` ${c.label}: ${Number(c.raw).toLocaleString()} (${(c.raw / total * 100).toFixed(1)}%)`
          }
        }
      }
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     UTILITIES
  ═══════════════════════════════════════════════════════════════ */
  function fmt(n) {
    n = Number(n) || 0;
    return n.toLocaleString();
  }

  function pct(a, b) {
    if (!b) return '0%';
    return (a / b * 100).toFixed(1) + '%';
  }

  function kpi(label, value, hint, color) {
    return `<div class="kpi ${color || 'blue'}">
      <div class="lbl">${label}</div>
      <div class="val">${value}</div>
      ${hint ? `<div class="hint">${hint}</div>` : ''}
    </div>`;
  }

  /* ═══════════════════════════════════════════════════════════════
     CSS-BAR HELPERS  (for per-portfolio pages)
  ═══════════════════════════════════════════════════════════════ */
  function kpiBox(val, label, cls) {
    return `<div class="kpi-box ${cls}"><span class="kv">${val}</span><span class="kl">${label}</span></div>`;
  }

  /** Render sorted CSS bar rows normalised to `total`. */
  function barRowsHTML(obj, colorMap, total, topN) {
    const entries = sorted(obj, topN);
    if (!entries.length) return '<div style="font-size:.7rem;color:#94A3B8;padding:4px 0">No data</div>';
    return entries.map(([label, count], i) => {
      const w      = total > 0 ? Math.min(count / total * 100, 100).toFixed(1) : 0;
      const pctStr = total > 0 ? (count / total * 100).toFixed(1) : '0';
      const color  = (colorMap && colorMap[label]) ? colorMap[label] : PALETTE[i % PALETTE.length];
      return `<div class="bar-row">
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
        <span class="bar-name" title="${label}">${label}</span>
        <span class="bar-stat">${count.toLocaleString()}&ensp;${pctStr}%</span>
      </div>`;
    }).join('');
  }

  /** Age band CSS bars using fixed AGE_COLORS. */
  function ageBandRowsHTML(obj, total) {
    const entries = AGE_ORDER.map(k => [k, (obj || {})[k] || 0]).filter(e => e[1] > 0);
    if (!entries.length) return '<div style="font-size:.7rem;color:#94A3B8;padding:4px 0">No data</div>';
    return entries.map(([label, count]) => {
      const w      = total > 0 ? Math.min(count / total * 100, 100).toFixed(1) : 0;
      const pctStr = total > 0 ? (count / total * 100).toFixed(1) : '0';
      const color  = AGE_COLORS[label] || '#3B82F6';
      return `<div class="bar-row">
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
        <span class="bar-name">${label}</span>
        <span class="bar-stat">${count.toLocaleString()}&ensp;${pctStr}%</span>
      </div>`;
    }).join('');
  }

  /** District bars normalised to the top district (max = 100%). */
  function districtBarRowsHTML(obj, topN) {
    const entries = sorted(obj, topN);
    if (!entries.length) return '<div style="font-size:.7rem;color:#94A3B8;padding:4px 0">No data</div>';
    const maxV = entries[0][1] || 1;
    return entries.map(([label, count]) => {
      const w = (count / maxV * 100).toFixed(1);
      return `<div class="bar-row">
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:#F97316"></div></div>
        <span class="bar-name" title="${label}">${label}</span>
        <span class="bar-stat">${count.toLocaleString()}</span>
      </div>`;
    }).join('');
  }

     HTML BUILDERS
  ═══════════════════════════════════════════════════════════════ */

  /* ── Foundation Course ─────────────────────────────────────────────────── */
  function buildFoundationHTML(p) {
    const total    = p.stats.total;

    const wa       = p.weekly_activity || {};

    // ── Activity strip values ──────────────────────────────────────────
    const enrWeek  = wa.enrolled_this_week   || 0;
    const enrLWeek = wa.enrolled_last_week   || 0;
    const enrMonth = wa.enrolled_this_month  || 0;
    const cmpWeek  = wa.completed_this_week  || 0;
    const cmpLWeek = wa.completed_last_week  || 0;
    const cmpMonth = wa.completed_this_month || 0;

    // ── Progress band colours ──────────────────────────────────────────
    const BAND_COLORS = {
      'Completed (100%)': '#10B981',
      '75 \u2013 99%':   '#34D399',
      '50 \u2013 74%':   '#F59E0B',
      '25 \u2013 49%':   '#F97316',
      'Under 25%':       '#EF4444',
    };
    const bandTotal = Object.values(progBands).reduce((a,b)=>a+b,0) || 1;
    const progBandRows = Object.entries(progBands).map(([lbl, n]) => {
      const w   = Math.min(n / bandTotal * 100, 100).toFixed(1);
      const pct = (n / bandTotal * 100).toFixed(1);
      const c   = BAND_COLORS[lbl] || '#94A3B8';
      return `<div class="prog-band-row">
        <span class="pb-label">${lbl}</span>
        <div class="pb-track"><div class="pb-fill" style="width:${w}%;background:${c}"></div></div>
        <span class="pb-stat">${n.toLocaleString()}&ensp;${pct}%</span>
      </div>`;
    }).join('');

    // ── ESO performance rows — sorted by completion rate desc ──────────
    const esoSorted = Object.entries(byEso)
      .filter(([k]) => !['Test','Tests','Lofty','Curad','Leu','Uncdf'].includes(k))
      .sort((a, b) => b[1].completion_rate - a[1].completion_rate);

    const esoRows = esoSorted.map(([eso, d], i) => {
      const cr    = (d.completion_rate || 0).toFixed(1);
      const ap    = (d.avg_pct || 0).toFixed(0);

        <span class="eso-name">${rank}${eso}</span>
        <div class="eso-bar-wrap">
          <div class="eso-bar-fill" style="width:${cr}%;background:${color}"></div>
          <span class="eso-bar-label">${cr}%</span>
        </div>
        <span class="eso-stat">${d.completed.toLocaleString()}/${d.total.toLocaleString()}</span>
        <span class="eso-stat">avg&nbsp;${ap}%</span>
        <span class="eso-week">&#8593;${(d.comp_this_week||0)}&nbsp;wk</span>
      </div>`;
    }).join('') || '<div class="no-data-note">No ESO data</div>';

    // ── Module bars ────────────────────────────────────────────────────
    const modBars = Object.entries(modules).map(([label, m], i) => {
      return `<div class="bar-row">
        <div class="bar-track"><div class="bar-fill" style="width:${m.pct}%;background:${PALETTE[i % PALETTE.length]}"></div></div>

        <span class="bar-stat">${m.completed.toLocaleString()}&ensp;${m.pct}%</span>
      </div>`;
    }).join('') || '<div class="no-data-note">No module data</div>';

    // ── Top ESO this week (top 3 by comp_this_week) ────────────────────
    const topWeek = Object.entries(byEso)
      .filter(([k,d]) => (d.comp_this_week||0) > 0 && !['Test','Tests','Lofty'].includes(k))
      .sort((a,b) => (b[1].comp_this_week||0) - (a[1].comp_this_week||0))
      .slice(0, 5);
    const topWeekRows = topWeek.map(([eso, d], i) => {
      const medal = ['🥇','🥈','🥉','4.','5.'][i];

        <span style="font-size:.72rem;width:18px">${medal}</span>

      .filter(([k,d]) => (d.comp_this_month||0) > 0 && !['Test','Tests','Lofty'].includes(k))
      .sort((a,b) => (b[1].comp_this_month||0) - (a[1].comp_this_month||0))
      .slice(0, 5)
      .map(([eso, d], i) => {
        const medal = ['🥇','🥈','🥉','4.','5.'][i];

          <span style="font-size:.72rem;width:18px">${medal}</span>
          <span style="font-size:.72rem;font-weight:600;flex:1;color:#1E293B">${eso}</span>
          <span style="font-size:.68rem;color:#2563EB;font-weight:700">${d.comp_this_month} this mo</span>

        ${kpiBox(fmt(p.stats.completed || 0),   'Completed Course', 'kg')}
        ${kpiBox(compPct + '%',                 'Completion Rate',  'kb')}
        ${kpiBox(avgComp + '%',                 'Avg Progress',     'kp')}
        ${kpiBox(fmt(cmpWeek),                  'Completed This Wk','kt')}
        ${kpiBox(fmt(enrWeek),                  'Enrolled This Wk', 'kr')}
        ${kpiBox(Object.keys(byEso).length,     'ESO Partners',     'ka')}
      </div>

      <!-- Activity strip -->
      <div class="activity-strip">
        <div class="act-card act-green">
          <div class="act-val green">${fmt(cmpWeek)}</div>
          <div class="act-lbl">Completions<br>This Week</div>
        </div>

          <div class="act-val green">${fmt(cmpLWeek)}</div>

  /* ── EOI Programme Overview (all ESOs combined) ───────────────────────── */
  function buildEoiOverviewHTML(portfolios) {
    const total       = portfolios.reduce((s, p) => s + p.stats.total, 0);
    const totalUrsb   = portfolios.reduce((s, p) => s + (p.stats.ursb      || 0), 0);
    const totalPwd    = portfolios.reduce((s, p) => s + (p.stats.pwd       || 0), 0);
    const totalRef    = portfolios.reduce((s, p) => s + (p.stats.refugees  || 0), 0);
    const totalFound  = portfolios.reduce((s, p) => s + (p.total_founders  || 0), 0);
    const ursbPct     = total > 0 ? (totalUrsb / total * 100).toFixed(1) : '0';

    // Weighted female-founder percentage across all ESOs
    const femFoundSum = portfolios.reduce((s, p) => {
      const fp = (p.founders && p.founders.female_pct) ? p.founders.female_pct : 0;
      return s + fp * p.stats.total / 100;
    }, 0);
    const femalePct = total > 0 ? (femFoundSum / total * 100).toFixed(1) : '0';

    // ESO color assignment (stable order)
    const ESO_ORDER  = portfolios.slice().sort((a, b) => b.stats.total - a.stats.total);
    const ESO_COL    = ['#7C3AED','#0EA5E9','#10B981','#F59E0B','#EF4444','#EC4899','#14B8A6','#F97316'];
    const esoColorMap = {};
    ESO_ORDER.forEach((p, i) => { esoColorMap[p.eso || p.name] = ESO_COL[i % ESO_COL.length]; });

    // ESO applications object for bar chart
    const esoObj = {};
    ESO_ORDER.forEach(p => { esoObj[p.eso || p.name] = p.stats.total; });

    // Combined sectors, subsectors & districts
    const sectors     = {};
    const subsectors  = {};
    const districts   = {};
    const gender      = {};
    const ageBands    = {};
    const tinStatus   = {};
    const nssfStatus  = {};
    portfolios.forEach(p => {
      Object.entries(p.sectors   || {}).forEach(([k, v]) => { sectors[k]   = (sectors[k]   || 0) + v; });
      Object.entries(p.subsectors|| {}).forEach(([k, v]) => { subsectors[k]= (subsectors[k]|| 0) + v; });
      Object.entries(p.districts || {}).forEach(([k, v]) => { districts[k] = (districts[k] || 0) + v; });
      Object.entries((p.founders && p.founders.gender) || {}).forEach(([k, v]) => { gender[k] = (gender[k] || 0) + v; });
      Object.entries(p.age_bands || {}).forEach(([k, v]) => { ageBands[k] = (ageBands[k] || 0) + v; });
      Object.entries(p.tin_status || {}).forEach(([k, v]) => { tinStatus[k] = (tinStatus[k] || 0) + v; });
      Object.entries(p.nssf_status || {}).forEach(([k, v]) => { nssfStatus[k] = (nssfStatus[k] || 0) + v; });
    });
    const youthCount = (ageBands['18–25'] || 0) + (ageBands['26–35'] || 0);
    const youthPct = total > 0 ? (youthCount / total * 100).toFixed(1) : '0.0';
    const tinYes = tinStatus.Yes || tinStatus.YES || tinStatus.yes || 0;
    const nssfYes = nssfStatus.Yes || nssfStatus.YES || nssfStatus.yes || 0;
    const tinPct = total > 0 ? (tinYes / total * 100).toFixed(1) : '0.0';
    const nssfPct = total > 0 ? (nssfYes / total * 100).toFixed(1) : '0.0';
    const topEso = ESO_ORDER[0];
    const lowestVolume = ESO_ORDER[ESO_ORDER.length - 1];
    const highestUrsb = ESO_ORDER.slice().sort((a, b) => (b.ursb_pct || 0) - (a.ursb_pct || 0))[0];
    const lowestUrsb = ESO_ORDER.slice().sort((a, b) => (a.ursb_pct || 0) - (b.ursb_pct || 0))[0];
    const topDistrict = sorted(districts, 1)[0];
    const topSector = sorted(sectors, 1)[0];
    const rawDetailMissing = portfolios.filter(p => ((p.raw_records || [])[0] && Object.keys((p.raw_records || [])[0]).length <= 3)).length;
    const founderAnomalies = portfolios.filter(p => (p.total_founders || 0) > (p.stats.total || 0) * 3);
    const hasDateFields = portfolios.some(p => (p.raw_records || []).some(r => r.date || r.d || r._submission_time || r.submission_time));
    const signalCard = (label, value, note, color) => `
      <div class="insight ${color || 'info'}">
        <strong style="display:block;color:#0F172A;margin-bottom:2px">${label}</strong>
        <span style="font-size:.9rem;font-weight:800;color:#1E293B">${value}</span>
        <span style="display:block;margin-top:2px">${note}</span>
      </div>`;

    // Coloured bar-strip proportional to each ESO share
    const stripDivs = ESO_ORDER.map((p, i) => {
      const w = (p.stats.total / total * 100).toFixed(1);
      return `<div style="width:${w}%;background:${ESO_COL[i % ESO_COL.length]}"></div>`;
    }).join('');

    // ESO summary mini-cards
    const esoCardHTML = (p, i) => {
      const c       = ESO_COL[i % ESO_COL.length];
      const fPct    = (p.founders && p.founders.female_pct != null) ? p.founders.female_pct.toFixed(0) + '%' : '—';
      const topSec  = Object.entries(p.sectors || {}).sort((a, b) => b[1] - a[1])[0];
      const sharePct = (p.stats.total / total * 100).toFixed(0);
      return `<div style="background:#F8FAFC;border-radius:8px;padding:10px 12px;border-left:3px solid ${c};margin-bottom:7px">

          <div style="font-size:1.05rem;font-weight:800;color:${c}">${p.stats.total.toLocaleString()}</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:.61rem;color:#64748B">
          <span>&#9792; ${fPct} female</span>
          <span>URSB: ${p.ursb_pct || 0}%</span>
          <span>${sharePct}% of total</span>
          ${topSec ? `<span style="color:#475569;font-style:italic">${topSec[0]}</span>` : ''}
        </div>
      </div>`;
    };
    const esoCards = ESO_ORDER.slice(0, 5).map(esoCardHTML).join('');
    const esoCardsRest = ESO_ORDER.slice(5).map((p, i) => esoCardHTML(p, i + 5)).join('');
    const esoSummaryNote = ESO_ORDER.length > 5
      ? `<button type="button" class="summary-toggle" onclick="const panel=this.previousElementSibling;panel.classList.toggle('open');this.textContent=panel.classList.contains('open')?'Show top 5 only':'Show all ${ESO_ORDER.length} ESOs';">Show all ${ESO_ORDER.length} ESOs</button>`
      : '';

    // URSB rates bar rows (manual — not using barRowsHTML to allow % display)
    const ursbRateRows = ESO_ORDER
      .slice().sort((a, b) => (b.ursb_pct || 0) - (a.ursb_pct || 0))
      .map((p, i) => {
        const c   = esoColorMap[p.eso || p.name];
        const pct = p.ursb_pct || 0;
        const w   = Math.min(pct * 5, 100); // scale: 20% URSB = full bar
        return `<div style="display:grid;grid-template-columns:130px 1fr 42px;align-items:center;gap:6px;margin-bottom:7px">
          <div class="bar-name">${p.eso || p.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${c}"></div></div>
          <div class="bar-stat">${pct}%</div>
        </div>`;
      }).join('');

    return `
      <div class="port-header">
        <div class="port-bar-strip">${stripDivs}</div>
        <div class="port-title-area">
          <div class="port-title">EOI Programme &mdash; All ESOs Overview</div>
        </div>
      </div>

      <div class="kpi-strip-7">
        ${kpiBox(fmt(total),        'Total Applications',  'ko')}
        ${kpiBox(portfolios.length, 'ESO Partners',        'kp')}
        ${kpiBox(fmt(totalUrsb),    'URSB Registered',     'kg')}
        ${kpiBox(ursbPct + '%',     'URSB Rate',           'kb')}
        ${kpiBox(femalePct + '%',   'Female Founders',     'kp')}
        ${kpiBox(totalPwd,          'PWD',                 'kr')}
        ${kpiBox(totalRef,          'Refugees',            'kt')}
      </div>

      <div class="landing-grid three">
        <div class="landing-card">
          <h3>Demographic Snapshot</h3>
          <div class="chart-wrap squat"><canvas id="_eoi-gender"></canvas></div>
          <div class="sub-hdr purple-txt" style="margin-top:10px">AGE GROUPS</div>
          <div class="chart-wrap squat"><canvas id="_eoi-age"></canvas></div>
          <div class="insight info" style="margin-top:8px">${fmt(youthCount)} applicants are in the 18-35 age bands (${youthPct}% of EOIs).</div>
        </div>
        <div class="landing-card">
          <h3>Conversion Readiness</h3>
          <div class="chart-wrap squat"><canvas id="_eoi-readiness"></canvas></div>
          <div class="snapshot-list" style="margin-top:8px">
            <div class="snapshot-row"><span>URSB Registered</span><div class="mini-track"><div class="mini-fill" style="width:${ursbPct}%;background:#059669"></div></div><strong>${ursbPct}%</strong></div>
            <div class="snapshot-row"><span>TIN Present</span><div class="mini-track"><div class="mini-fill" style="width:${tinPct}%;background:#2563EB"></div></div><strong>${tinPct}%</strong></div>
            <div class="snapshot-row"><span>NSSF Present</span><div class="mini-track"><div class="mini-fill" style="width:${nssfPct}%;background:#7C3AED"></div></div><strong>${nssfPct}%</strong></div>
          </div>
        </div>
        <div class="landing-card">
          <h3>Performance Signals</h3>
          <div class="insight-list">
            ${topEso ? signalCard('Highest EOI Volume', topEso.eso || topEso.name, `${fmt(topEso.stats.total)} applications`, 'good') : ''}
            ${highestUrsb ? signalCard('Highest URSB Rate', highestUrsb.eso || highestUrsb.name, `${highestUrsb.ursb_pct || 0}% registered`, 'info') : ''}
            ${lowestUrsb ? signalCard('Lowest URSB Rate', lowestUrsb.eso || lowestUrsb.name, `${lowestUrsb.ursb_pct || 0}% registered`, 'warn') : ''}
            ${lowestVolume ? signalCard('Lowest EOI Volume', lowestVolume.eso || lowestVolume.name, `${fmt(lowestVolume.stats.total)} applications`, 'info') : ''}
          </div>

      <div class="landing-grid two">
        <div class="landing-card">
          <h3>Data Quality Checks</h3>
          <div class="insight-list">
            ${signalCard('Generated Records', fmt(total), `${portfolios.length} EOI datasets included`, 'info')}
            ${rawDetailMissing ? signalCard('Raw Detail Limitation', `${rawDetailMissing} datasets`, 'Generated EOI records contain only compact fields, so missing phone/name/district checks need extractor support.', 'warn') : signalCard('Raw Detail Availability', 'Available', 'Detailed raw records are present for completeness checks.', 'good')}
            ${founderAnomalies.length ? signalCard('Founder Count Needs Review', `${founderAnomalies.length} dataset(s)`, founderAnomalies.map(p => p.eso || p.name).join(', '), 'warn') : signalCard('Founder Count Check', 'No major anomaly', 'No dataset has founders above 3x application count.', 'good')}
            ${hasDateFields ? signalCard('Trend Readiness', 'Date fields found', 'EOI trend charts can be generated from submission dates.', 'good') : signalCard('Trend Readiness', 'Date fields missing', 'The generated EOI records do not include submission dates, so trend-over-time is hidden until extraction includes dates.', 'warn')}
          </div>
        </div>
        <div class="landing-card">
          <h3>Alerts &amp; Insights</h3>
          <div class="insight-list">
            ${topSector ? signalCard('Largest Sector', topSector[0], `${fmt(topSector[1])} applications`, 'good') : ''}
            ${topDistrict ? signalCard('Largest District', topDistrict[0], `${fmt(topDistrict[1])} applications`, 'info') : ''}
            ${Number(ursbPct) < 10 ? signalCard('Registration Gap', `${ursbPct}% URSB rate`, 'Registration support is likely a major follow-up opportunity.', 'warn') : signalCard('Registration Signal', `${ursbPct}% URSB rate`, 'URSB registration is visible across the EOI pool.', 'good')}
            ${Number(femalePct) >= 70 ? signalCard('Gender Signal', `${femalePct}% female founders`, 'The EOI pool is strongly women-led.', 'good') : signalCard('Gender Signal', `${femalePct}% female founders`, 'Monitor gender balance across ESOs.', 'info')}
